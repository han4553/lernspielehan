<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kampagnen-Werkstatt</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0f1b2d;color:#1d2433;min-height:100vh}
header{padding:22px 16px;text-align:center;color:#fff;background:linear-gradient(120deg,#ff3d6e,#ff9f1c 50%,#2ec4b6)}
header h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem)}
header p{margin:6px 0 0;opacity:.95}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.stepper button{border:none;border-radius:999px;padding:8px 12px;font-weight:600;cursor:pointer;background:#24324d;color:#cfd8ea;font:inherit;font-size:.9rem}
.stepper button.on{background:#fff;color:#0f1b2d}
.stepper button.done{background:#2ec4b6;color:#0f1b2d}
.stage{background:#fff;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.35);border-top:8px solid var(--accent)}
.stage h2{margin:0 0 6px;color:var(--accent);font-size:1.6rem}
.sub{color:#5c6679;margin:0 0 16px}
.card{border:2px dashed var(--accent);border-radius:14px;padding:16px;margin:14px 0;background:color-mix(in srgb,var(--accent) 8%,#fff)}
.card.solid{border-style:solid}
.fact{background:#1d2433;color:#fff;border-radius:12px;padding:14px 16px;margin:14px 0}
.fact b{color:#ffd60a}
.rolle{display:inline-block;background:var(--accent);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700;font-size:.9rem}
.big{font-size:3.2rem;line-height:1}
.prod{display:flex;gap:14px;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols h4{margin:10px 0 4px;color:var(--accent)}
.cols ul{margin:0;padding-left:18px}
label.lbl{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 12px;border:2px solid #d5deea;border-radius:10px;font:inherit;background:#f4f8fc}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.hint{font-size:.85rem;color:#5c6679}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid #d5deea;border-radius:10px;margin:6px 0;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.baustein{border:2px solid var(--accent);background:#fff;color:var(--accent);padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600}
.chip.on{background:var(--accent);color:#fff}
.baustein:hover{background:var(--accent);color:#fff}
.btn{border:none;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
.btn.ghost{background:#eef2f8;color:#1d2433}
.live-ro > *:not(#liveBar):not(.askov){pointer-events:none}
#liveBar{position:sticky;top:0;z-index:9000;background:#1d2433;color:#fff;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#liveBar .lb1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#liveBar .hint{color:#cbd5e1}#liveBar select{font:inherit;padding:5px 8px;border-radius:8px;max-width:60vw}
#liveBar .lb2{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
#liveBar .lchip{flex:0 0 auto;border:0;border-radius:99px;padding:4px 10px;background:#334155;color:#fff;font:inherit;font-size:.85rem;cursor:pointer}
#liveBar .lchip.on{background:#f59e0b;color:#1d2433;font-weight:800}#liveBar .lchip small{opacity:.8}
#liveBar .bad{color:#fca5a5;margin-top:4px}
.askov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.askbox{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);font-size:1.05rem}
.askbox .nav{justify-content:flex-end;gap:10px;display:flex;flex-wrap:wrap}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.kanal{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e6ecf4}
.bar{height:14px;background:#e6ecf4;border-radius:999px;overflow:hidden;margin:10px 0}
.bar div{height:100%;background:var(--accent);transition:width .3s}
.status{font-weight:700;margin:6px 0}
.ok{color:#15803d}.bad{color:#b91c1c}
.draw{border:2px solid #d5deea;border-radius:12px;padding:10px;margin:12px 0;background:#fafcff}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tbtn{border:2px solid #d5deea;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.9rem;color:#1d2433;text-decoration:none}
.tbtn.on{border-color:var(--accent);background:var(--accent);color:#fff}
.tools input[type=color]{width:42px;height:34px;border:none;background:none;padding:0}
.tools input[type=range]{width:120px}
canvas{display:block;max-width:100%;height:auto;background:#fff;border-radius:8px;cursor:crosshair;touch-action:none;box-shadow:inset 0 0 0 1px #d5deea}
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.frame{border:2px solid #d5deea;border-radius:12px;padding:10px;background:#fff}
.frame h4{margin:0 0 6px}
table.clip{width:100%;border-collapse:collapse}
table.clip th,table.clip td{padding:6px;border-bottom:1px solid #e6ecf4;text-align:left;vertical-align:top}
table.clip input{padding:7px}
.timer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.timer .bar{flex:1;min-width:160px;margin:0}
details{background:#f4f8fc;border-radius:12px;padding:12px 16px;margin:14px 0}
details>summary{cursor:pointer;font-weight:800;color:var(--accent);font-size:1.1rem}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:9px 12px;border-radius:10px;margin:6px 0;background:#f4f8fc}
.score{font-size:2.4rem;font-weight:800;color:var(--accent);text-align:center;margin:12px 0}
pre{white-space:pre-wrap;background:#f4f8fc;border-radius:10px;padding:14px;font:inherit;font-size:.92rem;border:1px solid #d5deea}
.los{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.los input{max-width:180px}
.flip{animation:flip .5s ease}
@keyframes flip{0%{transform:rotateY(90deg);opacity:0}100%{transform:none;opacity:1}}
.stage{animation:pop .25s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.tools .sep{width:1px;background:#d5deea;align-self:stretch;margin:0 4px}
.swatches{display:flex;flex-wrap:wrap;gap:4px;max-width:150px}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid #d5deea;cursor:pointer;padding:0}
.tools label.tbtn{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.prodimg{background:#fff;border-radius:12px;padding:8px;max-width:340px;margin:12px 0;box-shadow:0 0 0 1px #d5deea}
.prodimg svg{width:100%;height:auto;display:block}
.hints{background:#fff8e1;border-left:6px solid #f0a500;border-radius:10px;padding:12px 16px;margin:18px 0}
.hints summary{cursor:pointer;font-weight:800;color:#8a5a00}
.hints p{margin:8px 0}
.reflex{margin-top:14px}
.reflex .lbl{color:#fff}
.tools-info{background:#eef6ff;border-left:6px solid #2a7fa8;border-radius:10px;padding:12px 16px;margin:18px 0}
.tools-info summary{cursor:pointer;font-weight:800;color:#1d4e6e}
.tools-info li{margin:6px 0}
.tools-info a{color:#2a7fa8}
.ki-box{background:#f3f0ff;border-left:6px solid #7b5cff;border-radius:10px;padding:12px 16px;margin:18px 0}
.ki-box summary{cursor:pointer;font-weight:800;color:#4b2fb3}
.ki-box textarea{font-family:monospace;font-size:.88rem}
.prodtools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.prodtools input[type=range]{width:180px;vertical-align:middle}
.prodtools input[type=color]{width:46px;height:34px;border:none;background:none;padding:0;vertical-align:middle}
.foto-box canvas{display:block;max-width:100%;height:auto;border-radius:8px;box-shadow:inset 0 0 0 1px #d5deea}
.vierp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.vierp{background:#E8F4F8;border-radius:12px;padding:12px;border-top:5px solid #1A3C6E}
.vierp p{margin:6px 0;font-size:.92rem}
.vierp-head{font-weight:800;color:#1A3C6E}
.fall-box{border-color:#e4572e;background:#fff5f0}
.fall-text{font-size:1.05rem;background:#fff;border-radius:10px;padding:12px;border-left:5px solid #e4572e}
.fb{border-radius:8px;padding:8px 12px;margin:6px 0 10px;font-weight:600}
.fb-ok{background:#e7f8ec;color:#15803d}
.fb-mid{background:#fff8e1;color:#8a5a00}
.fb-risk{background:#fdecec;color:#b91c1c}
.bildsuche{background:#fff;border:2px solid #d5deea;border-radius:12px;padding:12px 14px;margin:12px 0}
.ki-foto{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid #d5deea;border-radius:12px;padding:10px;margin:12px 0}
.ki-foto img{width:min(100%,360px);border-radius:8px;display:block}
.ki-foto>div{flex:1;min-width:200px}
.comic-player canvas{width:100%;max-width:640px;height:auto;display:block;border-radius:10px;background:#000}
.comic-scene{border:2px solid #d5deea;border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff}
.comic-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.comic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:6px;align-items:center}
.comic-grid label{font-weight:600;font-size:.9rem}
.comic-grid select,.comic-grid input[type=number]{width:auto;padding:6px 8px}
.comic-scene .chip{padding:4px 9px;font-size:1rem}
.d3-box{border-color:#3a86ff;background:#f3f7ff}
.d3-box canvas{display:block;width:100%;max-width:640px;height:auto;border-radius:12px;cursor:grab;touch-action:none;box-shadow:inset 0 0 0 1px #d5deea;background:#fff}
.d3-box h4{margin:14px 0 4px}
.d3-box select{width:auto;padding:6px 8px}
.vote-item{background:#fff;border:2px solid #d5deea;border-radius:12px;padding:10px 14px;margin:8px 0}
.vote-item.done{border-color:#2ec4b6;background:#f0fbf9}
.vote-item summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vote-nr{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#1d2433;color:#fff;font-size:.85rem}
.vote-avg{margin-left:auto;background:#2ec4b6;color:#fff;border-radius:999px;padding:2px 10px;font-size:.85rem}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.vote-grid label{font-weight:600;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.auswertung{background:#fff8e1;border-left:6px solid #f0a500;border-radius:10px;padding:12px 16px;margin:18px 0}
.auswertung summary{cursor:pointer;font-weight:800;color:#8a5a00}
.vote-table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:12px;background:#fff}
.vote-table th,.vote-table td{padding:6px;border-bottom:1px solid #e6ecf4;text-align:left}
.vote-table th{background:#1A3C6E;color:#fff}
.podest{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin:16px 0}
.pod{background:#fff;border-radius:12px 12px 0 0;text-align:center;padding:10px;box-shadow:0 0 0 2px #d5deea;position:relative}
.pod-e{font-size:2.2rem}
.pod-s{margin-top:8px;color:#fff;font-weight:900;font-size:1.8rem;border-radius:8px}
.p1 .pod-s{background:#f0a500;height:110px;display:grid;place-items:center}
.p2 .pod-s{background:#9aa5b1;height:80px;display:grid;place-items:center}
.p3 .pod-s{background:#bc6c25;height:55px;display:grid;place-items:center}
.fall-sit{border-color:#1A3C6E;background:#E8F4F8}
.fall-sit p{margin:6px 0}
.fall-auftrag{background:#fff;border-left:5px solid #1A3C6E;border-radius:8px;padding:8px 12px}
.fall-mini{background:#E8F4F8;border-left:6px solid #1A3C6E;border-radius:10px;padding:10px 14px;margin:0 0 12px;color:#1d2433}
.fall-mini summary{cursor:pointer;font-weight:800;color:#1A3C6E}
.coach-box{background:#eefaf3;border-left:6px solid #2b9348;border-radius:10px;padding:12px 16px;margin:18px 0}
.coach-box summary{cursor:pointer;font-weight:800;color:#1f6f35}
.rec-box{background:#fff;border:2px solid #d5deea;border-radius:12px;padding:12px;margin-top:12px}
.foto3d-box{background:#fff;border:2px solid #d5deea;border-radius:12px;padding:10px 12px;margin-top:8px}
.skin-load{background:#fff;border:2px dashed #3a86ff;border-radius:12px;padding:10px 12px;margin:10px 0}
.skin-thumb{width:46px;height:46px;object-fit:cover;border-radius:8px;box-shadow:0 0 0 1px #d5deea}
#roomBar{position:sticky;top:0;z-index:50;background:#1A3C6E;color:#fff;padding:8px 14px;font-size:.9rem;text-align:center}
.join-box{border-color:#1A3C6E;background:#E8F4F8}
.teach-entry{border-color:#1A3C6E;background:#fff}
#teacher{position:fixed;inset:0;z-index:900;background:#0f1b2d;overflow:auto;display:none}
.t-wrap{max-width:1150px;margin:0 auto;padding:16px;--accent:#1A3C6E}
.t-wrap .card{background:#fff}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#fff}
.t-head h2,.t-head h3{margin:8px 0}
.pm-in .t-head{color:#1d2433}
.t-code{background:#ffd60a;color:#1d2433;border-radius:8px;padding:2px 10px;letter-spacing:.15em}
.t-grid{display:grid;grid-template-columns:320px 1fr;gap:14px}
.t-qr{text-align:center}
.t-qr canvas{max-width:100%;height:auto}
.t-phases{display:flex;gap:8px;flex-wrap:wrap}
.t-table td,.t-table th{vertical-align:middle}
#beamer{position:fixed;inset:0;z-index:1000;background:#fff;display:none;align-items:center;justify-content:center;text-align:center}
.beam-in h1{margin:0;color:#1A3C6E}
.beam-in canvas{max-width:80vmin;height:auto}
.beam-link{font-size:1.4rem;font-weight:700;word-break:break-all;padding:0 16px}
.beam-code{font-size:2.6rem;font-weight:900;letter-spacing:.2em;color:#e5385f;margin:6px 0 14px}
#pitchModal{position:fixed;inset:0;z-index:1001;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
.pm-in{background:#fff;border-radius:14px;padding:16px;max-width:760px;width:100%;max-height:88vh;overflow:auto}
@media (max-width:760px){.t-grid{grid-template-columns:1fr}}
.faces-box{border-color:#7b5cff;background:#f6f3ff}
.face{background:#fff;border:2px solid #d5deea;border-radius:12px;padding:10px;margin:8px 0}
.face select,.face input[type=number]{width:auto;padding:6px 8px}
.loes{border-bottom:1px solid #e6ecf4;padding:6px 0 10px}
.loes h4{margin:10px 0 4px;color:#1A3C6E}
.loes p{margin:4px 0}
.pm-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.pm-cols{grid-template-columns:1fr}}
.design{border:3px solid var(--accent);border-radius:16px;padding:14px;margin:16px 0;background:#fffaf2}
.design-top{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:center}
.design-steps{margin:6px 0;padding-left:20px}
.design-steps li{margin:2px 0}
.my-prod{background:#fff;border:2px dashed #d5deea;border-radius:12px;padding:8px;text-align:center;transition:box-shadow .3s}
.my-prod img{width:100%;border-radius:8px;display:block;margin-bottom:4px}
.my-prod.flash{box-shadow:0 0 0 6px #2ec4b6}
.my-empty{font-size:3rem;padding:20px 0;color:#9aa5b1;display:flex;flex-direction:column;align-items:center}
.my-empty span{font-size:.85rem}
.design-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.dtab{border:3px solid #d5deea;background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;color:#1d2433}
.dtab b{font-size:1.05rem}
.dtab span{font-size:.82rem;color:#5c6679}
.dtab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,#fff);box-shadow:0 4px 0 var(--accent)}
.design-body .d3-box,.design-body .foto-box{margin-top:6px}
@media (max-width:700px){.design-top{grid-template-columns:1fr}.design-tabs{grid-template-columns:1fr}}
.part-hint{background:#fff8e1;border-left:5px solid #f0a500;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:.92rem}
.part-panel{background:#fffbe6;border:3px solid #ffd60a;border-radius:12px;padding:10px 12px;margin:10px 0}
.part-panel select{width:auto;padding:6px 8px}
.wm-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.wm-card{border:3px solid #d5deea;background:#fff;border-radius:16px;padding:16px;cursor:pointer;font:inherit;text-align:left;display:flex;flex-direction:column;gap:6px;color:#1d2433}
.wm-card b{font-size:1.15rem}
.wm-card span{font-size:.88rem;color:#5c6679}
.wm-card .wm-e{font-size:2.4rem}
.wm-card .wm-st{margin-top:4px;font-weight:700;color:var(--accent)}
.wm-card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff);box-shadow:0 5px 0 var(--accent)}
.wm-box{border:2px solid #d5deea;border-radius:16px;padding:14px;margin:16px 0;background:#fff}
.wm-box h3{margin:0 0 6px;color:var(--accent)}
.ig-grid{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.ig-ctrl h4{margin:12px 0 4px}
.ig-ctrl textarea{min-height:70px}
.ig-bgs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ig-bg{width:38px;height:38px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 2px #d5deea;cursor:pointer}
.ig-bg.on{box-shadow:0 0 0 3px var(--accent)}
.ig-prev{position:sticky;top:10px}
.ig{background:#fff;border:1px solid #dbdbdb;border-radius:10px;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#262626;max-width:380px;margin:0 auto}
.ig-head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ig-head small{display:block;color:#8e8e8e;font-size:.75rem}
.ig-ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #e1306c;font-size:1.1rem}
.ig-more{margin-left:auto;font-weight:700}
.ig-img{display:block;width:100%;height:auto;background:#eee}
.ig-story .ig-img{max-height:560px;object-fit:cover}
.ig-cta{display:flex;justify-content:space-between;background:#0095f6;color:#fff;font-weight:700;padding:9px 12px;font-size:.9rem}
.ig-act{display:flex;gap:14px;padding:10px 12px 4px;font-size:1.35rem}
.ig-save{margin-left:auto}
.ig-likes{padding:0 12px;font-weight:700;font-size:.88rem}
.ig-cap{padding:4px 12px 12px;font-size:.88rem;line-height:1.4;white-space:pre-wrap}
.ig-tags{color:#00376b}
@media (max-width:820px){.ig-grid{grid-template-columns:1fr}.wm-choice{grid-template-columns:1fr}.ig-prev{position:static}}
.pt-legend{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.pt-legend span{background:#fff;border:2px solid #f3c1cc;border-radius:999px;padding:3px 10px;font-size:.85rem}
.pt-list{margin-top:10px}
.pt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f2f6}
.pt-lbl{display:flex;flex-direction:column}
.pt-lbl span{font-size:.82rem;color:#5c6679}
.pt-scale{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pt{width:38px;height:38px;border-radius:50%;border:2px solid #e5385f;background:#fff;color:#e5385f;font:inherit;font-weight:800;cursor:pointer}
.pt.on{background:#e5385f;color:#fff}

  ['Kundengruppe gewählt', s=>s.ziel>=0],
  ['Absatzgebiet gewählt', s=>s.absatz>=0],
  ['3 USPs formuliert', s=>s.usps.every(u=>u.trim())],
  ['1–2 Tonalitäten gewählt', s=>s.tone.length>=1 && s.tone.length<=2],
  ['Slogan vorhanden (max. 40 Zeichen)', s=>{const l=s.slogan.trim().length; return l>0 && l<=40;}],
  ['4P-Mix ausgefüllt (Preisstrategie, Vertriebsweg, Promotion)', s=>!!(s.vierp && s.vierp.strat && s.vierp.wege.length && s.vierp.promotion.trim())],
  ['Mindestens ein Marktereignis bearbeitet', s=>(s.faelleDone||[]).length>=1],
  ['Budget genau 5.000 € verplant', s=>sumKanal(s)===BUDGET],
  ['Mindestens ein Werbemittel gewählt', s=>s.werbemittel.length>=1],
  ['Werbemittel inhaltlich gefüllt', s=>werbemittelGefuellt(s)],
  ['Call-to-Action formuliert', s=>s.idee.cta.trim().length>0],
  ['Lösung der Fallsituation begründet', s=>(s.loesung||'').trim().length>60]
];

let PRODUKTE = loadProdukte();
let S = loadState();
let DT = {tool:'pen', color:'#1d2433', size:4, fillShape:false};
let TMR = null, TSEC = 0;

function defaultState(){
  return {
    los:null, step:0, ziel:-1, absatz:-1,
    usps:['','',''], beduerf:'', tone:[], slogan:'', kanal:{}, werbemittel:[],
    idee:{hook:'',cta:''}, plakat:{text:''},
    spot:{frames:['','','',''], musik:''},
    clip:[{ein:'',dauer:'',ton:''},{ein:'',dauer:'',ton:''},{ein:'',dauer:'',ton:''},{ein:'',dauer:'',ton:''},{ein:'',dauer:'',ton:''}],
    radio:{skript:'',sprecher:'',musik:'',sfx:''},
    bilder:{}
  };
}
function loadState(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.usps){ return Object.assign(defaultState(), s); } } catch(e){}
  return defaultState();
}
function saveState(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ console.warn('Speicher voll', e); if(!window._memWarn){ window._memWarn=true; toast('Der Browserspeicher ist voll. Bitte Bilder als PNG herunterladen, Foto entfernen oder ein kleineres Bild verwenden.'); } } }
function loadProdukte(){
  try { const p = JSON.parse(localStorage.getItem(PKEY)); if(Array.isArray(p) && p.length) return p; } catch(e){}
  return PRODUKTE_STANDARD;
}
function produkt(){ return S.los ? PRODUKTE[S.los-1] : null; }
function rolle(){ return ROLLEN[((S.los||1)-1) % ROLLEN.length]; }
function sumKanal(s){ return Object.values(s.kanal).reduce((a,b)=>a+(+b||0),0); }
function werbemittelGefuellt(s){
  return (s.werbemittel.includes('insta') && !!(s.insta && (s.insta.head.trim()||s.insta.caption.trim()))) ||
         (s.werbemittel.includes('comic') && !!(s.comic && s.comic.scenes.some(x=>x.bubble.trim()||x.bg==='end'))) ||
         (s.werbemittel.includes('spot') && s.spot.frames.some(f=>f.trim())) ||
         (s.werbemittel.includes('clip') && s.clip.some(c=>c.ein.trim())) ||
         (s.werbemittel.includes('radio') && s.radio.skript.trim().length>0);
}
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setPath(obj, path, val){
  const p = path.split('.'); let o = obj;
  for(let i=0;i<p.length-1;i++) o = o[p[i]];
  o[p[p.length-1]] = val;
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=>o==null?o:o[k], obj); }

/* ---------- Navigation ---------- */
function gehe(i){
  if(i<0 || i>8) return;
  if(i>=1 && !S.los){ toast(S.room?'Deine Lehrkraft teilt dir gleich ein Produkt zu.':'Bitte zuerst dein Los ziehen!'); return; }
  if(S.room && ROOM_META && ROOM_META.state==='lobby' && i>1){ toast('Warte, bis deine Lehrkraft die Arbeitsphase startet.'); return; }
  S.step = i; saveState(); render(); window.scrollTo({top:0,behavior:'smooth'}); if(S.room) roomReport(true);
}
function renderChrome(){
  document.getElementById('stepper').innerHTML = STUFEN.map((t,i)=>{
    const cls = i===S.step ? 'on' : (i<S.step && S.los ? 'done' : '');
    return `<button class="${cls}" onclick="gehe(${i})">${i}. ${t}</button>`;
  }).join('');
  document.getElementById('prevBtn').style.visibility = S.step===0 ? 'hidden' : 'visible';
  const nb = document.getElementById('nextBtn');
  nb.style.display = S.step===8 ? 'none' : '';
  nb.textContent = S.step===6 ? 'Zum Pitch-Check →' : S.step===7 ? 'Zur Abstimmung →' : 'Weiter →';
  document.getElementById('navBar').style.display = '';
  document.body.style.setProperty('--accent', ACC[S.step]||'#ff3d6e');
}
function render(){
  renderChrome();
  const fns = [stLos, stProdukt, stMarkt, stSlogan, stVierP, stKanal, stWerbemittel, stPitch, stVote];
  if(!S.reflex) S.reflex={};
  document.getElementById('stage').innerHTML = (S.step>=2&&S.step<=7?situationBox(false):'') + fns[S.step]() + extraBoxes() + hintBox(S.step);
  afterRender();
}

/* ---------- Stage 1: Produkt + Malen ---------- */
function resetDesign(){ S.foto=null; S.d3=null; S.bilder={}; S.farbe={}; S.groesse={}; D3_MESH=null; FOTO3D.key=''; FOTO3D.mesh=null; }

  if(S.foto && S.foto.src && Object.values(PRODUKT_FOTOS).includes(S.foto.src) && S.foto.src!==PRODUKT_FOTOS[S.los-1]) S.foto=null;

  ['3d','🧊 3D-Modell','Fertiges 3D-Modell drehen und mit Farbe, Material, Form und Etikett gestalten.'],

];

        <div><h4>Kundengruppen</h4><ul>${p.kunden.map(k=>`<li>${escapeHtml(k)}</li>`).join('')}</ul>

function skriptInfo(){
  const w = S.radio.skript.trim().split(/\s+/).filter(Boolean).length;

}

  return `<section class="stage" style="--accent:${ACC[7]}">
    <h2>🏆 Pitch-Check</h2>
    <p class="sub">Prüfe deine Kampagne. Offene Punkte gehst du in den vorherigen Stufen an.</p>

    <div class="score">${ok} / ${CHECKS.length} erfüllt (${pct} %)</div>
    <div class="card solid">
      <h3 style="margin-top:0">📂 Lösung der Fallsituation</h3>
      <p class="hint"><b>Ziel:</b> ${escapeHtml((situation()||{}).ziel||'')} · <b>Erfolgskennzahl:</b> ${escapeHtml((situation()||{}).kpi||'')}</p>

      <button class="btn btn-praes" data-praes>▶ Präsentation starten</button>
    </div>
    <h3>Pitch-Zusammenfassung</h3>
    <pre>${escapeHtml(pitchText())}</pre>
    <div class="nav noprint">
      <button class="btn" data-kopieren>📋 Kopieren</button>
      <button class="btn ghost" onclick="window.print()">🖨️ Drucken</button>

    <div class="fact"><b>Side Fact:</b> Auch große Kampagnen werden getestet, bevor sie live gehen. Feedback ist Teil des Jobs.</div>

}
function pitchText(){
  const p = produkt();
  if(!p) return '(Noch kein Los gezogen)';
  const ziel = S.ziel>=0 ? p.kunden[S.ziel] : '–';
  const gebiet = S.absatz>=0 ? p.absatz[S.absatz] : '–';
  const kanaele = Object.entries(S.kanal).map(([k,v])=>`  • ${k}: ${v} €`).join('\n') || '  –';
  const wm = S.werbemittel.filter(w=>w==='insta'||w==='comic').map(w=>({insta:'Instagram-Beitrag',comic:'Werbeclip'})[w]).join(', ') || '–';
  const igTxt = S.werbemittel.includes('insta')&&S.insta ? `\nInstagram: „${S.insta.head}“ – ${S.insta.caption} ${S.insta.tags}` : '';
  const si=situation();
  return `PITCH: ${p.n}
${si?`\nFALLSITUATION (${si.firma}):\n  Lage: ${si.lage}\n  Ziel: ${si.ziel}\n  Erfolgskennzahl: ${si.kpi}\n  Unsere Lösung: ${S.loesung||'–'}\n`:''}
Produktmerkmale:
${p.merk.map(m=>'  • '+m).join('\n')}

Kundengruppe: ${ziel}
Absatzgebiet: ${gebiet}
Bedürfnis: ${S.beduerf||'–'}

USPs:
  1. ${S.usps[0]||'–'}
  2. ${S.usps[1]||'–'}
  3. ${S.usps[2]||'–'}

Tonalität: ${S.tone.join(', ')||'–'}
Slogan: „${S.slogan||'–'}“

4P-Mix:
  • Product: ${(S.vierp||{}).product||'–'}
  • Price: ${p.preis}, ${(S.vierp||{}).strat||'–'} ${(S.vierp||{}).price||''}
  • Place: ${((S.vierp||{}).wege||[]).join(', ')||'–'} ${(S.vierp||{}).place||''}
  • Promotion: ${(S.vierp||{}).promotion||'–'}

function polyPts(p,W,H){
  const x=p.x*W, y=p.y*H, w=p.w*W, h=p.h*H, cx=x+w/2, cy=y+h/2;
  if(p.t==='tri') return [[cx,y],[x+w,y+h],[x,y+h]];
  if(p.t==='star'){
    const outer=Math.min(w,h)/2, inner=outer*0.45, pts=[];
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?inner:outer; pts.push([cx+rad*Math.cos(a), cy+rad*Math.sin(a)]); }
    return pts;
  }
  if(p.t==='arrow') return [[0,.3],[.6,.3],[.6,0],[1,.5],[.6,1],[.6,.7],[0,.7]].map(([u,v])=>[x+u*w, y+v*h]);
  return null;
}
function drawPart(ctx,W,H,p){
  ctx.globalAlpha=1;
  ctx.fillStyle = p.c || '#000000';
  ctx.strokeStyle = p.s || p.c || '#000000';
  ctx.lineWidth = p.lw || 3;
  const x=p.x*W, y=p.y*H, w=p.w*W, h=p.h*H;
  const pts = polyPts(p,W,H);
  ctx.beginPath();
  if(pts){ pts.forEach(([px,py],i)=>{ if(i) ctx.lineTo(px,py); else ctx.moveTo(px,py); }); ctx.closePath(); }
  else if(p.t==='ellipse') ctx.ellipse(x+w/2,y+h/2,Math.max(w/2,1),Math.max(h/2,1),0,0,Math.PI*2);
  else ctx.rect(x,y,w,h);
  if(p.f!==false && p.c) ctx.fill();
  if(p.s) ctx.stroke();
}

function hexToRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function floodFill(ctx, W, H, x, y, rgb){
  if(x<0 || y<0 || x>=W || y>=H) return;
  const img = ctx.getImageData(0,0,W,H), d = img.data;
  const i0 = (y*W+x)*4;
  const tr=d[i0], tg=d[i0+1], tb=d[i0+2], ta=d[i0+3];
  const near = (r,g,b,a,tol) => Math.abs(r-tr)+Math.abs(g-tg)+Math.abs(b-tb)+Math.abs(a-ta) <= tol;
  if(near(rgb[0],rgb[1],rgb[2],255,40)) return;
  const stack = [x,y];
  while(stack.length){
    const py = stack.pop(), px = stack.pop();
    const i = (py*W+px)*4;
    if(!near(d[i],d[i+1],d[i+2],d[i+3],40)) continue;
    d[i]=rgb[0]; d[i+1]=rgb[1]; d[i+2]=rgb[2]; d[i+3]=255;
    if(px>0) stack.push(px-1,py);
    if(px<W-1) stack.push(px+1,py);
    if(py>0) stack.push(px,py-1);
    if(py<H-1) stack.push(px,py+1);
  }
  ctx.putImageData(img,0,0);
}
function drawShape(ctx, type, a, b){
  ctx.globalAlpha = 1;
  ctx.strokeStyle = DT.color; ctx.fillStyle = DT.color;
  ctx.lineWidth = DT.size; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const x=Math.min(a.x,b.x), y=Math.min(a.y,b.y), w=Math.abs(b.x-a.x), h=Math.abs(b.y-a.y);
  const cx=x+w/2, cy=y+h/2;
  ctx.beginPath();
  if(type==='line'){ ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); return; }
  if(type==='rect'){ ctx.rect(x,y,w,h); }
  else if(type==='ellipse'){ ctx.ellipse(cx,cy,Math.max(w/2,1),Math.max(h/2,1),0,0,Math.PI*2); }
  else if(type==='tri'){ ctx.moveTo(cx,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); }
  else if(type==='star'){
    const outer=Math.min(w,h)/2, inner=outer*0.45;
    for(let i=0;i<10;i++){
      const ang=-Math.PI/2+i*Math.PI/5, rad=i%2?inner:outer;
      const px=cx+rad*Math.cos(ang), py=cy+rad*Math.sin(ang);
      if(i) ctx.lineTo(px,py); else ctx.moveTo(px,py);
    }
    ctx.closePath();
  }
  else if(type==='arrow'){
    [[0,.3],[.6,.3],[.6,0],[1,.5],[.6,1],[.6,.7],[0,.7]].forEach(([u,v],i)=>{
      const px=x+u*w, py=y+v*h; if(i) ctx.lineTo(px,py); else ctx.moveTo(px,py);
    });
    ctx.closePath();
  }
  if(DT.fillShape) ctx.fill();
  ctx.stroke();
}
function initDraw(box){
  const id = box.dataset.draw;
  const c = box.querySelector('canvas');
  const ctx = c.getContext('2d', {willReadFrequently:true});
  let undo = [], redo = [];
  const fillWhite = () => { ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); };
  fillWhite();
  if(S.bilder[id]){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,c.width,c.height); img.src=S.bilder[id]; }
  const snap = () => { undo.push(ctx.getImageData(0,0,c.width,c.height)); if(undo.length>25) undo.shift(); redo=[]; };
  const persist = () => { S.bilder[id]=c.toDataURL('image/png'); saveState(); box.querySelector('[data-dl]').href=S.bilder[id]; };
  const isShape = () => SHAPE_TOOLS.includes(DT.tool);
  const pos = e => { const r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*c.width/r.width, y:(e.clientY-r.top)*c.height/r.height}; };
  const freeStyle = () => {
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.globalAlpha=1;
    if(DT.tool==='eraser'){ ctx.strokeStyle='#ffffff'; ctx.fillStyle='#ffffff'; ctx.lineWidth=DT.size*2; }
    else if(DT.tool==='brush'){ ctx.strokeStyle=DT.color; ctx.fillStyle=DT.color; ctx.lineWidth=DT.size*2.5; ctx.globalAlpha=0.75; }
    else { ctx.strokeStyle=DT.color; ctx.fillStyle=DT.color; ctx.lineWidth=DT.size; }
  };
  let drawing=false, last=null, start=null, base=null;
  c.addEventListener('pointerdown', e=>{
    const p = pos(e);
    if(DT.tool==='fill'){ snap(); floodFill(ctx,c.width,c.height,Math.round(p.x),Math.round(p.y),hexToRgb(DT.color)); persist(); return; }
    snap();
    drawing=true; start=p; last=p; base=undo[undo.length-1];
    c.setPointerCapture(e.pointerId);
    if(!isShape()){ freeStyle(); ctx.beginPath(); ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2); ctx.fill(); }
  });
  c.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = pos(e);
    if(isShape()){ ctx.putImageData(base,0,0); drawShape(ctx, DT.tool, start, p); }
    else { freeStyle(); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; }
  });
  const end = e => {
    if(!drawing) return;
    drawing=false;
    if(isShape()){ const p=pos(e); ctx.putImageData(base,0,0); drawShape(ctx, DT.tool, start, p); }
    ctx.globalAlpha=1;
    persist();
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  box.querySelector('[data-undo]').addEventListener('click', ()=>{
    if(!undo.length) return;
    redo.push(ctx.getImageData(0,0,c.width,c.height));
    ctx.putImageData(undo.pop(),0,0); persist();
  });
  box.querySelector('[data-redo]').addEventListener('click', ()=>{
    if(!redo.length) return;
    undo.push(ctx.getImageData(0,0,c.width,c.height));
    ctx.putImageData(redo.pop(),0,0); persist();
  });
  box.querySelector('[data-clear]').addEventListener('click', async ()=>{
    if(!await ask('Bild wirklich leeren?')) return;
    snap(); fillWhite(); persist();
  });
  box.querySelector('[data-fillshape]').addEventListener('change', e=>{ DT.fillShape = e.target.checked; document.querySelectorAll('[data-fillshape]').forEach(x=>x.checked=DT.fillShape); });
  box.querySelector('[data-size]').addEventListener('input', e=>{ DT.size = +e.target.value; document.querySelectorAll('[data-size]').forEach(x=>{ if(x!==e.target) x.value=DT.size; }); });
  box.querySelector('[data-color]').addEventListener('input', e=>{ setColor(e.target.value); });
  box.querySelectorAll('[data-sw]').forEach(b=>b.addEventListener('click', ()=>setColor(b.dataset.sw)));
  box.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click', ()=>{ DT.tool = b.dataset.tool; markTools(); }));
  box.querySelectorAll('[data-stamp]').forEach(b=>b.addEventListener('click', ()=>{
    const parts = effectiveParts((S.los||1)-1), v = b.dataset.stamp;
    snap();
    (v==='all' ? parts : [parts[+v]]).forEach(p=>{ if(p) drawPart(ctx,c.width,c.height,p); });
    persist();
  }));
  box.querySelectorAll('[data-deco]').forEach(b=>b.addEventListener('click', ()=>{
    snap(); DECOR[b.dataset.deco].forEach(p=>drawPart(ctx,c.width,c.height,p)); persist();
  }));
  markTools();
}

/* ---------- Budget ---------- */
function updateBudget(){
  const bar = document.getElementById('budgetBar'); if(!bar) return;
  const sum = sumKanal(S);
  bar.style.width = Math.min(100, Math.round(sum/BUDGET*100)) + '%';
  const st = document.getElementById('budgetStatus');
  if(sum===BUDGET){ st.className='status ok'; st.textContent='✅ Perfekt verplant!'; }
  else if(sum<BUDGET){ st.className='status'; st.textContent=`Noch ${(BUDGET-sum).toLocaleString('de-DE')} € übrig`; }
  else { st.className='status bad'; st.textContent=`Überzogen um ${(sum-BUDGET).toLocaleString('de-DE')} €`; }
}

function ziehen(){
  const inp=document.getElementById('losInput'); if(!inp) return;
  const v=String(inp.value||'').trim(), n=parseInt(v,10);
  if(v && !(n>=1 && n<=PRODUKTE.length)){ toast('Bitte eine Losnummer zwischen 1 und '+PRODUKTE.length+' eingeben – oder das Feld leer lassen, dann wird zufällig gezogen.'); return; }
  if(v){ losSetzen(n); return; }
  if(window._losAnim) return;                         // leeres Feld: zufällig ziehen (kleine Trommel-Animation)
  const ende=1+Math.floor(Math.random()*PRODUKTE.length); let k=0;
  window._losAnim=setInterval(()=>{ inp.value=1+Math.floor(Math.random()*PRODUKTE.length);
    if(++k>=14){ clearInterval(window._losAnim); window._losAnim=null; inp.value=ende; losSetzen(ende); } },70);
}
function losSetzen(n){
  if(S.los && S.los!==n) resetDesign();
  S.los = n; S.step = 1; saveState(); render(); window.scrollTo({top:0,behavior:'smooth'});
  const p=produkt(); if(p) toast('🎟️ Los '+n+': '+p.n);
}
function kopieren(){ copyText(pitchText()); }
async function zuruecksetzen(){
  if(!await ask('Wirklich alles zurücksetzen? Dein ganzer Fortschritt (Texte, Bilder, 3D-Design, Clip, Folien) wird gelöscht.','🔄 Ja, alles zurücksetzen')) return;
  const keep = S.room ? {room:S.room, los:S.los} : null;   // Klassenmodus: Raum und zugeteiltes Produkt behalten
  try { resetDesign(); } catch(e){}
  S = defaultState();
  if(keep){ S.room = keep.room; S.los = keep.los; S.step = keep.los ? 1 : 0; }
  saveState(); tReset(); render(); window.scrollTo({top:0});
  if(S.room && typeof roomReport==='function') roomReport(true);
  toast('🔄 Alles zurückgesetzt' + (keep ? ' – du bleibst in deiner Klasse.' : '.'));
}
function listeSpeichern(){
  try {
    const arr = JSON.parse(document.getElementById('lehrerJson').value);
    if(!Array.isArray(arr) || !arr.length) throw new Error('leer');
    arr.forEach((p,i)=>{ if(!p.n||!Array.isArray(p.merk)||!Array.isArray(p.kunden)||!Array.isArray(p.absatz)) throw new Error('Feld fehlt bei Eintrag '+(i+1)); });
    PRODUKTE = arr; localStorage.setItem(PKEY, JSON.stringify(arr));
    if(S.los && S.los>arr.length){ S.los=null; S.step=0; saveState(); }
    toast('Gespeichert ('+arr.length+' Produkte).'); render();
  } catch(e){ toast('Fehler im JSON: '+e.message); }
}

/* ---------- Ideen-Helfer (offline) & KI-Prompt-Vorlagen ---------- */
const SLOGAN_T = ['{m}. Für {k}, die mehr wollen.','Mehr {m}, weniger Stress.','{m} – einfach besser im Alltag.','Du bist die Pause. {m} ist die Kraft.','{m}: spür den Unterschied.','Heute {m}, morgen wieder {m}.','{m} – weil du es wert bist.'];
const HOOK_T = ['Was passiert, wenn {k} erstmals {m} testen?','Drei Sekunden, und du hältst inne: {m}.','Stell dir vor: {bed}. Dann kommt {m}.','Alle reden über {m}. Du auch bald?','Ein Moment, der bleibt: {m}.'];
let IDEEN_SHOW = {};
function shortName(p){ return p.n.split(/\s+/)[0]; }
function shuffled(a){ return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]); }
function ideenFor(key){
  const p = produkt(); if(!p) return [];
  const m = shortName(p);
  const k = S.ziel>=0 ? p.kunden[S.ziel].split(' ')[0] : 'Kunden';
  const bed = (S.beduerf||'').trim().slice(0,60).replace(/[.!?]+$/,'').toLowerCase() || 'der Alltag ist zu voll';
  const pool = key==='slogan' ? SLOGAN_T : HOOK_T;
  return shuffled(pool).slice(0,5).map(t=>t.replace(/\{m\}/g,m).replace(/\{k\}/g,k).replace(/\{bed\}/g,bed));
}
function ideenBox(key){
  const label = key==='slogan' ? 'Slogan' : 'Hook';
  const list = IDEEN_SHOW[key];

function copyText(txt){
  const fallback = ()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Kopiert!'); };
  if(!navigator.clipboard){ fallback(); return; }
  let done=false; const t=setTimeout(()=>{ if(!done){ done=true; fallback(); } },1200);
  navigator.clipboard.writeText(txt).then(()=>{ if(!done){ done=true; clearTimeout(t); toast('Kopiert!'); } }, ()=>{ if(!done){ done=true; clearTimeout(t); fallback(); } });
}


/* ---------- Realistische Produktbilder (anpassbar: Farbe & Größe) ---------- */
function shade(hex, pct){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const k = Math.abs(pct)/100, t = pct>=0 ? 255 : 0;
  r=Math.round(r+(t-r)*k); g=Math.round(g+(t-g)*k); b=Math.round(b+(t-b)*k);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function mainColorOf(parts){
  const p = parts.find(q=>q.c && q.c.length===7 && q.c!=='#ffffff');
  return p ? p.c : null;
}
function effectiveParts(i){
  const base = bauteileFor(i);
  const mc = mainColorOf(base);
  const nc = (S.farbe||{})[i];
  const sc = ((S.groesse||{})[i]||100)/100;
  return base.map(p=>{
    const q = Object.assign({}, p);
    if(nc && mc && p.c===mc) q.c = nc;
    if(sc!==1){ q.x=0.5+(p.x-0.5)*sc; q.y=0.5+(p.y-0.5)*sc; q.w=p.w*sc; q.h=p.h*sc; }
    return q;
  });
}
function partSvg(parts){
  const defs = parts.map((p,j)=> (p.c && p.c.length===7)
    ? `<linearGradient id="gr${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(p.c,28)}"/><stop offset=".55" stop-color="${p.c}"/><stop offset="1" stop-color="${shade(p.c,-32)}"/></linearGradient>`
    : '').join('');
  const shapes = parts.map((p,j)=>{
    const fill = (p.f===false || !p.c) ? 'none' : ((p.c.length===7) ? `url(#gr${j})` : p.c);
    const stroke = p.s ? `stroke="${p.s}" stroke-width="${p.lw||3}"` : '';
    const pts = polyPts(p,600,450);
    if(pts) return `<polygon points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="${fill}" ${stroke}/>`;
    const x=p.x*600, y=p.y*450, w=p.w*600, h=p.h*450;
    if(p.t==='ellipse') return `<ellipse cx="${(x+w/2).toFixed(1)}" cy="${(y+h/2).toFixed(1)}" rx="${(w/2).toFixed(1)}" ry="${(h/2).toFixed(1)}" fill="${fill}" ${stroke}/>`;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" ${stroke}/>`;
  }).join('');
  return `<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Produktbild">
    <defs>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".28"/></filter>
      ${defs}
    </defs>
    <rect width="600" height="450" fill="#f4f6f9"/>
    <ellipse cx="300" cy="402" rx="210" ry="12" fill="#000" opacity=".1"/>
    <g filter="url(#sh)">${shapes}</g>
  </svg>`;
}
function prodTools(i){
  const cur = (S.farbe||{})[i] || mainColorOf(bauteileFor(i)) || '#2a7fa8';
  const size = (S.groesse||{})[i] || 100;
  return `<div class="prodtools noprint">

function loadImg(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
async function drawFoto(target, W, H){
  const f = Object.assign({}, FOTO_DEF, S.foto||{});
  if(!f.src) return;
  const img = await loadImg(f.src); if(!img) return;
  const ctx = target.getContext('2d');
  const fit = Math.min(W/img.width, H/img.height) * f.scale/100;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(f.rot*Math.PI/180);
  ctx.scale(f.sx/100, f.sy/100);
  ctx.filter = `hue-rotate(${f.hue}deg) saturate(${f.sat}%) brightness(${f.bri}%)`;
  ctx.drawImage(img, -img.width*fit/2, -img.height*fit/2, img.width*fit, img.height*fit);
  ctx.restore();
  if(f.logo){
    const lg = await loadImg(f.logo);
    if(lg){ const lw = W*f.lsize/100, lh = lw*lg.height/lg.width; ctx.drawImage(lg, W*f.lx/100-lw/2, H*f.ly/100-lh/2, lw, lh); }
  }
  if(f.text.trim()){
    ctx.save();
    ctx.font = `900 ${f.tsize}px system-ui, "Arial Black", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, f.tsize/8); ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineJoin = 'round';
    ctx.fillStyle = f.tcolor;
    const words = f.text.trim().split(/\s+/), lines = []; let line = '';
    words.forEach(w=>{ const t = line ? line+' '+w : w; if(ctx.measureText(t).width > W*0.9 && line){ lines.push(line); line = w; } else line = t; });
    lines.push(line);
    const y0 = H*f.ty/100 - (lines.length-1)*f.tsize*0.55;
    lines.forEach((l,i)=>{ const y = y0 + i*f.tsize*1.1; ctx.strokeText(l, W/2, y); ctx.fillText(l, W/2, y); });
    ctx.restore();
  }
}
async function renderFoto(){
  const c = document.getElementById('fotoCanvas'); if(!c) return;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  await drawFoto(c, c.width, c.height);
}
function readImage(file, max, cb){
  if(!file || !file.type.startsWith('image/')){ toast('Bitte eine Bilddatei wählen.'); return; }
  const rd = new FileReader();
  rd.onload = ()=>{ loadImg(rd.result).then(img=>{
    const k = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg', 0.85));
  }); };
  rd.readAsDataURL(file);
}
function loadFotoFile(file){ readImage(file, 800, src=>{ S.foto = Object.assign({}, FOTO_DEF, S.foto||{}, {src}); saveState(); render(); }); }
function loadLogoFile(file){ readImage(file, 300, src=>{ S.foto.logo = src; saveState(); render(); }); }
function fotoUebernehmen(){
  if(!(S.foto && S.foto.quelle && S.foto.quelle.trim())){ toast('Bitte zuerst die Bildquelle angeben.'); return; }
  const c = document.createElement('canvas'); c.width=600; c.height=450;

  drawFoto(c,600,450).then(()=>{
    S.bilder.produkt = c.toDataURL('image/png'); saveState(); render(); myProdFlash();
  });
}

let VW = {z:1, rx:0, ry:0, px:0, py:0};
function openViewer(src){
  VW = {z:1, rx:-8, ry:18, px:0, py:0};
  let o = document.getElementById('viewer');
  if(!o){ o = document.createElement('div'); o.id='viewer'; document.body.appendChild(o); }
  o.innerHTML = `<div class="vw-stage" id="vwStage"><div class="vw-card" id="vwCard"><img src="${src}" alt="Produktansicht" draggable="false"></div><div class="vw-floor"></div></div>
    <div class="vw-ctrl">
      <button data-vw="in">＋ Zoom</button><button data-vw="out">－ Zoom</button>
      <button data-vw="spin">⟳ Drehen</button><button data-vw="flat">▭ Flach</button><button data-vw="close">✕ Schließen</button>
    </div>
    <p class="vw-hint">Ziehen: kippen · Shift + Ziehen: verschieben · Mausrad: zoomen</p>`;
  o.style.display='flex';
  vwApply();
  const st = document.getElementById('vwStage');
  let drag=null;
  st.onpointerdown = e=>{ drag={x:e.clientX,y:e.clientY,shift:e.shiftKey}; st.setPointerCapture(e.pointerId); };
  st.onpointermove = e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(drag.shift){ VW.px+=dx; VW.py+=dy; } else { VW.ry=Math.max(-70,Math.min(70,VW.ry+dx*0.4)); VW.rx=Math.max(-60,Math.min(60,VW.rx-dy*0.4)); } vwApply(); };
  st.onpointerup = st.onpointercancel = ()=>{ drag=null; };
  st.onwheel = e=>{ e.preventDefault(); VW.z=Math.max(0.5,Math.min(5,VW.z*(e.deltaY<0?1.12:0.89))); vwApply(); };
}
function vwApply(){
  const c = document.getElementById('vwCard'); if(!c) return;
  c.style.transform = `translate(${VW.px}px,${VW.py}px) scale(${VW.z}) rotateX(${VW.rx}deg) rotateY(${VW.ry}deg)`;
}
function vwAction(a){
  if(a==='in') VW.z=Math.min(5,VW.z*1.25);
  if(a==='out') VW.z=Math.max(0.5,VW.z/1.25);
  if(a==='flat') VW={z:1,rx:0,ry:0,px:0,py:0};
  if(a==='spin'){ let n=0; const t=setInterval(()=>{ VW.ry=Math.sin(n/20)*45; n++; vwApply(); if(n>130){ clearInterval(t); } },30); }
  if(a==='close'){ document.getElementById('viewer').style.display='none'; return; }
  vwApply();
}
function viewerSrc(kind){

  if(kind==='ki') return PRODUKT_FOTOS[S.los-1] || '';
  if(kind==='draw'){ return S.bilder.produkt || ''; }
  return '';
}

function fallFeedback(f, pol, key){

function fallBlock(){

  const sel = (pol,label)=>`

function faelleDone(){
  const d = S.faelleDone||[];
  if(!d.length) return '';
  return `<h4>Bearbeitete Ereignisse</h4><ul>${d.map(x=>`<li><b>${FAELLE[x.idx].t}</b>: ${OPT.preis[x.preis].t}, ${OPT.produkt[x.produkt].t}, ${x.dist?OPT.dist[x.dist].t+', ':''}${OPT.komm[x.komm].t}</li>`).join('')}</ul>`;
}
function fallNeu(){
  const done = (S.faelleDone||[]).map(x=>x.idx);
  const cur = S.fall ? S.fall.idx : -1;
  let pool = FAELLE.map((_,i)=>i).filter(i=>!done.includes(i) && i!==cur);
  if(!pool.length) pool = FAELLE.map((_,i)=>i).filter(i=>i!==cur);
  S.fall = {idx: pool[Math.floor(Math.random()*pool.length)], preis:'', produkt:'', dist:'', komm:'', begr:''};
  saveState(); render();
}
function fallFertig(){
  const f = S.fall;
  if(!f.preis || !f.produkt || !f.dist || !f.komm){ toast('Bitte in allen vier Bereichen eine Reaktion wählen.'); return; }
  if((f.begr||'').trim().split(/\s+/).length < 15){ toast('Bitte begründe ausführlicher (mindestens 3 Sätze).'); return; }
  S.faelleDone = (S.faelleDone||[]).concat([Object.assign({}, f)]);
  S.fall = null; saveState(); render();
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target && e.target.id==='joinName'){ const b=document.querySelector('[data-roomjoin]'); if(b) b.click(); return; }
  const v = document.getElementById('viewer');
  if(v && v.style.display==='flex'){ if(e.key==='Escape') vwAction('close'); return; }
  const o = document.getElementById('praes');
  if(!o || o.style.display!=='flex') return;
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); praesNav(1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); praesNav(-1); }
  if(e.key==='Escape') praesClose();
});

/* ---------- Comic-Clip-Generator ---------- */
const COMIC_BG = {
  stadt:{t:'🏙️ Stadt'}, strand:{t:'🏖️ Strand'}, schule:{t:'🏫 Schule'}, kueche:{t:'🍳 Küche'},
  sport:{t:'🏟️ Sportplatz'}, weltall:{t:'🚀 Weltall'}, buehne:{t:'🎤 Bühne'}, pop:{t:'💥 Pop-Art'}
};
const COMIC_FIG = ['🧑','👩','🧒','👴','🧑‍🎓','🦸','🐻','🤖','😴','🤩','😱','😎'];
const COMIC_FX = ['','POW!','WOW!','ZACK!','BÄM!','YEAH!','HMM?','NEU!'];
const COMIC_CAM = {ruhig:'ruhig', zoom:'Zoom rein', schwenk:'Schwenk', wackeln:'Wackeln'};
function comicDefault(){ return {scenes:[
  {bg:'schule', fig:'😴', fx:'', bubble:'Montag, erste Stunde … ich bin so müde.', caption:'Problem', cam:'ruhig', dur:3, prod:false},
  {bg:'pop', fig:'🤩', fx:'POW!', bubble:'', caption:'Die Lösung!', cam:'zoom', dur:3, prod:true},
  {bg:'stadt', fig:'😎', fx:'YEAH!', bubble:'Damit schaffe ich alles!', caption:'Nutzen', cam:'schwenk', dur:3, prod:true},
  {bg:'end', fig:'', fx:'', bubble:'', caption:'', cam:'zoom', dur:3, prod:true}
]}; }
function comicBlock(){
  if(!S.comic) S.comic = comicDefault();
  const sc = S.comic.scenes;
  const sel = (i,key,opts)=>`<select data-comic="${i}.${key}">${Object.entries(opts).map(([k,v])=>`<option value="${k}" ${sc[i][key]===k?'selected':''}>${v}</option>`).join('')}</select>`;
  return `<details open><summary>🎬 Comic-Clip</summary>
    <p class="hint">Baue deinen Werbefilm aus Comic-Szenen: Hintergrund, Figur, Sprechblase, Effektwort und Kamera. Die letzte Szene kann die Abschlusskarte mit Produkt, Slogan und Call-to-Action sein. Ideal: Problem → Lösung → Nutzen → Abschluss (AIDA).</p>
    <div class="comic-player">
      <canvas id="comicCanvas" width="640" height="360"></canvas>
      <div class="nav" style="margin-top:8px">
        <button class="btn" data-comicplay>▶ Abspielen</button>
        <button class="btn ghost" data-comicstop>■ Stopp</button>
        <button class="btn ghost" data-comicrec>⏺ Als Video speichern</button>
        <span class="hint" id="comicInfo">${comicDauer()} Sekunden</span>
      </div>
    </div>
    ${sc.map((s,i)=>`<div class="comic-scene">
      <div class="comic-head"><b>Szene ${i+1}</b>
        <span>
          <button class="tbtn" data-comicshow="${i}">👁 Vorschau</button>
          <button class="tbtn" data-comicup="${i}" ${i===0?'disabled':''}>↑</button>
          <button class="tbtn" data-comicdown="${i}" ${i===sc.length-1?'disabled':''}>↓</button>
          <button class="tbtn" data-comicdel="${i}">🗑️</button>
        </span>
      </div>
      <div class="comic-grid">
        <label>Hintergrund ${sel(i,'bg',Object.assign({end:'🏁 Abschlusskarte'},Object.fromEntries(Object.entries(COMIC_BG).map(([k,v])=>[k,v.t]))))}</label>
        <label>Kamera ${sel(i,'cam',COMIC_CAM)}</label>
        <label>Dauer <input type="number" min="1" max="8" value="${s.dur}" data-comic="${i}.dur"> s</label>
        <label class="opt" style="margin:0"><input type="checkbox" data-comic="${i}.prod" ${s.prod?'checked':''}> Produkt zeigen</label>
      </div>
      ${s.bg==='end' ? `<p class="hint">Die Abschlusskarte zeigt automatisch Produkt, Slogan und Call-to-Action.</p>` : `
      <div class="chips" style="margin:6px 0">Figur: ${COMIC_FIG.map(f=>`<button class="chip ${s.fig===f?'on':''}" data-comicfig="${i}" data-v="${f}">${f}</button>`).join('')}<button class="chip ${!s.fig?'on':''}" data-comicfig="${i}" data-v="">keine</button></div>
      <div class="chips" style="margin:6px 0">Effekt: ${COMIC_FX.map(f=>`<button class="chip ${s.fx===f?'on':''}" data-comicfx="${i}" data-v="${f}">${f||'keiner'}</button>`).join('')}</div>
      <div class="comic-grid">
        <input type="text" data-comic="${i}.bubble" value="${escapeHtml(s.bubble)}" placeholder="Sprechblase (was sagt die Figur?)">
        <input type="text" data-comic="${i}.caption" value="${escapeHtml(s.caption)}" placeholder="Erzählkasten (z. B. „Am nächsten Morgen …“)">
      </div>`}
    </div>`).join('')}
    <div class="nav"><button class="btn" data-comicadd ${sc.length>=8?'disabled':''}>＋ Szene hinzufügen</button><button class="btn ghost" data-comicreset>Beispiel laden</button></div>
  </details>`;
}
function comicDauer(){ return (S.comic?S.comic.scenes:[]).reduce((a,s)=>a+(+s.dur||0),0); }

/* Zeichnen */
const COMIC_IMG = {};
function comicProdImg(){
  const src = S.bilder.produkt || PRODUKT_FOTOS[S.los-1] || '';
  if(!src) return null;
  if(COMIC_IMG.src!==src){ COMIC_IMG.src=src; COMIC_IMG.img=new Image(); COMIC_IMG.img.src=src; }
  return COMIC_IMG.img.complete && COMIC_IMG.img.naturalWidth ? COMIC_IMG.img : null;
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(ctx,text,maxW){ const words=text.split(/\s+/), lines=[]; let l=''; words.forEach(w=>{ const t=l?l+' '+w:w; if(ctx.measureText(t).width>maxW && l){ lines.push(l); l=w; } else l=t; }); if(l) lines.push(l); return lines; }
function drawBg(ctx,W,H,bg,t){
  const g = (a,b)=>{ const gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,a); gr.addColorStop(1,b); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H); };
  if(bg==='stadt'){ g('#7ec8e3','#cdeefa'); ctx.fillStyle='#4a5a7a'; [[20,140,70],[100,90,60],[170,160,80],[260,70,70],[340,130,90],[440,100,70],[520,150,100]].forEach(([x,h,w])=>{ ctx.fillRect(x,H-110-h,w,h+110); ctx.fillStyle='#ffd60a'; for(let yy=H-100-h;yy<H-120;yy+=24) for(let xx=x+8;xx<x+w-10;xx+=18) ctx.fillRect(xx,yy,8,10); ctx.fillStyle='#4a5a7a'; }); ctx.fillStyle='#555'; ctx.fillRect(0,H-60,W,60); ctx.fillStyle='#fff'; for(let x=0;x<W;x+=60) ctx.fillRect(x+((t*120)%60),H-32,30,5); }
  else if(bg==='strand'){ g('#4cc9f0','#bde0fe'); ctx.fillStyle='#ffd60a'; ctx.beginPath(); ctx.arc(W-90,70,40,0,7); ctx.fill(); ctx.fillStyle='#0096c7'; ctx.fillRect(0,H-150,W,60); ctx.fillStyle='#f4d58d'; ctx.fillRect(0,H-90,W,90); }
  else if(bg==='schule'){ g('#f1e3c6','#e6d3ad'); ctx.fillStyle='#2d6a4f'; ctx.fillRect(60,40,W-120,170); ctx.strokeStyle='#8d5524'; ctx.lineWidth=10; ctx.strokeRect(60,40,W-120,170); ctx.fillStyle='#ffffffcc'; ctx.font='bold 22px system-ui'; ctx.fillText('Marketing = 4 P',90,90); ctx.fillStyle='#8d5524'; ctx.fillRect(0,H-70,W,70); }
  else if(bg==='kueche'){ g('#fff1e6','#fde2e4'); ctx.fillStyle='#ffffff'; for(let x=0;x<W;x+=40) for(let y=0;y<H-110;y+=40) { ctx.strokeStyle='#f3c4c4'; ctx.strokeRect(x,y,40,40); } ctx.fillStyle='#b5838d'; ctx.fillRect(0,H-110,W,110); ctx.fillStyle='#e5989b'; ctx.fillRect(0,H-115,W,10); }
  else if(bg==='sport'){ g('#90e0ef','#caf0f8'); ctx.fillStyle='#2b9348'; ctx.fillRect(0,H-140,W,140); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.beginPath(); ctx.ellipse(W/2,H-70,120,40,0,0,7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(W/2,H-140); ctx.lineTo(W/2,H); ctx.stroke(); }

  const du1=t1[0]-t0[0], dv1=t1[1]-t0[1], du2=t2[0]-t0[0], dv2=t2[1]-t0[1], det=du1*dv2-du2*dv1;
  if(Math.abs(det)<1e-6) return false;
  const dx1=p1[0]-p0[0], dy1=p1[1]-p0[1], dx2=p2[0]-p0[0], dy2=p2[1]-p0[1];
  const a=(dx1*dv2-dx2*dv1)/det, b=(dy1*dv2-dy2*dv1)/det, c=(dx2*du1-dx1*du2)/det, d=(dy2*du1-dy1*du2)/det;
  const e=p0[0]-a*t0[0]-c*t0[1], f=p0[1]-b*t0[0]-d*t0[1];
  ctx.save(); ctx.beginPath(); const q0=ex(p0),q1=ex(p1),q2=ex(p2); ctx.moveTo(q0[0],q0[1]); ctx.lineTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.closePath(); ctx.clip();
  ctx.transform(a,b,c,d,e,f); ctx.drawImage(img,0,0);
  if(ov){ ctx.setTransform(1,0,0,1,0,0); const xs=[q0[0],q1[0],q2[0]], ys=[q0[1],q1[1],q2[1]], bx=Math.min(...xs)-1, by=Math.min(...ys)-1, bw=Math.max(...xs)-bx+2, bh=Math.max(...ys)-by+2;
    ov.forEach(s=>{ ctx.fillStyle=s; ctx.fillRect(bx,by,bw,bh); }); }
  ctx.restore(); return true;
}
function texQuad(ctx,img,P,UV,ov){
  const T=UV.map(([u,v])=>[u*(img.width-1), v*(img.height-1)]);
  const same=(a,b)=>Math.abs(a[0]-b[0])<.01&&Math.abs(a[1]-b[1])<.01;
  if(!same(P[0],P[1])||!same(T[0],T[1])) texTri(ctx,img,P[0],P[1],P[2],T[0],T[1],T[2],ov); else texTri(ctx,img,P[0],P[2],P[3],T[0],T[2],T[3],ov);
  if(!same(P[2],P[3])&&!same(P[0],P[1])) texTri(ctx,img,P[0],P[2],P[3],T[0],T[2],T[3],ov); else if(same(P[0],P[1])) texTri(ctx,img,P[1],P[2],P[3],T[1],T[2],T[3],ov);
}
function d3Draw(canvas, bg){
  const st=d3State(); if(!D3_MESH || D3_MESH.los!==S.los){ D3_MESH=d3Build(S.los-1); D3_MESH.los=S.los; }
  const MESH = (st.mode==='foto3d' && FOTO3D.mesh) ? FOTO3D.mesh : D3_MESH;
  const ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
  const g=ctx.createRadialGradient(W/2,H*.42,40,W/2,H/2,W*.75); g.addColorStop(0,'#ffffff'); g.addColorStop(1,bg?'#e6ebf1':'#d9e0ea');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const S3=[st.w/100,st.h/100,st.d/100], D=7, F=Math.min(W,H)*3.3*st.zoom/(MESH.size||2);
  const cy=Math.cos(st.yaw), sy=Math.sin(st.yaw), cp=Math.cos(st.pitch), sp=Math.sin(st.pitch);
  const view=p=>{ let x=p[0]*S3[0], y=p[1]*S3[1], z=p[2]*S3[2]; let t=x*cy+z*sy; z=-x*sy+z*cy; x=t; t=y*cp-z*sp; z=y*sp+z*cp; y=t; return [x,y,z]; };
  const proj=p=>{ const dep=D-p[2]; return [W/2+p[0]*F/dep, H/2-p[1]*F/dep]; };
  const L=(()=>{ const l=[-.45,.75,.85], n=Math.hypot(...l); return l.map(v=>v/n); })();
  ctx.save(); const sh=proj(view([0,MESH.miny,0])); const rw=Math.max(MESH.wx*S3[0],MESH.wz*S3[2])*1.15;
  const sg=ctx.createRadialGradient(sh[0],sh[1]+4,0,sh[0],sh[1]+4,rw*F/D); sg.addColorStop(0,'rgba(0,0,0,.28)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.ellipse(sh[0],sh[1]+4,rw*F/D,rw*F/D*.24,0,0,7); ctx.fill(); ctx.restore();
  const skinFor=(role,cov)=>{ const t= role==='main'?st.skin : role==='acc'?st.skin2 : role==='dark'?'gummi' : role==='metal'||role==='gold'?'metall' : 'kunststoff';
    if(t==='keine') return null; if(t==='foto') return role==='main' ? d3PhotoTex() : null; if(t==='eigen') return d3SkinImg();
    const col= cov || (role==='main'?st.main : role==='acc'?st.acc : D3_ROLE[role]); return skinTex(t,col); };
  const list=[];
  MESH.faces.forEach(f=>{
    const v=f.v.map(view), r=view(f.ref);
    let n=[0,0,0]; for(let i=0;i<v.length;i++){ const a=v[i], b=v[(i+1)%v.length]; n[0]+=(a[1]-b[1])*(a[2]+b[2]); n[1]+=(a[2]-b[2])*(a[0]+b[0]); n[2]+=(a[0]-b[0])*(a[1]+b[1]); }
    const nl=Math.hypot(...n); if(nl<1e-9) return; n=n.map(x=>x/nl);
    const c=[0,1,2].map(k=>v.reduce((s,p)=>s+p[k],0)/v.length);
    if(n[0]*(c[0]-r[0])+n[1]*(c[1]-r[1])+n[2]*(c[2]-r[2])<0) n=n.map(x=>-x);
    const toCam=[-c[0],-c[1],D-c[2]]; if(n[0]*toCam[0]+n[1]*toCam[1]+n[2]*toCam[2]<=0) return;
    const tl=Math.hypot(...toCam), V=toCam.map(x=>x/tl);
    const diff=Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);
    const shinyRole = st.shiny || f.role==='metal' || f.role==='gold';
    const glossK = (f.role==='main'&&st.skin==='glas')||(f.role==='main'&&st.skin==='lack') ? .8 : .5;
    let spec=0; if(shinyRole){ const hv=[L[0]+V[0],L[1]+V[1],L[2]+V[2]], hl=Math.hypot(...hv); spec=Math.pow(Math.max(0,(n[0]*hv[0]+n[1]*hv[1]+n[2]*hv[2])/hl),36)*glossK; }
    const rim=Math.pow(1-Math.max(0,n[0]*V[0]+n[1]*V[1]+n[2]*V[2]),3)*.18;
    list.push({p:v.map(proj), z:c[2], int:.36+.64*diff, spec:spec+rim*.5, f});
  });
  list.sort((a,b)=>a.z-b.z);
  if(canvas.id==='d3Canvas') D3_PICK=list;
  const path=o=>{ ctx.beginPath(); o.p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); };
  list.forEach(o=>{
    const role=o.f.role, ps=(MESH===D3_MESH && st.parts && o.f.pi!=null) ? st.parts[o.f.pi] : null;
    const base=ps&&ps.color ? ps.color : role==='edge'?(MESH.edgeColor||'#666666'):role==='main'?st.main:role==='acc'?st.acc:D3_ROLE[role]||'#888';
    const [r,g2,b]=hex2rgb(base), cl=k=>Math.min(255,Math.round(k*o.int+255*o.spec));
    const col=`rgb(${cl(r)},${cl(g2)},${cl(b)})`;
    const useLab = o.f.lab && D3_TEX && st.lab!=='none', skin = o.f.ph ? MESH.img : (!useLab && role!=='edge' ? (ps&&ps.skin ? partSkin(ps,base) : skinFor(role, ps&&ps.color)) : null);
    if(useLab || skin){
      const ov=[`rgba(0,0,0,${((1-o.int)*.62).toFixed(3)})`]; if(o.spec>.01) ov.push(`rgba(255,255,255,${Math.min(.9,o.spec).toFixed(3)})`);
      texQuad(ctx, useLab?D3_TEX:skin, o.p, useLab?o.f.lab:o.f.sk, ov);
    } else { path(o); ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=.8; ctx.stroke(); }
    if(canvas.id==='d3Canvas' && st.sel!=null && o.f.pi===st.sel && MESH===D3_MESH){ path(o); ctx.strokeStyle='rgba(255,214,10,.95)'; ctx.lineWidth=1.6; ctx.stroke(); }
  });
}

async function d3Render(){ const c=document.getElementById('d3Canvas'); if(!c) return; await d3MakeTex(); d3Draw(c); }
function d3Loop(){ if(D3_RAF) cancelAnimationFrame(D3_RAF); const st=d3State(); if(!st.auto || !document.getElementById('d3Canvas')){ D3_RAF=null; return; }
  const step=()=>{ if(!document.getElementById('d3Canvas') || !S.d3.auto){ D3_RAF=null; return; } S.d3.yaw+=0.015; d3Draw(document.getElementById('d3Canvas')); D3_RAF=requestAnimationFrame(step); };
  D3_RAF=requestAnimationFrame(step); }
function initD3(){
  const c=document.getElementById('d3Canvas'); if(!c) return;
  D3_TEXKEY=''; ensureFotoMesh().then(d3Render).then(d3Loop);
  c.addEventListener('dragover',e=>{ e.preventDefault(); c.style.outline='4px dashed #3a86ff'; });
  c.addEventListener('dragleave',()=>{ c.style.outline=''; });
  c.addEventListener('drop',e=>{ e.preventDefault(); c.style.outline=''; const f=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f){ skinFromFile(f); return; } const u=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain'); if(u){ const i=document.getElementById('skinUrl'); if(i){ i.value=u.split('\n')[0]; skinFromUrl(); } } });
  let drag=null, pend=false;
  const redraw=()=>{ if(pend) return; pend=true; requestAnimationFrame(()=>{ pend=false; d3Draw(c); }); };
  c.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove',e=>{ if(!drag) return; const st=d3State(); st.yaw+=(e.clientX-drag.x)*0.01; st.pitch=Math.max(-1.3,Math.min(1.3,st.pitch+(e.clientY-drag.y)*0.01)); drag={x:e.clientX,y:e.clientY,sx:drag.sx,sy:drag.sy}; redraw(); });
  const up=e=>{ if(!drag) return; const moved=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy); drag=null; saveState();
    if(moved<5 && d3State().mode!=='foto3d' && e.type==='pointerup'){ const r=c.getBoundingClientRect(); const pi=d3PickAt((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height); const st=d3State(); st.sel = pi; saveState(); const pp=document.getElementById('partBox'); if(pp) pp.innerHTML=partPanel(); d3Draw(c); } };
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
  c.addEventListener('wheel',e=>{ e.preventDefault(); const st=d3State(); st.zoom=Math.max(.5,Math.min(2,st.zoom*(e.deltaY<0?1.08:.93))); const z=document.querySelector('[data-d3="zoom"]'); if(z) z.value=Math.round(st.zoom*100); redraw(); },{passive:false});
}

let D3_PICK=[];
const PART_IMG={};
function partSkin(ps,base){ if(ps.skin==='keine') return null; if(ps.skin==='eigen'){ if(!ps.img) return null; if(!PART_IMG[ps.img]){ PART_IMG[ps.img]=new Image(); PART_IMG[ps.img].onload=()=>{ const c=document.getElementById('d3Canvas'); if(c) d3Draw(c); }; PART_IMG[ps.img].src=ps.img; } const im=PART_IMG[ps.img]; return im.complete&&im.naturalWidth?im:null; }
  if(ps.skin==='foto') return d3PhotoTex(); return skinTex(ps.skin,base); }
function d3PickAt(x,y){

  for(let i=D3_PICK.length-1;i>=0;i--){ const o=D3_PICK[i]; if(o.f.pi!=null && inPoly(null,o.p)) return o.f.pi; } return null; }
function partName(pi){ const m=D3_MODELS[S.los-1]||D3_MODELS[0], pt=m.parts[pi]; if(!pt) return 'Teil'; const r={main:'Hauptteil',acc:'Akzent',dark:'dunkles Teil',white:'helles Teil',metal:'Metallteil',gold:'Goldteil'}[pt.role]||'Teil'; return `Teil ${pi+1} (${r}${pt.label?', mit Etikett':''})`; }

function partSet(k,v){ const st=d3State(); st.parts=st.parts||{}; const ps=st.parts[st.sel]=st.parts[st.sel]||{}; if(v===''||v==null) delete ps[k]; else ps[k]=v; saveState(); }
function partImage(img){

function voteParse(text){
  const n=PRODUKTE.length, voters={}, errors=[];
  text.split(/\s*\n\s*/).map(s=>s.trim()).filter(Boolean).forEach((line,li)=>{
    const m=line.match(/^KW1-(\d{2})-(\d{2})-([0-6]+)$/);
    if(!m || m[3].length!==n*VK.length){ errors.push(`Zeile ${li+1} ist kein gültiger Code.`); return; }
    voters[+m[1]]={best:+m[2], d:m[3]};
  });
  const res=PRODUKTE.map((p,idx)=>({i:idx+1, p, sum:VK.map(()=>0), cnt:VK.map(()=>0), best:0}));
  Object.entries(voters).forEach(([voter,v])=>{
    for(let i=1;i<=n;i++){ if(i===+voter) continue;
      VK.forEach((c,ci)=>{ const g=Math.min(PMAX,+v.d[(i-1)*VK.length+ci]); if(g){ res[i-1].sum[ci]+=g; res[i-1].cnt[ci]++; } }); }
    if(v.best && v.best!==+voter && v.best<=n) res[v.best-1].best++;
  });
  res.forEach(r=>{ r.avg=r.cnt.map((c,ci)=>c?r.sum[ci]/c:null); const vals=r.avg.filter(x=>x!==null);
    r.total = vals.length ? r.avg.reduce((a,b)=>a+(b===null?0:b),0) * VK.length/vals.length : null;
    r.pct = r.total===null ? null : r.total/GMAX*100; r.n=Math.max(...r.cnt); });
  return {res, voters:Object.keys(voters).length, errors};
}

/* ---------- Schuh als Loft-Modell ---------- */
function d3Loft(rings,o={}){ return Object.assign({k:'P', rings}, o); }
function shoeParts(){
  const N=40, foot=[];
  for(let s=0;s<N;s++){ const a=s*2*Math.PI/N, ca=Math.cos(a), sa=Math.sin(a), x=Math.sign(ca)*Math.pow(Math.abs(ca),.75);
    const w=.29+.07*Math.exp(-(((x-.42)/.35)**2))-.035*Math.exp(-(((x+.05)/.25)**2))-.03*Math.max(0,-x-.6)*2;
    foot.push([x, w*Math.sign(sa)*Math.pow(Math.abs(sa),.65)]); }
  const spring=x=>.14*Math.max(0,x-.5)**2/.25, sm=(e0,e1,x)=>{ const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0))); return t*t*(3-2*t); };
  const H=x=>.2+.44*(1-sm(-.35,1.0,x));
  const ring=(k,y,dy=0)=>foot.map(([x,z])=>[x*k, y+spring(x)+dy, z*k]);
  const sole=[ring(.97,0),ring(1.03,.05),ring(1.03,.15),ring(1.0,.18)];
  const T=[0,.2,.42,.62,.8,.92,1], top=.18;
  const upper=T.map(t=>foot.map(([x,z])=>{ const xx=x-Math.sign(x)*.13*t*t*(x>0?1:.6); return [xx, top+spring(x)+t*H(x), z*(1-.42*Math.pow(t,1.5))]; }));
  const parts=[
    d3Loft(sole,{role:'white', roleFn:(c,ri)=>ri===0?'dark':null}),
    d3Loft(upper,{role:'main', roleFn:(c,ri,cap)=>cap==='top'?(c[0]<-.08?'dark':null):(c[0]>.62&&ri<4?'acc':(c[0]<-.75&&ri>2?'acc':null)), capBottom:false})
  ];
  const yAt=x=>top+spring(x)+H(x);
  [-.02,.1,.22,.34,.46].forEach(x=>parts.push(d3RBox(.05,.035,.34-(x+.02)*.18,.015,{role:'white',pos:[x-.08,yAt(x)+.01,0],rot:[0,0,-.32]})));
  parts.push(d3RBox(.26,.3,.24,.06,{role:'main',pos:[-.2,yAt(-.2)+.05,0],rot:[0,0,.35]}));
  parts.push(d3RBox(.06,.2,.12,.03,{role:'acc',pos:[-.99,.62,0]}));
  parts.push(d3RBox(.5,.07,.02,.03,{role:'acc',pos:[.05,.38,.31],rot:[0,0,.28]}), d3RBox(.42,.06,.02,.03,{role:'acc',pos:[-.12,.48,.3],rot:[0,0,.28]}));
  parts.push(d3RBox(.34,.14,.02,.04,{role:'white',pos:[-.62,.48,.27],label:true}));
  return parts;
}

function buildFotoMesh(img, tol, depth){
  const cols=38, rows=Math.max(8,Math.min(50,Math.round(cols*img.height/img.width)));
  const c=document.createElement('canvas'); c.width=cols; c.height=rows; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,cols,rows);
  const D=x.getImageData(0,0,cols,rows).data, px=(i,j)=>{ const k=(j*cols+i)*4; return [D[k],D[k+1],D[k+2]]; };
  const border=[]; for(let i=0;i<cols;i++){ border.push(px(i,0),px(i,rows-1)); } for(let j=0;j<rows;j++){ border.push(px(0,j),px(cols-1,j)); }

    for(let s=0;s<cols*rows;s++) if(!out[s]) M[s]=1; }

  const dist=new Float32Array(cols*rows).fill(1e9), q=[];
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ const s=j*cols+i; if(!M[s]) continue; const edge=i===0||j===0||i===cols-1||j===rows-1||!M[s-1]||!M[s+1]||!M[s-cols]||!M[s+cols]; if(edge){ dist[s]=1; q.push(s); } }
  for(let h=0;h<q.length;h++){ const v=q[h], i=v%cols, j=(v/cols)|0; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{ const ii=i+a, jj=j+b; if(ii<0||jj<0||ii>=cols||jj>=rows) return; const w=jj*cols+ii; if(M[w]&&dist[w]>dist[v]+1){ dist[w]=dist[v]+1; q.push(w); } }); }
  let dmax=1; for(let s=0;s<cols*rows;s++) if(M[s]) dmax=Math.max(dmax,dist[s]);
  const Wm=2, Hm=2*rows/cols, amp=depth/100*.55;

  for(let j=0;j<=rows;j++) for(let i=0;i<=cols;i++){ let sum=0,n=0; [[i-1,j-1],[i,j-1],[i-1,j],[i,j]].forEach(([a,b])=>{ if(a<0||b<0||a>=cols||b>=rows) return; const s=b*cols+a; if(M[s]){ sum+=hc(s); n++; } }); Z[j*(cols+1)+i]= n? sum/n*(n/4)**.5 : 0; }

    const uv=[[i/cols,(j+1)/rows],[(i+1)/cols,(j+1)/rows],[(i+1)/cols,j/rows],[i/cols,j/rows]];
    const cx=((i+.5)/cols-.5)*Wm, cy=(.5-(j+.5)/rows)*Hm;

    faces.push({v:[P(i+1,j+1,-.75),P(i,j+1,-.75),P(i,j,-.75),P(i+1,j,-.75)], ref:[cx,cy,5], role:'main', ph:true, sk:[uv[1],uv[0],uv[3],uv[2]], lab:null});

async function recStart(){
  if(REC.mr) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Dein Browser unterstützt keine Tonaufnahme. Bitte Chrome, Edge oder Firefox verwenden.'); return; }
  let stream; try { stream=await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e){ toast('Kein Zugriff auf das Mikrofon. Bitte im Browser erlauben.'); return; }
  const ac=new (window.AudioContext||window.webkitAudioContext)(), dest=ac.createMediaStreamDestination();
  ac.createMediaStreamSource(stream).connect(dest);
  const jo=S.radio.jingleOn!==false, k=S.radio.jingle||'pop';
  if(jo){ const mon=ac.createGain(); mon.gain.value=.4; mon.connect(ac.destination); playJingle(ac,[dest,mon],ac.currentTime+.1,k); }
  const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const mr=new MediaRecorder(dest.stream, mime?{mimeType:mime}:undefined), chunks=[];
  mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{ const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); if(REC.url) URL.revokeObjectURL(REC.url); REC.url=URL.createObjectURL(blob); REC.ext=(mr.mimeType||'').includes('mp4')?'m4a':(mr.mimeType||'').includes('ogg')?'ogg':'webm';
    stream.getTracks().forEach(t=>t.stop()); ac.close(); clearInterval(REC.timer); REC.mr=null;
    const a=document.getElementById('radioAudio'); if(a){ a.src=REC.url; a.style.display=''; } const sv=document.querySelector('[data-recsave]'); if(sv) sv.disabled=false;
    const inf=document.getElementById('recInfo'); if(inf) inf.textContent='✅ Aufnahme fertig'; };
  Object.assign(REC,{mr,ac,stream,dest,t0:Date.now(),stopping:false}); mr.start();
  REC.timer=setInterval(()=>{ const s=Math.round((Date.now()-REC.t0)/1000), inf=document.getElementById('recInfo'); if(inf) inf.textContent=`⏺ Aufnahme läuft: ${s} s`; if(s>=45) recStop(); },500);
}
function recStop(){
  if(!REC.mr || REC.stopping) return;
  REC.stopping=true;
  const jo=S.radio.jingleOn!==false, k=S.radio.jingle||'pop';
  const fin=()=>{ REC.stopping=false; if(REC.mr && REC.mr.state!=='inactive') REC.mr.stop(); };
  if(jo && REC.ac && REC.dest){
    REC.stream.getAudioTracks().forEach(t=>t.enabled=false);
    const mon=REC.ac.createGain(); mon.gain.value=.4; mon.connect(REC.ac.destination);
    const end=playJingle(REC.ac,[REC.dest,mon],REC.ac.currentTime+.05,k);
    setTimeout(fin,(end-REC.ac.currentTime)*1000+250);
  } else fin();
}

function coachTips(step){
  const p=produkt(), T=[]; if(!p) return T;
  const ok=(t)=>T.push(['✅',t]), tip=(t)=>T.push(['💡',t]);
  const ziel = S.ziel>=0 ? p.kunden[S.ziel] : '';
  if(step===1){ S.bilder.produkt ? ok('Dein Produktbild ist fertig.') : tip('Übernimm eine 3D-Ansicht oder zeichne dein Produkt, damit es im Pitch sichtbar ist.');
    tip('Achte darauf, dass Farbe und Material zur Zielgruppe passen, z. B. edel für Premium, bunt für Kinder.'); }
  if(step===2){ if(S.ziel<0) tip('Wähle eine Kundengruppe.'); if(S.absatz<0) tip('Wähle ein Absatzgebiet.');
    const si=situation(); if(si){ if(S.ziel>=0) (S.ziel===si.z ? ok('Deine Kundengruppe passt zur Fallsituation.') : tip(`Passt die Kundengruppe zur Fallsituation? Dort geht es um: ${p.kunden[si.z]}. Wenn du abweichst, begründe es.`));
      if(S.absatz>=0) (S.absatz===si.a ? ok('Dein Absatzgebiet passt zur Fallsituation.') : tip(`Die Fallsituation spricht für: ${p.absatz[si.a]}. Begründe, warum du ein anderes Gebiet wählst.`)); }
    S.usps.forEach((u,i)=>{ if(!u.trim()) return; if(p.merk.some(m=>m.toLowerCase()===u.trim().toLowerCase())) tip(`USP ${i+1} ist nur ein Merkmal. Formuliere den Nutzen: Was hat der Kunde davon?`);
      else if(/\b(du|dich|dir|dein|damit|ohne|immer|endlich|sie|ihr)\b/i.test(u)) ok(`USP ${i+1} spricht den Kunden direkt an.`); });
    if(S.beduerf.trim().length>0 && S.beduerf.trim().length<25) tip('Beschreibe das Bedürfnis genauer: Wann und wo tritt das Problem auf?'); }
  if(step===3){ const sl=S.slogan.trim(); if(!sl) tip('Noch kein Slogan.'); else { sl.length>40 ? tip('Der Slogan ist lang. Kürze auf höchstens 40 Zeichen.') : ok('Der Slogan ist schön kurz.');
      sl.toLowerCase().includes(p.n.split(' ')[0].toLowerCase()) ? ok('Der Markenname steckt im Slogan, das stärkt die Erinnerung.') : tip('Tipp: Der Markenname im Slogan bleibt besser im Gedächtnis.');
      if(/(\w+)\b.*\b\1\b/i.test(sl)) ok('Wiederholung im Slogan wirkt einprägsam.'); }
    if(S.tone.includes('seriös') && /Kinder|Jugend|Schüler/.test(ziel)) tip('„Seriös“ wirkt bei jungen Zielgruppen oft langweilig. Passt der Ton?'); }
  if(step===4){ const v=S.vierp||{wege:[]};
    if(v.strat==='Premiumpreis' && (v.wege||[]).some(w=>/Kiosk|Marktplätze/.test(w))) tip('Premiumpreis und Kiosk/Marktplatz passen schlecht zusammen. Premium braucht ausgewählte Vertriebswege.');
    if(v.strat==='Niedrigpreis' && (v.wege||[]).includes('Fachhandel')) tip('Niedrigpreis im Fachhandel ist ungewöhnlich, der Fachhandel lebt von Beratung und Marge.');
    if(v.strat && (v.wege||[]).length && (v.promotion||'').trim()) ok('Alle vier P sind ausgefüllt. Prüfe, ob sie zusammenpassen.');
    if(!(S.faelleDone||[]).length) tip('Ziehe ein Marktereignis und reagiere darauf.'); }
  if(step===5){ const k=S.kanal, sum=sumKanal(S), ks=Object.keys(k);
    if(sum!==BUDGET) tip(`Das Budget ist noch nicht genau verplant (${sum.toLocaleString('de-DE')} €).`);
    if(/Schüler|Jugend|14|16|Streetwear|Gamer|Kinder/.test(ziel) && !ks.some(x=>/Social|YouTube|Influencer|Schul/.test(x))) tip('Deine junge Zielgruppe erreichst du kaum ohne Social Media, YouTube oder Schulaktion.');
    if(/Pendler|Berufstätige/.test(ziel) && !ks.some(x=>/Radio|Plakat/.test(x))) tip('Pendler erreichst du gut mit Radio und Plakaten auf dem Arbeitsweg.');
    ks.forEach(x=>{ if(sum && k[x]/sum>.7) tip(`Über 70 % des Budgets gehen in „${x}“. Ist das bewusst so?`); });
    if(ks.length>=2 && sum===BUDGET) ok('Budget verplant und auf mehrere Kanäle verteilt.');
    const G=(S.gesichter||[]).filter(g=>(g.name||'').trim());
    if(ks.includes('Influencer') && !G.length) tip('Du hast „Influencer“ gewählt. Trage ein, welche Person für dein Produkt werben soll.');
    G.forEach(g=>{ if(!g.kennz) tip(`${g.name}: Influencer-Werbung muss als Werbung gekennzeichnet werden.`);
      if(+g.reach>1e6 && (+g.cost||0)<10000) tip(`${g.name} hat über 1 Mio. Follower. Solche Stars kosten meist weit mehr als dein Budget. Ein Micro-Influencer passt oft besser.`);
      if((g.warum||'').trim().length<20) tip(`Begründe genauer, warum ${g.name} zur Zielgruppe passt.`); });
    const fc=G.reduce((a,g)=>a+(+g.cost||0),0), ib=+(S.kanal['Influencer']||0); if(fc && fc>ib) tip(`Die Honorare der Werbegesichter (${fc.toLocaleString('de-DE')} €) sind höher als dein Influencer-Budget (${ib.toLocaleString('de-DE')} €).`); }
  if(step===6){ if(!S.idee.hook.trim()) tip('Formuliere einen Hook: Was passiert in den ersten 3 Sekunden?');
    if(S.idee.cta.trim()) { /^(jetzt|hol|kauf|teste|probier|bestell|sichere|entdecke|besuch)/i.test(S.idee.cta.trim()) ? ok('Der Call-to-Action beginnt mit einer klaren Aufforderung.') : tip('Beginne den Call-to-Action mit einem Verb, z. B. „Jetzt testen“.'); } else tip('Es fehlt ein Call-to-Action.');
    if(S.werbemittel.includes('comic') && S.comic){ const n=S.comic.scenes.length; n<3 ? tip('Ein Comic-Clip braucht mindestens 3 Szenen: Problem, Lösung, Abschluss.') : ok(`Dein Comic-Clip hat ${n} Szenen.`);
      if(!S.comic.scenes.some(s=>s.bg==='end')) tip('Füge eine Abschlusskarte mit Produkt und Slogan hinzu.'); }
    if(!S.werbemittel.length) tip('Wähle Instagram-Beitrag oder Werbeclip.');
    if(S.werbemittel.includes('insta') && S.insta){ const st=S.insta, tg=st.tags.trim().split(/[\s,]+/).filter(Boolean).length;
      if(!st.anzeige) tip('Bezahlte Werbung auf Instagram muss als Anzeige gekennzeichnet sein.');
      if(st.head.trim().split(/\s+/).length>8) tip('Die Überschrift im Bild ist lang. Wenige, große Wörter wirken im Feed besser.'); else if(st.head.trim()) ok('Die Überschrift im Bild ist kurz.');
      if(tg<3) tip('Nutze 3 bis 10 passende Hashtags.'); else if(tg>12) tip('Viele Hashtags wirken unseriös. Wähle die passendsten aus.'); else ok('Gute Zahl an Hashtags.');
      if(!st.caption.trim()) tip('Schreibe einen Bildtext, der die Zielgruppe direkt anspricht.'); } }
  if(step===7){ (S.loesung||'').trim().length>60 ? ok('Du erklärst, wie deine Kampagne die Fallsituation löst.') : tip('Erkläre im Feld „Lösung der Fallsituation“, wie deine Kampagne das Ziel erreicht.'); tip('Übe deinen Vortrag einmal laut mit der Präsentation. Ziel: höchstens 3 Minuten.'); }
  return T;
}
function coachBox(step){
  const T=coachTips(step); if(!T.length) return '';

}

function d3SkinImg(){ const st=d3State(); const src=st.skinImg||''; if(src!==D3_SKINSRC){ D3_SKINSRC=src; D3_SKINIMG=null; if(src) loadImg(src).then(i=>{ D3_SKINIMG=i; const c=document.getElementById('d3Canvas'); if(c) d3Draw(c); }); } return D3_SKINIMG; }
function setSkinFromImage(img){
  const c=document.createElement('canvas'), k=Math.min(1,512/Math.max(img.width,img.height)); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let url; try { url=c.toDataURL('image/jpeg',.85); } catch(e){ toast('Diese Seite erlaubt das direkte Laden nicht. Speichere das Bild und lade es als Datei hoch.'); return; }
  const st=d3State(); st.skinImg=url; if(st.skin!=='eigen' && st.skin2!=='eigen') st.skin='eigen'; saveState(); render();
}
function skinFromUrl(){
  const u=(document.getElementById('skinUrl')||{}).value||''; if(!/^https?:\/\//i.test(u.trim())){ toast('Bitte eine Bildadresse eingeben, die mit http beginnt.'); return; }
