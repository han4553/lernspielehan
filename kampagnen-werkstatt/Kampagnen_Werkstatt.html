/* ---------- Klassenmodus: Lobby, Lehrer-Verwaltung, Live-Abstimmung ---------- */
const PROD_URL = 'https://lernspiele-eight.vercel.app';
const ONLINE = /^https?:/.test(location.protocol);
const API = (ONLINE ? '' : PROD_URL) + '/api/kw';
const BASE_URL = ONLINE ? location.origin + location.pathname : PROD_URL + '/kampagnen-werkstatt/';
const PHASEN = {lobby:'⏳ Lobby', work:'🛠️ Arbeitsphase', vote:'🗳️ Abstimmung', end:'🏁 Beendet'};
let ROOM_META = null, ROOM_TIMER = null, TEACH = null, TEACH_TIMER = null, REPORT_TIMER = null, LAST_REPORT = '', SNAP_TIMER = null, LAST_SNAP = '';
async function api(a, body={}){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(Object.assign({a}, body))});
  let j={}; try { j = await r.json(); } catch(e){}
  if(!r.ok || j.error) throw new Error(j.error || ('Serverfehler '+r.status));
  return j;
}
function qrCanvas(text, px){
  const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(), m=3, sz=n+2*m, k=Math.max(2,Math.floor(px/sz));
  const cv=document.createElement('canvas'); cv.width=cv.height=sz*k; const c=cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height); c.fillStyle='#000';
  for(let r=0;r<n;r++) for(let col=0;col<n;col++) if(q.isDark(r,col)) c.fillRect((col+m)*k,(r+m)*k,k,k);
  return cv;
}
const joinLink = code => BASE_URL + '?raum=' + code;

/* ----- Schüler ----- */
function roomBar(){
  let el=document.getElementById('roomBar');
  if(!S.room){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='roomBar'; document.body.prepend(el); }
  const st=ROOM_META?ROOM_META.state:'';
  el.innerHTML = `🏫 Klasse <b>${S.room.code}</b> · ${escapeHtml(S.room.name||'')} · ${st?PHASEN[st]:'verbinde …'} ${S.room.err?`<span class="bad">· ${escapeHtml(S.room.err)}</span>`:''}`;
}
function roomJoinBox(){
  const code = new URLSearchParams(location.search).get('raum');
  if(S.room) {
    const p=produkt();
    return `<div class="card solid join-box"><h3 style="margin:0">🏫 Klasse ${S.room.code}</h3>
      <p>Angemeldet als <b>${escapeHtml(S.room.name)}</b>.</p>
      ${S.los ? `<p>Dein Produkt (Los ${S.los}): <b>${p?p.e+' '+escapeHtml(p.n):''}</b></p>` : '<p>⏳ Deine Lehrkraft teilt dir gleich ein Produkt zu.</p>'}
      ${ROOM_META && ROOM_META.state==='lobby' ? '<p class="status">⏳ Warte, bis deine Lehrkraft die Arbeitsphase startet. Du kannst dir dein Produkt schon ansehen.</p>' : ''}
      ${S.los?'<button class="btn" onclick="gehe(1)">Zu meinem Produkt ➜</button>':''}
      <p class="hint" style="margin-top:10px"><button class="tbtn" data-roomleave>Klasse verlassen</button></p></div>`;
  }
  if(!code) return '';
  return `<div class="card solid join-box"><h3 style="margin:0 0 6px">🏫 Klasse ${escapeHtml(code.toUpperCase())} beitreten</h3>
    <p class="hint">Gib deinen Vornamen ein. Dein Produkt wird automatisch zugeteilt.</p>
    <div class="los"><input type="text" id="joinName" maxlength="20" placeholder="Vorname"><button class="btn" data-roomjoin="${escapeHtml(code.toUpperCase())}">Beitreten</button></div></div>`;
}
async function roomJoin(code){
  const name=(document.getElementById('joinName').value||'').trim();
  if(!name){ toast('Bitte gib deinen Vornamen ein.'); return; }
  try {
    const keep = S.room && S.room.code===code ? S.room.id : null;
    if(!keep){ const fresh=defaultState(); S=fresh; }
    const r=await api('join',{code,name,id:keep});
    S.room={code,id:r.id,name}; ROOM_META=r.meta; if(r.los) S.los=r.los; S.step=r.los?1:0; saveState(); roomStart(); render();
  } catch(e){ toast('Beitritt nicht möglich: '+e.message); }
}
async function roomLeave(){ if(!await ask('Klasse wirklich verlassen?')) return; S.room=null; ROOM_META=null; clearInterval(ROOM_TIMER); clearInterval(REPORT_TIMER); clearInterval(SNAP_TIMER); saveState(); history.replaceState(null,'',location.pathname); render(); }
async function roomPoll(){
  if(!S.room) return;
  try {
    const r=await api('me',{code:S.room.code,id:S.room.id}); S.room.err='';
    if(r.kicked){ S.room=null; ROOM_META=null; saveState(); clearInterval(ROOM_TIMER); clearInterval(SNAP_TIMER); toast('Du wurdest von der Lehrkraft aus der Klasse entfernt.'); render(); return; }
    const prev=ROOM_META?ROOM_META.state:null; ROOM_META=r.meta;
    let rer=false;
    if(r.me.los && r.me.los!==S.los){ resetDesign(); S.los=r.me.los; rer=true; if(prev) toast('Deine Lehrkraft hat dir ein neues Produkt zugeteilt: '+produkt().n); }
    if(prev!==ROOM_META.state){ rer=true;
      if(ROOM_META.state==='vote' && !S.room.sawVote){ S.room.sawVote=true; S.step=8; }
      if(ROOM_META.state==='work' && S.step===0 && S.los) S.step=1; }
    saveState(); roomBar(); if(rer) render();
  } catch(e){ S.room.err='offline'; roomBar(); }
}
async function roomReport(force){
  if(!S.room || !S.los) return;
  let ok=0; CHECKS.forEach(([,fn])=>{ try{ if(fn(S)) ok++; }catch(e){} });
  const rep={step:S.step, ok, of:CHECKS.length, slogan:S.slogan, pitch:pitchText()};
  const sig=JSON.stringify(rep); if(!force && sig===LAST_REPORT) return;
  try { await api('report',{code:S.room.code,id:S.room.id,rep}); LAST_REPORT=sig; } catch(e){}
}
/* Live-Stand für die Lehrkraft (zweites Fenster): kompletter Arbeitsstand, große Bilder/Videos werden weggelassen */
function liveSnapStr(){
  const mk=lim=>JSON.stringify(S,(k,v)=>k==='room'?undefined:(typeof v==='string' && v.startsWith('data:') && v.length>lim ? '' : v));
  let s=mk(300000); if(s.length>800000) s=mk(40000); if(s.length>800000) s=mk(0); return s;
}
async function liveSend(){
  if(!S.room || !S.los) return; const s=liveSnapStr(); if(s===LAST_SNAP) return;
  try { await api('snap',{code:S.room.code,id:S.room.id,s}); LAST_SNAP=s; if(S.step!==liveSend.st){ liveSend.st=S.step; roomReport(true); } } catch(e){}
}
function roomStart(){
  clearInterval(ROOM_TIMER); clearInterval(REPORT_TIMER); clearInterval(SNAP_TIMER);
  if(!S.room) return;
  SNAP_TIMER=setInterval(liveSend,5000); setTimeout(liveSend,2000);
  roomPoll(); ROOM_TIMER=setInterval(roomPoll,5000);
  REPORT_TIMER=setInterval(()=>roomReport(false),15000); setTimeout(()=>roomReport(true),1500);
}
async function roomVoteSend(){
  try { await api('vote',{code:S.room.code,id:S.room.id,vcode:voteCode()}); S.room.voted=Date.now(); saveState(); render(); }
  catch(e){ toast('Abschicken nicht möglich: '+e.message); }
}

/* ----- Lehrkraft ----- */
function hostLoad(){ try { return JSON.parse(localStorage.getItem('kw-host')||'null'); } catch(e){ return null; } }
function hostSave(h){ try { localStorage.setItem('kw-host', JSON.stringify(h)); } catch(e){} }
function teacherOpen(){
  let o=document.getElementById('teacher'); if(!o){ o=document.createElement('div'); o.id='teacher'; document.body.appendChild(o); }
  o.style.display='block'; TEACH = TEACH || {host:hostLoad(), data:null, err:''};
  teacherRender(); if(TEACH.host) teacherPoll(); clearInterval(TEACH_TIMER); TEACH_TIMER=setInterval(()=>{ if(TEACH.host) teacherPoll(); },3000);
}

let PS3_RAF=null, PS3_AUTO=true;
function ps3Init(){
  const c=document.getElementById('psD3'); if(!c) return;
  const st=d3State(); PS3_AUTO=true;
  (st.mode==='foto3d'?ensureFotoMesh():Promise.resolve()).then(()=>d3MakeTex()).then(()=>{
    const loop=()=>{ if(!document.getElementById('psD3')){ PS3_RAF=null; return; } if(PS3_AUTO){ st.yaw+=0.012; } d3Draw(c); PS3_RAF=requestAnimationFrame(loop); };
    cancelAnimationFrame(PS3_RAF); PS3_RAF=requestAnimationFrame(loop);
  });
  let drag=null;
  c.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; PS3_AUTO=false; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove',e=>{ if(!drag) return; st.yaw+=(e.clientX-drag.x)*0.01; st.pitch=Math.max(-1.3,Math.min(1.3,st.pitch+(e.clientY-drag.y)*0.01)); drag={x:e.clientX,y:e.clientY}; });
  c.addEventListener('pointerup',()=>drag=null); c.addEventListener('pointercancel',()=>drag=null);
  c.addEventListener('wheel',e=>{ e.preventDefault(); st.zoom=Math.max(.5,Math.min(2.5,st.zoom*(e.deltaY<0?1.08:.93))); },{passive:false});
}
function ps3Btn(k){ const st=d3State();
  if(k==='auto') PS3_AUTO=!PS3_AUTO; if(k==='front'){ PS3_AUTO=false; st.yaw=0; st.pitch=0; } if(k==='side'){ PS3_AUTO=false; st.yaw=-HALF; st.pitch=0; }
  if(k==='in') st.zoom=Math.min(2.5,st.zoom*1.2); if(k==='out') st.zoom=Math.max(.5,st.zoom/1.2); }
function psComicInit(){ const c=document.getElementById('psComic'); if(c && S.comic){ drawComicScene(c.getContext('2d'),c.width,c.height,S.comic.scenes[0],.6); setTimeout(()=>{ if(document.getElementById('psComic')) comicPlay(null,c); },400); } }

  S=defaultState(); document.body.classList.add('live-ro'); document.title='📺 Live – Klasse '+code;
  const bar=document.createElement('div'); bar.id='liveBar'; document.body.prepend(bar);
  bar.addEventListener('change',e=>{ if(e.target.id==='liveSel') liveSel(e.target.value); if(e.target.id==='liveAuto'){ LIVE.auto=e.target.checked; clearInterval(LIVE.autoT); if(LIVE.auto) LIVE.autoT=setInterval(()=>liveNav(1),15000); } });
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') liveNav(1); if(e.key==='ArrowLeft') liveNav(-1); });
  liveBar(); livePlayers(); setInterval(livePlayers,6000); setInterval(liveFetch,3000); setInterval(liveInfo,1000);
}
async function livePlayers(){
  if(!LIVE.hk){ LIVE.err='Kein Lehrer-Schlüssel – bitte die Live-Ansicht aus der Klassenverwaltung öffnen.'; liveBar(); return; }
  try { const r=await api('hstate',{code:LIVE.code,hk:LIVE.hk}); LIVE.ps=r.players||[]; LIVE.reps=r.reports||{}; LIVE.err='';
    if(!LIVE.id && LIVE.ps.length){ LIVE.id=LIVE.ps[0].id; liveFetch(); }
  } catch(e){ LIVE.err=e.message; }
  liveBar();
}
function liveBar(){
  const b=document.getElementById('liveBar'); if(!b) return; const ps=LIVE.ps;
  b.innerHTML=`<div class="lb1"><b>📺 Live-Ansicht · Klasse ${escapeHtml(LIVE.code)}</b>
    <button class="tbtn" data-livenav="-1" title="vorheriger Schüler (←)">◀</button>
    <select id="liveSel">${ps.length?ps.map(p=>{ const pr=PRODUKTE[(p.los||1)-1]; return `<option value="${p.id}" ${p.id===LIVE.id?'selected':''}>${escapeHtml(liveName(p))}${p.los&&pr?' – '+escapeHtml(pr.n):''}</option>`; }).join(''):'<option>noch niemand beigetreten</option>'}</select>
    <button class="tbtn" data-livenav="1" title="nächster Schüler (→)">▶</button>
    <label class="hint"><input type="checkbox" id="liveAuto" ${LIVE.auto?'checked':''}> automatisch alle 15 s weiter</label>
    <span id="liveInfo" class="hint"></span></div>
    <div class="lb2">${ps.map(p=>{ const r=LIVE.reps[p.id]||{}; return `<button class="lchip ${p.id===LIVE.id?'on':''}" data-liveid="${p.id}">${escapeHtml(liveName(p))} <small>${r.step!=null?r.step+'. '+(STUFEN[r.step]||''):'–'}</small></button>`; }).join('')}</div>
    ${LIVE.err?`<div class="bad">⚠️ ${escapeHtml(LIVE.err)}</div>`:''}`;
  liveInfo();
}
function liveInfo(){ const el=document.getElementById('liveInfo'); if(!el) return; const p=LIVE.ps.find(x=>x.id===LIVE.id);
  el.textContent = !p ? '' : (LIVE.t ? '👀 '+liveName(p)+' · Etappe '+S.step+' · Stand vor '+Math.max(0,Math.round((Date.now()-LIVE.got)/1000))+' s · nur ansehen' : '⏳ '+liveName(p)+' hat noch nichts bearbeitet'); }
function liveSel(id){ if(!id||id===LIVE.id) return; LIVE.id=String(id); LIVE.t=0; S=defaultState(); D3_MESH=null; FOTO3D.key=''; FOTO3D.mesh=null; render(); window.scrollTo({top:0}); liveBar(); liveFetch(); }
function liveNav(d){ const ps=LIVE.ps; if(!ps.length) return; let i=ps.findIndex(p=>p.id===LIVE.id); i=(i+d+ps.length)%ps.length; liveSel(ps[i].id); }
async function liveFetch(){
  if(!LIVE||!LIVE.id||!LIVE.hk) return; const id=LIVE.id;
  try { const r=await api('live',{code:LIVE.code,hk:LIVE.hk,id,t:LIVE.t}); if(id!==LIVE.id) return;
    if(r.none){ if(LIVE.t){ LIVE.t=0; S=defaultState(); render(); } liveInfo(); return; }
    LIVE.got = r.same ? LIVE.got : Date.now();
    if(r.same) return;
    const st=JSON.parse(r.s||'{}'); const y=window.scrollY;
    if(st.los!==S.los){ D3_MESH=null; FOTO3D.key=''; FOTO3D.mesh=null; }
    S=Object.assign(defaultState(), st); LIVE.t=r.t; LIVE.got=r.t; render(); window.scrollTo({top:y}); liveInfo();
  } catch(e){ LIVE.err=e.message; liveBar(); }
}
(function roomInit(){
  const prm=new URLSearchParams(location.search), code=(prm.get('raum')||'').toUpperCase();
  if(prm.has('live')){ liveBoot(prm); return; }
  if(code && S.room && S.room.code!==code){ S.room=null; }
  if(code && !S.room){ S.step=0; }
  saveState();
  if(S.room) roomStart();
  roomBar();
  if(prm.has('lehrer')) setTimeout(teacherOpen,50);
})();
render();
</script>
</body>
</html>
