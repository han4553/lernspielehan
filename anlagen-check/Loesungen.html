<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anlagen-Check Lösungen</title>
<style>
:root{--paper:#f7f2e6;--card:#fffdf7;--ink:#1a3c6e;--ink2:#12223a;--sky:#e8f4f8;--red:#c8372d;--ok:#2e7d4f;--line:#d6cdb4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink2);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;padding-bottom:40px}
#app{max-width:720px;margin:0 auto;padding:0 14px}
.hero{background:var(--ink);color:#fff;border-radius:0 0 22px 22px;margin:0 -14px 16px;padding:24px 18px 20px}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;opacity:.9}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;margin:12px 0;box-shadow:3px 3px 0 var(--ink)}
input,select{font:inherit;font-size:17px;padding:11px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--sky);width:100%;min-width:0}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px 16px;font-weight:800;font-size:16px;min-height:46px;cursor:pointer;font-family:inherit;margin-top:10px}
.err{color:var(--red);font-weight:700;margin-top:8px}
.stask{border-top:2px dotted var(--line);padding:10px 0}.stask:first-child{border-top:0}
h3{margin:0 0 6px;color:var(--ink)}h4{margin:10px 0 4px}
.st{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0}.st td,.st th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.st th{background:var(--sky)}.st td.n{text-align:right;white-space:nowrap;font-family:ui-monospace,"Courier New",monospace}
.why{color:#52617a;font-size:14px}.sm{font-size:14px;color:#52617a}
.tablewrap{overflow-x:auto}
</style></head><body><div id="app">
<div class="hero"><h1>Lösungen</h1><p>Anlagen-Check · Arbeitsblätter</p></div>
<div class="card" id="gate"><h3 id="pt">Lösungsseite</h3><div class="sm" id="pd">Das Passwort bekommst du von deiner Lehrkraft.</div>
<select id="sel" style="display:none;margin-top:10px"></select>
<input id="pw" type="password" autocomplete="off" placeholder="Passwort" style="margin-top:10px">
<button class="btn" id="go">Lösung anzeigen</button><div class="err" id="er"></div></div>
<div class="card" id="out" style="display:none"></div>
</div>

const $=s=>document.querySelector(s);
let id=(new URLSearchParams(location.search).get('s')||location.hash.slice(1)||'').toUpperCase();
if(!BLOBS[id]){const sel=$('#sel');sel.style.display='block';sel.innerHTML='<option value="">Seite wählen</option>'+Object.keys(BLOBS).map(k=>'<option value="'+k+'">'+k.replace('L','Seite ')+': '+BLOBS[k].t+'</option>').join('');sel.onchange=()=>{id=sel.value;head()};}
function head(){if(BLOBS[id]){$('#pt').textContent='Lösung zu '+id.replace('L','Seite ')+': '+BLOBS[id].t}}
head();
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function dec(blob,pw){const d=b64(blob),salt=d.slice(0,16),iv=d.slice(16,28),ct=d.slice(28);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const p=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);return new TextDecoder().decode(p)}
async function go(){const er=$('#er');er.textContent='';if(!BLOBS[id]){er.textContent='Bitte erst die Seite wählen.';return}
 const pw=$('#pw').value.trim();if(!pw){er.textContent='Bitte Passwort eingeben.';return}
 if(!window.crypto||!crypto.subtle){er.textContent='Dieser Browser kann die Lösung nicht entschlüsseln. Bitte die Seite über https öffnen.';return}
 $('#go').disabled=true;$('#go').textContent='Prüfe ...';
 let html=null;try{html=await dec(BLOBS[id].a,pw)}catch(e){try{html=await dec(BLOBS[id].m,pw)}catch(e2){html=null}}
 $('#go').disabled=false;$('#go').textContent='Lösung anzeigen';
 if(html===null){er.textContent='Falsches Passwort.';return}
 const o=$('#out');o.innerHTML='<h2 style="margin:0 0 8px;color:var(--ink)">Lösung: '+BLOBS[id].t+'</h2><div class="tablewrap">'+html+'</div>';o.style.display='block';$('#gate').style.display='none';window.scrollTo(0,0)}
$('#go').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
