<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anlagen-Check</title>
<style>
:root{--paper:#f7f2e6;--card:#fffdf7;--ink:#1a3c6e;--ink2:#12223a;--sky:#e8f4f8;--red:#c8372d;--ok:#2e7d4f;--okbg:#e3f4e8;--badbg:#fbe4e1;--line:#d6cdb4;--warn:#f2b705}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink2);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;padding-bottom:40px}
.mono,.n,input.amt,input.num,.bon{font-family:ui-monospace,"Courier New",monospace}
#app{max-width:720px;margin:0 auto;padding:0 14px}
h1,h2,h3,h4{margin:0}
header.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;margin:0 -14px 14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .ttl{flex:1;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top button{background:transparent;border:2px solid #fff;color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px}
.chip{background:#fff;color:var(--ink);border-radius:20px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.hero{background:var(--ink);color:#fff;border-radius:0 0 22px 22px;margin:0 -14px 16px;padding:26px 18px 20px;position:relative;overflow:hidden}
.hero h1{font-size:34px;letter-spacing:.5px}
.hero p{margin:6px 0 0;opacity:.9}
.hero .perf{position:absolute;left:0;right:0;bottom:0;height:10px;background:radial-gradient(circle at 8px 10px,var(--paper) 6px,transparent 7px) 0 0/16px 10px repeat-x}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;margin:12px 0;box-shadow:3px 3px 0 var(--ink)}
.card.lv{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.card.lv:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.lvh{display:flex;align-items:center;gap:12px}
.ic{font-size:30px;width:46px;height:46px;border-radius:12px;background:var(--sky);display:flex;align-items:center;justify-content:center;flex:none}
.lvh b{font-size:18px}.sm{font-size:14px;color:#52617a}
.bar{height:10px;border-radius:6px;background:#e5dfcc;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px 16px;font-weight:800;font-size:16px;min-height:46px;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45}
.btn.sm2{padding:8px 12px;min-height:38px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.info{background:var(--card);border:2px dashed var(--ink);border-radius:14px;margin:12px 0;padding:0 14px}
details.info summary{padding:12px 0;font-weight:800;cursor:pointer;color:var(--ink)}
details.info img{max-width:100%;height:auto;display:block;margin:8px auto}
details.info table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
details.info td,details.info th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
details.info th{background:var(--sky)}
.merke{background:#fff4dd;border:2px solid #e3c277;border-radius:10px;padding:10px 12px;margin:10px 0 14px;font-size:15px}
.formel{background:var(--sky);border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:700}
.task{background:var(--card);border:2px solid var(--ink);border-radius:14px;margin:14px 0;position:relative}
.task .th{background:var(--sky);padding:10px 14px;border-bottom:2px solid var(--ink);border-radius:12px 12px 0 0;display:flex;gap:10px;align-items:baseline}
.th .no{font-family:ui-monospace,monospace;font-weight:900;color:var(--red)}
.task .tb{padding:12px 14px}
.part{border-top:2px dotted var(--line);padding:12px 0;position:relative}
.part:first-child{border-top:0}
.plabel{font-weight:800;margin-bottom:8px;color:var(--ink)}
.crow{display:flex;align-items:center;gap:8px;margin:6px 0}
.crow label{flex:1;font-size:15px}
input.num,input.amt{width:130px;font-size:17px;padding:9px 10px;border:2px solid var(--ink);border-radius:10px;text-align:right;background:var(--sky);min-width:0}
.crow .u{width:18px;color:#52617a}
select{font:inherit;font-size:16px;padding:9px 6px;border:2px solid var(--ink);border-radius:10px;background:var(--sky);max-width:100%;min-width:0}
.side{margin:8px 0}
.side h5{margin:0 0 4px;font-size:14px;letter-spacing:1px;color:var(--red)}
.brow{display:flex;gap:6px;margin:5px 0}
.brow select{flex:1}
.brow input.amt{width:112px}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
.bad{background:var(--badbg)!important;border-color:var(--red)!important}
.fb{margin-top:8px;font-size:15px;min-height:0}
.fb.g{color:var(--ok);font-weight:700}.fb.r{color:var(--red);font-weight:700}
.tip{background:#fff4dd;border-left:4px solid var(--warn);padding:8px 10px;margin-top:8px;border-radius:6px;font-size:14px}
.stamp{position:absolute;right:6px;top:8px;border:3px solid var(--ok);color:var(--ok);font-weight:900;padding:2px 8px;border-radius:6px;transform:rotate(-8deg);letter-spacing:1px;font-size:14px;background:#fffdf7;opacity:.95}
.stamp.half{border-color:#c98a00;color:#c98a00}.stamp.zero{border-color:#888;color:#666}
.mcb{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;font:inherit;font-size:15px;cursor:pointer}
.st{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0}.st td,.st th{border:1px solid var(--line);padding:6px 8px;text-align:left}.st th{background:var(--sky)}.st td.n{text-align:right;white-space:nowrap}
.why{color:#52617a;font-size:14px}
.deck{text-align:center}
.cardbig{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:26px 14px;margin:14px 0;font-size:22px;font-weight:800;min-height:100px;display:flex;align-items:center;justify-content:center}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cats.c3{grid-template-columns:repeat(3,1fr)}.cats.c13{grid-template-columns:repeat(2,1fr)}
.cats button{min-width:0;overflow-wrap:anywhere;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:12px 6px;font:inherit;font-weight:700;font-size:15px;min-height:56px;cursor:pointer;color:var(--ink2)}
.cats button:active{background:var(--sky)}
.sfb{min-height:48px;margin:10px 0;font-weight:700}
.streak{font-weight:800;color:var(--red)}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr svg{width:150px;height:150px;background:#fff;padding:6px;border:2px solid var(--ink);border-radius:10px;flex:none}
.url{word-break:break-all;font-size:13px;color:#52617a}
#big{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#big svg{width:min(80vw,70vh);height:min(80vw,70vh)}
.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-size:40px;font-weight:900;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;max-width:90vw}
@media(max-width:380px){input.num,input.amt{width:100px}.brow input.amt{width:92px}}
</style></head><body>
<div id="app"></div>
<div id="big"><div id="bigqr"></div><div class="url" id="bigurl"></div><button class="btn" onclick="document.getElementById('big').style.display='none'">Schließen</button></div>
<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';

// Lösungs-HTML (gemeinsam für App und Lösungsseite)
function solPart(p){
 let h='';
 if(p.label||p.q)h+='<h4>'+(p.label||p.q)+'</h4>';
 if(p.t==='calc'){h+='<table class="st">'+p.rows.map(r=>'<tr><td>'+r[0]+'</td><td class="n">'+fmt(r[1])+(r[2]==='%'?' %':r[2]==='€'?' €':'')+'</td></tr>').join('')+'</table>';}
 else if(p.t==='book'){h+='<table class="st bk"><tr><th>Soll</th><th>Betrag</th><th>Haben</th><th>Betrag</th></tr>';const n=Math.max(p.soll.length,p.haben.length);for(let i=0;i<n;i++){const s=p.soll[i],q=p.haben[i];h+='<tr><td>'+(s?CK(s[0]):'')+'</td><td class="n">'+(s?fmt(s[1]):'')+'</td><td>'+(q?CK(q[0]):'')+'</td><td class="n">'+(q?fmt(q[1]):'')+'</td></tr>';}h+='</table>';}
 else if(p.t==='match'){h+='<table class="st">'+p.rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';}
 else if(p.t==='mc'){h+='<p><b>'+p.opts[p.ok]+'</b></p><p class="why">'+p.why+'</p>';}
 return h;
}
function solTask(t){return '<section class="stask"><h3>Aufgabe '+t.no+': '+t.title+'</h3>'+t.parts.map(solPart).join('')+'</section>';}

function solSort(o){const cn={};o.cats.forEach((c,i)=>cn[c[0]]=LET[i]+' = '+c[1]);return '<section class="stask"><h3>'+o.title+'</h3><table class="st">'+o.cards.map(c=>'<tr><td>'+c[0]+'</td><td><b>'+cn[c[1]]+'</b></td></tr>').join('')+'</table></section>';}

<script>
(function(){
'use strict';
const D=window.DATA,ACC=D.ACC,TASKS=D.TASKS,SORTS=D.SORTS,fmt=D.fmt;
const PROD='https://lernspiele-eight.vercel.app/anlagen-check/';
const LEVELS=[
 {n:1,ic:'📒',t:'Bilanz und Erfolgskonten',s:'Konten zuordnen: Aktiva, Passiva, Aufwand, Ertrag'},
 {n:2,ic:'🧾',t:'Anschaffungskosten',s:'Nebenkosten, Rabatt, Vorsteuer, Anlagekonto finden'},
 {n:3,ic:'📥',t:'Buchungssätze',s:'Anlagegüter kaufen und bezahlen'},
 {n:4,ic:'📉',t:'Abschreibung',s:'Satz, Jahresbetrag, Kaufjahr, Buchwert, Buchung'},
 {n:5,ic:'🧮',t:'Gesamtfall Serveranlage',s:'Von der Rechnung bis zum Buchwert'},
 {n:6,ic:'🏁',t:'Abschluss',s:'Bilanz oder Erfolgskonto? Gewinn ermitteln'}];
const INFO={
1:'<details class="info"><summary>📖 Info: Die Bilanz</summary><img alt="Bilanz mit Aktiva und Passiva" src="'+IMG.bilanz+'"><div class="merke"><b>Merke:</b> Aktiva zeigt, wofür das Geld ausgegeben wurde. Passiva zeigt, woher das Geld kommt. Ein Anlagekonto im Soll heißt: Der Betrieb hat etwas gekauft.</div></details><details class="info"><summary>📖 Info: Aufwand und Ertrag</summary><img alt="Aufwands- und Ertragskonten, GuV" src="'+IMG.erfolg+'"><div class="merke"><b>Merke:</b> Aufwand steht im Soll und mindert das Eigenkapital. Ertrag steht im Haben und erhöht es. Die Abschreibung (650) ist Aufwand, obwohl kein Geld abfließt.</div><img alt="Comic" src="'+IMG.cartoon+'"></details>',
2:'<details class="info"><summary>📖 Info: Anschaffungskosten und Nebenkosten</summary><div class="formel">Listenpreis (netto)<br>− Preisminderungen (Rabatt, Bonus, Skonto)<br>+ Nebenkosten (Fracht, Montage, Notar ...)<br>= Anschaffungskosten (AK)</div><p><b>Die Umsatzsteuer gehört nicht zu den AK.</b> Sie wird als Vorsteuer (260) gebucht, weil das Finanzamt sie erstattet.</p><table><tr><th>Gehört zu den AK</th><th>Aufwand, nicht AK</th></tr><tr><td>Transport, Fracht, Überführung<br>Montage, Aufbau, Fundament<br>Zulassung<br>Notar, Grundbuch, Grunderwerbsteuer<br>Inbetriebnahme</td><td>Reparatur, Wartung (613)<br>Schulung (66)<br>Versicherung (690), Kfz-Steuer<br>Tankfüllung (605)<br>Kreditzinsen (751)</td></tr></table><div class="merke"><b>Side Fact:</b> Bei bebauten Grundstücken wird der Kaufpreis in Boden und Gebäude aufgeteilt, die Nebenkosten im selben Verhältnis. Nur das Gebäude wird abgeschrieben, der Boden nicht. Die Grunderwerbsteuer beträgt in Baden-Württemberg 5 %.</div></details>',
3:'<details class="info"><summary>📖 Info: So buchst du einen Kauf</summary><div class="formel">Rechnung: Anlagekonto (Soll) + 260 Vorsteuer (Soll) an 44 (Haben)<br>Zahlung: 44 (Soll) an 280 Bank (Haben)<br>Sofortzahlung: Anlagekonto + 260 an 280 oder 282 Kasse<br>Darlehen: 425 im Haben</div></details>',
4:'<details class="info"><summary>📖 Info: Lineare Abschreibung</summary><div class="formel">Jahresbetrag = AK : Nutzungsdauer<br>Satz = 100 % : Nutzungsdauer<br>Kaufjahr = Jahresbetrag × Monate : 12<br>(der Kaufmonat zählt voll)<br>Buchung: 650 an Anlagekonto</div><img alt="Buchwert sinkt jedes Jahr" src="'+IMG.buchwert+'"><div class="merke"><b>Merke:</b> Buchwert = AK minus bisherige Abschreibungen. GWG (derzeit bis 800 € netto, bitte Stand prüfen) werden sofort abgeschrieben: 654 an 089.</div></details>'};
// ---- storage
const KEY='anlagencheck-v1';let P={};
try{P=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){P={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
const $=s=>document.querySelector(s);const app=$('#app');
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function parse(s){s=String(s).replace(/[€%\s]/g,'');if(s==='')return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)}
function weight(t){return t.parts.reduce((a,p)=>a+(p.t==='calc'?p.rows.length:p.t==='book'?p.soll.length+p.haben.length:p.t==='match'?p.rows.length:1),0)}
function pw(p){return p.t==='calc'?p.rows.length:p.t==='book'?p.soll.length+p.haben.length:p.t==='match'?p.rows.length:1}
function earned(id){const t=TASKS.find(x=>x.id===id);const s=P[id]||{};let e=0;t.parts.forEach((p,i)=>{if(s['p'+i]!=null)e+=pw(p)*s['p'+i]});return e}
function maxOf(o){return o.cards?o.cards.length:weight(o)}
function sortScore(o){const s=P[o.id];return s&&s.best!=null?s.best:0}
function lvlStats(n){let e=0,m=0;TASKS.filter(t=>t.lvl===n).forEach(t=>{e+=earned(t.id);m+=weight(t)});SORTS.filter(t=>t.lvl===n).forEach(t=>{e+=sortScore(t);m+=t.cards.length});return{e,m}}
function total(){let e=0,m=0;for(let n=1;n<=6;n++){const s=lvlStats(n);e+=s.e;m+=s.m}return{e,m}}
function note(p){return p>=92?'1 (sehr gut)':p>=81?'2 (gut)':p>=67?'3 (befriedigend)':p>=50?'4 (ausreichend)':p>=30?'5 (mangelhaft)':'6 (ungenügend)'}
// ---- QR
function qrSvg(url){try{const q=qrcode(0,'M');q.addData(url);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}catch(e){return ''}}
function myUrl(){const h=location.href.split('#')[0];return /^https?:/.test(h)?h:PROD}
// ---- routing
function route(){const h=location.hash.slice(1);window.scrollTo(0,0);if(!h)return home();if(h[0]==='l')return level(+h.slice(1));if(h.slice(0,2)==='t-')return taskPage(h.slice(2));if(h.slice(0,3)==='tr-')return training(h.slice(3));if(h==='z')return zeugnis();home()}
window.addEventListener('hashchange',route);
function nav(h){location.hash=h}
function head(title,back){return '<header class="top"><button data-nav="'+back+'">‹ Zurück</button><div class="ttl">'+title+'</div><span class="chip" id="pts"></span></header>'}
function updPts(){const t=total();const e=document.getElementById('pts');if(e)e.textContent=Math.round(t.e)+' / '+t.m+' P'}
// ---- home
function home(){
 const t=total(),pc=t.m?Math.round(t.e/t.m*100):0;
 let h='<div class="hero"><h1>Anlagen-Check</h1><p>Anschaffung, Abschreibung und Konten im Einzelhandel. Löse alle Aufgaben direkt am Handy.</p><div class="perf"></div></div>';
 h+='<div class="card"><div class="score"><div class="big">'+pc+' %</div><div><b>Note '+note(pc)+'</b><div class="sm">'+Math.round(t.e)+' von '+t.m+' Punkten</div></div></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
 LEVELS.forEach(l=>{const s=lvlStats(l.n),p=s.m?Math.round(s.e/s.m*100):0;h+='<button class="card lv" data-nav="l'+l.n+'"><div class="lvh"><div class="ic">'+l.ic+'</div><div style="flex:1"><b>'+l.n+'  '+l.t+'</b><div class="sm">'+l.s+'</div></div><b>'+p+' %</b></div><div class="bar"><i style="width:'+p+'%"></i></div></button>'});
 h+='<h3 style="margin:18px 0 4px">🎲 Training ohne Ende</h3><div class="sm">Immer neue Zahlen. Zählt nicht für die Note.</div>';
 [['afa','📉','Abschreibungs-Training','Satz, Jahresbetrag, Kaufjahr, Buchung'],['kauf','📥','Buchungs-Training','Kauf, Zahlung, Darlehen, GWG'],['ak','🧾','AK-Training','Rabatt, Fracht, Montage, USt']].forEach(x=>{const c=(P.tr&&P.tr[x[0]])||0;h+='<button class="card lv" data-nav="tr-'+x[0]+'"><div class="lvh"><div class="ic">'+x[1]+'</div><div style="flex:1"><b>'+x[2]+'</b><div class="sm">'+x[3]+'</div></div><b>'+c+' ✔</b></div></button>'});
 h+='<div class="card"><h3>📱 Mit dem Handy öffnen</h3><div class="qr"><div id="hq"></div><div><div class="sm">Code scannen und loslegen.</div><div class="url" id="hu"></div><div class="row" style="margin-top:8px"><button class="btn sm2" data-act="copy">Link kopieren</button><button class="btn sm2 ghost" data-act="bigqr">QR groß</button></div></div></div></div>';
 h+='<div class="row" style="margin-top:6px"><button class="btn ghost sm2" data-act="reset">Fortschritt zurücksetzen</button></div>';
 app.innerHTML=h;const u=myUrl();$('#hq').innerHTML=qrSvg(u);$('#hu').textContent=u;
}
// ---- level
function level(n){
 const L=LEVELS[n-1];if(!L)return home();
 let h=head(L.n+'  '+L.t,'')+(INFO[n]||'');
 SORTS.filter(s=>s.lvl===n).concat(TASKS.filter(t=>t.lvl===n)).forEach(o=>{
  const isS=!!o.cards;const m=maxOf(o),e=isS?sortScore(o):earned(o.id),p=m?Math.round(e/m*100):0;
  h+='<button class="card lv" data-nav="t-'+o.id+'"><div class="lvh"><div class="ic">'+(isS?'🃏':'✏️')+'</div><div style="flex:1"><b>'+(isS?'':'Aufgabe '+o.no+'  ')+o.title+'</b><div class="sm">'+(isS?o.cards.length+' Karten':'Buchungen und Rechnungen')+'</div></div><b>'+p+' %</b></div><div class="bar"><i style="width:'+p+'%"></i></div></button>'});
 if(n===6)h+='<button class="btn" style="width:100%" data-nav="z">🎓 Zeugnis ansehen</button>';
 app.innerHTML=h;updPts();
}
// ---- Zeugnis
function zeugnis(){const t=total(),pc=t.m?Math.round(t.e/t.m*100):0;let h=head('Zeugnis','')+'<div class="card"><h3>Dein Ergebnis</h3><div class="big">'+pc+' %</div><p><b>Note '+note(pc)+'</b> nach IHK-Schlüssel</p><table class="st">';
 LEVELS.forEach(l=>{const s=lvlStats(l.n);h+='<tr><td>'+l.n+'  '+l.t+'</td><td class="n">'+Math.round(s.e)+' / '+s.m+'</td></tr>'});h+='</table></div>';app.innerHTML=h;updPts()}
// ---- task page
const CUR={};
function taskPage(id){
 const so=SORTS.find(s=>s.id===id);if(so)return sortPage(so);
 const t=TASKS.find(x=>x.id===id);if(!t)return home();
 renderTask(t,'l'+t.lvl,false);
}
function renderTask(t,back,training){
 CUR.t=t;CUR.training=training;
 let h=head((training?'':'Aufgabe '+t.no+'  ')+t.title,back);
 h+='<div class="task"><div class="th">'+(t.no?'<span class="no">'+t.no+'</span>':'')+'<b>'+t.title+'</b></div><div class="tb"><p style="margin:0 0 6px">'+t.text+'</p>';
 t.parts.forEach((p,i)=>{h+='<div class="part" data-i="'+i+'">'+partHTML(p,i)+'</div>'});
 h+='</div></div>';
 if(training)h+='<button class="btn" style="width:100%" data-act="next">Nächste Aufgabe ›</button>';
 app.innerHTML=h;updPts();
 const s=training?{}:(P[t.id]||{});t.parts.forEach((p,i)=>{if(s['p'+i]!=null)stampPart(i,s['p'+i],true)});
}
function accOpts(){return '<option value="">Konto wählen</option>'+ACC.map(a=>'<option value="'+a[0]+'">'+a[0]+' '+a[1]+'</option>').join('')}
function brow(){return '<div class="brow"><select class="acc">'+accOpts()+'</select><input class="amt" inputmode="decimal" placeholder="Betrag" autocomplete="off"></div>'}
function partHTML(p,i){
 let h='';
 if(p.label||p.q)h+='<div class="plabel">'+(p.label||p.q)+'</div>';
 if(p.t==='calc'){p.rows.forEach((r,j)=>{h+='<div class="crow"><label>'+r[0]+'</label><input class="num" inputmode="decimal" data-j="'+j+'" autocomplete="off"><span class="u">'+(r[2]==='%'?'%':r[2]==='€'?'€':'')+'</span></div>'})}
 else if(p.t==='book'){h+='<div class="side"><h5>SOLL</h5><div class="rows" data-s="S">'+p.soll.map(brow).join('')+'</div><button class="btn ghost sm2" data-act="add" data-side="S">+ Zeile</button></div><div class="side"><h5>HABEN</h5><div class="rows" data-s="H">'+p.haben.map(brow).join('')+'</div><button class="btn ghost sm2" data-act="add" data-side="H">+ Zeile</button></div>'}
 else if(p.t==='match'){p.rows.forEach((r,j)=>{h+='<div class="crow"><label>'+r[0]+'</label><select data-j="'+j+'"><option value="">?</option>'+p.opts.map(o=>'<option>'+o+'</option>').join('')+'</select></div>'})}
 else if(p.t==='mc'){p.opts.forEach((o,j)=>{h+='<button class="mcb" data-act="mc" data-j="'+j+'">'+o+'</button>'})}
 h+='<div class="fb"></div>';
 if(p.t!=='mc')h+='<div class="row" style="margin-top:8px"><button class="btn sm2" data-act="check">Prüfen</button><button class="btn ghost sm2" data-act="hint">Tipp</button><button class="btn ghost sm2" data-act="solve">Lösung</button></div>';
 return h;
}
function stampPart(i,f,silent){const el=document.querySelector('.part[data-i="'+i+'"]');if(!el||el.querySelector('.stamp'))return;const s=document.createElement('div');s.className='stamp'+(f>=1?'':f>0?' half':' zero');s.textContent=f>=1?'BEZAHLT ✔':f>0?'GELÖST':'GEZEIGT';el.appendChild(s);el.querySelectorAll('input,select,.btn,.mcb').forEach(x=>x.disabled=true)}
function record(t,i,f){if(CUR.training){const k=CUR.t.id;if(f>0&&!CUR.counted){CUR.counted=1;P.tr=P.tr||{};P.tr[CUR.kind]=(P.tr[CUR.kind]||0)+1;save()}return}const s=P[t.id]=P[t.id]||{};const old=s['p'+i];if(old==null||f>old)s['p'+i]=f;else if(old!=null){}save();updPts()}
const TRY={};
function check(el){
 const t=CUR.t,i=+el.dataset.i,p=t.parts[i];const key=t.id+':'+i;TRY[key]=(TRY[key]||0)+1;
 const fb=el.querySelector('.fb');let good=0,tot=pw(p),allOk=false;
 if(p.t==='calc'){el.querySelectorAll('input.num').forEach(inp=>{const r=p.rows[+inp.dataset.j];const v=parse(inp.value);const ok=!isNaN(v)&&Math.abs(v-r[1])<=0.011;inp.classList.toggle('ok',ok);inp.classList.toggle('bad',!ok&&inp.value!=='');if(ok)good++});allOk=good===tot;fb.className='fb '+(allOk?'g':'r');fb.textContent=allOk?'Alles richtig!':good+' von '+tot+' Feldern richtig. Rote Felder noch einmal prüfen.'}
 else if(p.t==='match'){el.querySelectorAll('select[data-j]').forEach(sel=>{const r=p.rows[+sel.dataset.j];const ok=sel.value===r[1];sel.classList.toggle('ok',ok);sel.classList.toggle('bad',!ok&&sel.value!=='');if(ok)good++});allOk=good===tot;fb.className='fb '+(allOk?'g':'r');fb.textContent=allOk?'Alles richtig!':good+' von '+tot+' richtig.'}
 else if(p.t==='book'){
  const rows=[...el.querySelectorAll('.brow')].map(r=>({r,side:r.parentNode.dataset.s,acc:r.querySelector('.acc').value,amt:parse(r.querySelector('.amt').value)}));
  const used=new Set();let missing=0;
  ['S','H'].forEach(sd=>{(sd==='S'?p.soll:p.haben).forEach(sol=>{const m=rows.findIndex((x,k)=>!used.has(k)&&x.side===sd&&x.acc===sol[0]&&!isNaN(x.amt)&&Math.abs(x.amt-sol[1])<=0.011);if(m>=0){used.add(m);good++}else missing++})});
  rows.forEach((x,k)=>{const touched=x.acc!==''||x.r.querySelector('.amt').value!=='';const ok=used.has(k);x.r.querySelectorAll('select,input').forEach(c=>{c.classList.toggle('ok',ok);c.classList.toggle('bad',!ok&&touched)})});
  const extra=rows.filter((x,k)=>!used.has(k)&&(x.acc!==''||x.r.querySelector('.amt').value!=='')).length;
  allOk=good===tot&&extra===0;fb.className='fb '+(allOk?'g':'r');fb.textContent=allOk?'Buchungssatz stimmt!':good+' von '+tot+' Buchungszeilen richtig.'+(extra?' Rote Zeilen prüfen (Konto, Seite oder Betrag).':'')+(missing&&!extra?' Es fehlt noch eine Zeile.':'')}
 if(allOk){const f=TRY[key]===1?1:0.5;record(t,i,f);stampPart(i,f);toast(f===1?'Stark! Beim ersten Versuch richtig.':'Richtig!')}
}
function solve(el){const t=CUR.t,i=+el.dataset.i,p=t.parts[i];
 if(p.t==='calc'){el.querySelectorAll('input.num').forEach(inp=>{const r=p.rows[+inp.dataset.j];inp.value=fmt(r[1]);inp.classList.add('ok')})}
 else if(p.t==='match'){el.querySelectorAll('select[data-j]').forEach(s=>{s.value=p.rows[+s.dataset.j][1];s.classList.add('ok')})}
 else if(p.t==='book'){[['S',p.soll],['H',p.haben]].forEach(([sd,arr])=>{const box=el.querySelector('.rows[data-s="'+sd+'"]');box.innerHTML=arr.map(brow).join('');[...box.children].forEach((r,k)=>{r.querySelector('.acc').value=arr[k][0];r.querySelector('.amt').value=fmt(arr[k][1]);r.querySelectorAll('select,input').forEach(c=>c.classList.add('ok'))})})}
 record(t,i,0);stampPart(i,0)}
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-nav]');if(n){e.preventDefault();nav(n.dataset.nav);return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='copy'){const u=myUrl();const done=()=>toast('Link kopiert');try{navigator.clipboard.writeText(u).then(done,()=>fallbackCopy(u))}catch(x){fallbackCopy(u)}}
 else if(a==='bigqr'){const u=myUrl();$('#bigqr').innerHTML=qrSvg(u);$('#bigurl').textContent=u;$('#big').style.display='flex'}
 else if(a==='reset'){if(b.dataset.sure){P={};save();route()}else{b.dataset.sure=1;b.textContent='Wirklich alles löschen? Nochmal tippen'}}
 else if(a==='add'){const box=b.parentNode.querySelector('.rows');box.insertAdjacentHTML('beforeend',brow())}
 else if(a==='next'){nextTraining()}
 else{const part=b.closest('.part');if(!part)return;
  if(a==='check')check(part);else if(a==='solve')solve(part);
  else if(a==='hint'){const p=CUR.t.parts[+part.dataset.i];let tp=part.querySelector('.tip');if(!tp){tp=document.createElement('div');tp.className='tip';part.querySelector('.fb').after(tp)}tp.textContent='Tipp: '+(p.hint||'Rechne Schritt für Schritt.')}
  else if(a==='mc'){const t=CUR.t,i=+part.dataset.i,p=t.parts[i],j=+b.dataset.j;const key=t.id+':'+i;TRY[key]=(TRY[key]||0)+1;const fb=part.querySelector('.fb');if(j===p.ok){b.classList.add('ok');fb.className='fb g';fb.textContent=p.why;const f=TRY[key]===1?1:0.5;record(t,i,f);stampPart(i,f);part.querySelectorAll('.mcb').forEach(x=>x.disabled=true)}else{b.classList.add('bad');b.disabled=true;fb.className='fb r';fb.textContent='Nicht ganz. Versuch es noch einmal.'}}
 }
});
function fallbackCopy(u){const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Link kopiert')}catch(x){toast(u)}ta.remove()}
// ---- sort
function sortPage(o){
 const st={deck:o.cards.map((c,i)=>i),done:0,right:0,streak:0,first:{}};CUR.s=st;CUR.so=o;
 const cols=o.cats.length>6?'c13':o.cats.length===3?'c3':'';
 let h=head(o.title,'l'+o.lvl)+'<div class="card deck"><div class="sm">'+o.text+'</div><div class="sm" id="sprog"></div><div class="cardbig" id="scard"></div><div class="sfb" id="sfb"></div><div class="cats '+cols+'" id="scats">'+o.cats.map(c=>'<button data-c="'+c[0]+'">'+c[1]+'</button>').join('')+'</div></div>';
 app.innerHTML=h;updPts();showCard();
 document.getElementById('scats').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;answer(b.dataset.c)};
}
function showCard(){const st=CUR.s,o=CUR.so;if(!st.deck.length)return finishSort();const c=o.cards[st.deck[0]];$('#scard').textContent=c[0];$('#sprog').innerHTML='Karte '+(st.done+1)+' von '+o.cards.length+(st.streak>1?'  <span class="streak">🔥 '+st.streak+' in Folge</span>':'')}
function answer(cat){const st=CUR.s,o=CUR.so;if(!st.deck.length)return;const idx=st.deck[0],c=o.cards[idx];const fb=$('#sfb');
 if(cat===c[1]){if(!(idx in st.first)){st.first[idx]=1;st.right++}st.streak++;st.done++;st.deck.shift();fb.className='sfb';fb.style.color='var(--ok)';fb.textContent='✔ '+c[2];showCard()}
 else{if(!(idx in st.first))st.first[idx]=0;st.streak=0;st.deck.push(st.deck.shift());fb.style.color='var(--red)';fb.textContent='✘ Nicht ganz. Die Karte kommt gleich nochmal.';const el=$('#scard');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');showCard()}}
function finishSort(){const st=CUR.s,o=CUR.so;const s=P[o.id]=P[o.id]||{};if(s.best==null||st.right>s.best)s.best=st.right;save();updPts();
 $('#scard').innerHTML='🎉';$('#sprog').textContent='';$('#scats').innerHTML='<button data-r="1" style="grid-column:1/-1">Nochmal spielen</button>';$('#sfb').style.color='var(--ink)';$('#sfb').textContent=st.right+' von '+o.cards.length+' Karten gleich richtig.';$('#scats').onclick=()=>sortPage(o)}
// ---- training
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const pick=a=>a[rnd(0,a.length-1)];const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const GUT=[['eine Kühlvitrine','081'],['ein Palettenhubwagen','083'],['ein Lieferwagen','084'],['ein Server','086'],['eine Regalanlage','081'],['ein Kassenterminal','082'],['Büroschränke','087'],['eine Hochregalzeile','083'],['ein Notstromaggregat','080']];
function genAfa(){const g=pick(GUT),ak=rnd(40,600)*50,nd=pick([4,5,6,8,10]),m=rnd(1,12),mo=13-m,j=ak/nd,kj=j*mo/12;
 return{id:'tr',title:'Abschreibung',no:'',lvl:0,text:'Für '+g[0]+' (Konto '+g[1]+') betragen die AK '+fmt(ak)+' €, die Nutzungsdauer '+nd+' Jahre. Gekauft im '+MON[m-1]+' (der Kaufmonat zählt voll).',parts:[
 {t:'calc',label:'Berechne',rows:[['Abschreibungssatz',r2(100/nd),'%'],['Abschreibung pro Jahr',r2(j),'€'],['Monate im Kaufjahr',mo,''],['Abschreibung im Kaufjahr',r2(kj),'€'],['Buchwert am 31.12.',r2(ak-r2(kj)),'€']],hint:'Satz = 100 : ND. Jahr = AK : ND. Kaufjahr = Jahr × Monate : 12.'},
 {t:'book',label:'Buche die Abschreibung zum 31.12.',soll:[['650',r2(kj)]],haben:[[g[1],r2(kj)]],hint:'650 im Soll, Anlagekonto im Haben.'}]}}
function genAk(){const g=pick(GUT),lp=rnd(30,300)*100,rb=pick([5,10,15,20]),fr=rnd(1,8)*50,mo=rnd(1,6)*50,rab=r2(lp*rb/100),ak=r2(lp-rab+fr+mo),us=r2(ak*0.19),br=r2(ak+us);
 return{id:'tr',title:'Anschaffungskosten',no:'',lvl:0,text:'Für '+g[0]+' (Konto '+g[1]+') gilt: Listenpreis '+fmt(lp)+' € netto, '+rb+' % Rabatt, Fracht '+fmt(fr)+' € netto, Montage '+fmt(mo)+' € netto, dazu 19 % USt auf den gesamten Nettobetrag.',parts:[
 {t:'calc',label:'Berechne',rows:[['Rabatt in €',rab,'€'],['Anschaffungskosten',ak,'€'],['Umsatzsteuer 19 %',us,'€'],['Rechnungsbetrag',br,'€']],hint:'AK = Listenpreis − Rabatt + Fracht + Montage.'},
 {t:'book',label:'Buche die Eingangsrechnung',soll:[[g[1],ak],['260',us]],haben:[['44',br]],hint:'Anlagegut und Vorsteuer im Soll, 44 im Haben.'}]}}
function genKauf(){const v=rnd(0,3),g=v===3?pick([['ein Handscanner','089'],['ein Preisauszeichner','089'],['ein Taschenrechner','089'],['eine Schreibtischlampe','089']]):pick(GUT);
 const ne=v===3?rnd(40,390):rnd(5,200)*100+pick([0,0,500]),us=r2(ne*0.19),br=r2(ne+us);
 const base='Kauf von '+g[0]+' (Konto '+g[1]+'): '+fmt(ne)+' € netto + '+fmt(us)+' € USt = '+fmt(br)+' €. ';let parts;
 if(v===0)return{id:'tr',title:'Buchungssätze',no:'',lvl:0,text:base+'Zahlung nach 14 Tagen per Banküberweisung.',parts:[{t:'book',label:'a) Eingangsrechnung',soll:[[g[1],ne],['260',us]],haben:[['44',br]],hint:'Anlagekonto und 260 im Soll, 44 im Haben.'},{t:'book',label:'b) Zahlung',soll:[['44',br]],haben:[['280',br]],hint:'44 an 280.'}]};
 if(v===1)return{id:'tr',title:'Buchungssätze',no:'',lvl:0,text:base+'Sofortige Zahlung per Banküberweisung.',parts:[{t:'book',label:'Buchung',soll:[[g[1],ne],['260',us]],haben:[['280',br]],hint:'Bank 280 im Haben.'}]};
 if(v===2){const d=Math.round(br*0.4/100)*100,rest=r2(br-d);return{id:'tr',title:'Buchungssätze',no:'',lvl:0,text:base+'Sofort bezahlt: '+fmt(d)+' € über ein Darlehen der Bank, der Rest per Banküberweisung.',parts:[{t:'book',label:'Buchung',soll:[[g[1],ne],['260',us]],haben:[['425',d],['280',rest]],hint:'Darlehen = 425 im Haben. Rest = Rechnungsbetrag minus Darlehen.'}]}}
 return{id:'tr',title:'Buchungssätze',no:'',lvl:0,text:base+'Bezahlt wird bar aus der Kasse. Das Gut ist ein GWG.',parts:[{t:'book',label:'Buchung',soll:[['089',ne],['260',us]],haben:[['282',br]],hint:'GWG auf 089, Kasse 282 im Haben.'}]}}
function training(k){CUR.kind=k;newTraining()}
function newTraining(){CUR.counted=0;const k=CUR.kind;const t=k==='afa'?genAfa():k==='ak'?genAk():genKauf();t.id='tr-'+k+'-'+Date.now();Object.keys(TRY).forEach(x=>{if(x.indexOf('tr-')===0)delete TRY[x]});renderTask(t,'',true)}
function nextTraining(){newTraining()}
window.__app={route,P:()=>P,reset:()=>{P={};save()}};
route();
})();
</script></body></html>
