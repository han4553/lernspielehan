<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabinett Kaufstadt</title>
<style>
:root{--r:#e63946;--y:#ffbe0b;--t:#2a9d8f;--n:#1d3557;--p:#fff6e5;--ink:#1b1b2f}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink);background:var(--p) radial-gradient(circle,#f1dcb2 1.3px,transparent 1.5px) 0 0/22px 22px;font-size:16px;line-height:1.4}
header{height:56px;background:repeating-linear-gradient(90deg,var(--r) 0 30px,#fff 30px 60px);border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5}
header b{background:var(--y);border:3px solid var(--ink);padding:3px 14px;border-radius:12px;font-size:18px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;letter-spacing:.5px}
main{max-width:1000px;margin:0 auto;padding:12px 12px 60px}
h1,h2,h3{margin:.2em 0;line-height:1.15}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:12px 0}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.btn{display:inline-block;font:inherit;font-weight:800;background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin:4px 4px 4px 0;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.r{background:var(--r);color:#fff}.btn.t{background:var(--t);color:#fff}.btn.n{background:var(--n);color:#fff}.btn.w{background:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{font-size:20px;padding:14px 20px}
.tag{display:inline-block;background:var(--n);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}
.muted{color:#555;font-size:14px}
.ms{display:block;width:100%;text-align:left;font:inherit;background:#fffdf4;border:3px solid var(--ink);border-radius:14px 30px 30px 14px;padding:10px 40px 10px 14px;margin:9px 0;cursor:pointer;position:relative;box-shadow:3px 3px 0 var(--ink)}
.ms:after{content:"";position:absolute;right:12px;top:50%;width:14px;height:14px;margin-top:-7px;border:3px solid var(--ink);border-radius:50%;background:var(--p)}
.ms b{font-size:17px}.ms small{display:block;color:#444}
.ms.sel{background:#d9f5e8;border-color:var(--t);box-shadow:3px 3px 0 var(--t)}
.ms.chosen{background:#fff2c2}
.ms[disabled]{cursor:default}
.g{display:grid;grid-template-columns:34px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.g .nm{grid-column:2;font-size:13px;font-weight:700;margin-bottom:2px}
.bar{height:18px;border:2px solid var(--ink);border-radius:10px;background:#eee;overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .6s}
.z-r{background:var(--r)}.z-y{background:var(--y)}.z-g{background:var(--t)}
.dl{font-size:13px;font-weight:800}.up{color:#18794e}.dn{color:#c1121f}
.meme{background:linear-gradient(#3a3a4a,#18181f);color:#fff;text-align:center;border-radius:12px;padding:10px 8px;border:3px solid var(--ink);font-family:Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.5px}
.meme .e{font-size:54px;line-height:1.1}.meme div{font-size:17px}
.fact{background:#e8f4f8;border:3px dashed var(--n);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:15px}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .ic{font-size:56px;line-height:1}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:20px;padding:2px 10px;margin:2px;background:#fff;font-weight:700;font-size:14px}
.pill.k{background:#ffd6d9}.pill.h{background:#d9f5e8}.pill.nn{background:#eee}
.photo{width:100%;border:3px solid var(--ink);border-radius:12px;display:block}
.cred{font-size:11px;color:#555;margin:2px 0 8px}
input,select{font:inherit;padding:10px;border:3px solid var(--ink);border-radius:10px;background:#fff;margin:4px 4px 4px 0}
.role{display:flex;gap:12px;align-items:center}
.role .ic{font-size:46px}
.stars{font-size:13px;letter-spacing:1px}
.mood{font-size:44px;line-height:1}
table{border-collapse:collapse;width:100%}td,th{border-bottom:2px solid #eee;padding:6px;text-align:left;font-size:15px}
.qrbox{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;display:inline-block}
.qrbox svg{display:block;width:230px;height:230px}
.code{font-size:56px;font-weight:900;letter-spacing:10px;background:var(--y);border:3px solid var(--ink);border-radius:14px;padding:0 18px;display:inline-block;box-shadow:4px 4px 0 var(--ink)}
.rolechoice{cursor:pointer}
.rolechoice:hover{background:#fff7d6}
.vbar{display:flex;align-items:center;gap:8px;margin:6px 0}.vbar .b{flex:1;height:20px;background:#eee;border:2px solid var(--ink);border-radius:10px;overflow:hidden}.vbar .b i{display:block;height:100%;background:var(--n)}
.ok{color:#18794e;font-weight:800}.bad{color:#c1121f;font-weight:800}
.chain .st{display:flex;gap:10px;align-items:center;background:#fffdf4;border:2px solid var(--ink);border-radius:12px;padding:6px 10px}.chain .num{background:var(--n);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}.chain .ar{text-align:center;font-size:18px;line-height:1}
.hint{background:#fff2c2;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700}
</style></head>
<body>
<header><b id="logo" data-a="home">🏬 Kabinett Kaufstadt</b></header>
<main id="app"></main>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

  ${chainCard(m.k)}<div class="card">${conflicts(e)}<div style="margin-top:8px">${esc(m.x)}</div><div class="muted" style="margin-top:6px">Zielkonflikt = Was dem einen Ziel hilft, schadet dem anderen. Zielharmonie = Beide Ziele werden besser.</div></div>`+
  (ro!=null?`<div class="card role"><div class="mood">${MOODS[moodOf(ro,e)]}</div><div><b>${esc(ROLLEN[ro].n)}</b><div>${esc(ROLLEN[ro].m[moodOf(ro,e)>=3?1:0])}</div></div></div>`:'')}
function endBlock(g,h){const n=greenCount(g);return `<div class="card" style="text-align:center"><h2>🏁 Zeugnis des Kabinetts</h2>${radar(g)}<div style="font-size:20px;font-weight:800">${medal(n)}</div><div>${n} von 6 Zielen im grünen Bereich (≥ 65)</div></div><div class="card"><h3>Eure Beschlüsse</h3>${h.map((c,r)=>`<div>${EV[r].ic} <b>${esc(EV[r].t)}:</b> ${EV[r].ms[c].ic} ${esc(EV[r].ms[c].n)}</div>`).join('')}</div><div class="card"><h3>🗣️ Zum Weiterdenken</h3><div>• Welches Ziel hat euer Kabinett am stärksten vernachlässigt – und wer hat darunter gelitten?</div><div>• Gibt es überhaupt eine Politik, die alle sechs Ziele gleichzeitig erreicht? Warum heißt das Viereck „magisch“?</div><div>• Welche Maßnahme hätte euren Ausbildungsbetrieb besonders getroffen?</div></div>`+glossary()}

/* ---------- Zustand ---------- */
let M='home',solo=null,kc=null,T=null,ST=null,pollT=null,lastHash='',lern=null;
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
async function api(a,p){try{const r=await fetch(API+'/api/wp',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({a},p))});return await r.json()}catch(e){return {ok:false,err:'Keine Verbindung zum Server'}}}
function stopPoll(){if(pollT){clearInterval(pollT);pollT=null}lastHash=''}
function set(html){$('#app').innerHTML=html;window.scrollTo(0,0)}

/* ---------- Ansichten ---------- */
function vHome(){const p=new URLSearchParams(location.search);const code=(p.get('raum')||'').toUpperCase();
 return `<div class="card" style="background:var(--y)"><h1 style="font-size:34px">🏬 Kabinett Kaufstadt</h1><div style="font-size:18px">Wirtschaftspolitische Ziele und ihre Konflikte – aus Sicht des Einzelhandels. Ihr regiert die Stadt Kaufstadt: Acht Krisen, vier Maßnahmen pro Krise, sechs Ziele im Blick.</div></div>
 <div class="card" style="background:#e8f4f8"><h3>📖 Schritt 1: Lernpfad – die Ziele Schritt für Schritt</h3><div>Erst die sechs Ziele einzeln kennenlernen (mit Beispielen aus dem Laden), dann sehen, wie sie zusammenhängen – danach macht das Spiel richtig Sinn.</div><button class="btn big r" data-a="lern-start">Lernpfad starten</button></div><div class="grid g3"><div class="card"><h3>🎮 Einzelspiel</h3><div class="muted">Du bist Wirtschaftsminister:in. Wähle eine Rolle und steuere durch 8 Krisen.</div><button class="btn big r" data-a="solo-start">Direkt spielen</button></div>
 <div class="card"><h3>🔎 Konflikt-Check</h3><div class="muted">10 Blitzfragen: Zielkonflikt, Zielharmonie oder Zielneutralität?</div><button class="btn big t" data-a="kc-start">Training</button></div>
 <div class="card"><h3>👩‍🏫 Klassenmodus</h3><div class="muted">Lehrkraft eröffnet einen Raum, alle bekommen eine Rolle und stimmen ab.</div><button class="btn big n" data-a="t-create">Raum eröffnen</button></div></div>
 <div class="card"><h3>🙋 Einem Raum beitreten</h3><input id="jc" placeholder="Raumcode" maxlength="4" value="${esc(code)}" style="width:130px;text-transform:uppercase"><input id="jn" placeholder="Dein Name" maxlength="20"><button class="btn" data-a="join">Beitreten</button><div id="jerr" class="bad"></div></div>
 <div class="card"><h3>🔷 Das magische Sechseck</h3><div class="grid g3">${ZIELE.map(z=>`<div style="border:3px solid var(--ink);border-radius:12px;padding:8px;background:#fffdf4"><div style="font-size:30px">${z.ic}</div><b>${z.n}</b><div class="muted">${z.f}</div></div>`).join('')}</div></div>`}

function vSolo(){const s=solo;
 if(s.ph==='role')return `<div class="card"><h2>Welche Rolle übernimmst du?</h2><div class="muted">Jede Rolle hat eigene Interessen. Du entscheidest aber für ganz Kaufstadt!</div></div><div class="grid g2">${ROLLEN.map((R,i)=>`<div class="card rolechoice" data-a="role" data-i="${i}"><div class="role"><div class="ic">${R.ic}</div><div><h3>${esc(R.n)}</h3><div class="muted">${esc(R.b)}</div><div class="stars">${stars(R.w)}</div></div></div></div>`).join('')}</div><button class="btn" data-a="role" data-i="${Math.floor(Math.random()*ROLLEN.length)}">🎲 Zufällige Rolle</button>`;
 if(s.ph==='vote'){const E=EV[s.r];return eventCard(s.r)+`<div class="card"><h3>📊 Lage der Stadt</h3>${gauges(s.g)}<div class="muted">Grün ab 65 · Gelb · Rot unter 35</div></div>`+roleCard(s.role)+`<div class="card"><h3>Was beschließt das Kabinett?</h3>${E.ms.map((m,i)=>`<button class="ms" data-a="pick" data-i="${i}"><b>${m.ic} ${esc(m.n)}</b><small>${esc(m.t)}</small></button>`).join('')}</div>`}
 if(s.ph==='result'){const E=EV[s.r],q=E.q;const done=s.qa!==null;
  return resultBlock(s.r,s.ch,s.gp,s.g,s.role)+`<div class="card"><h3>❓ Kurzquiz (+10 Punkte)</h3><div>${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="ms ${done?(i===q.c?'sel':(i===s.qa?'chosen':'')):''}" data-a="quiz" data-i="${i}" ${done?'disabled':''}><b>${esc(o)}</b></button>`).join('')}${done?`<div class="${s.qa===q.c?'ok':'bad'}">${s.qa===q.c?'Richtig! +10':'Leider falsch.'} ${esc(q.x)}</div>`:''}</div><div class="card"><div class="fact">🗣️ <b>Diskussion:</b> ${esc(E.dq)}</div></div><button class="btn big r" data-a="next" ${done?'':'disabled'}>${s.r<EV.length-1?'Nächste Krise ▶':'Zum Zeugnis 🏁'}</button>`}
 if(s.ph==='end'){const n=greenCount(s.g);const pts=s.pts+n*10;return endBlock(s.g,s.h)+`<div class="card"><h3>Punkte</h3><div style="font-size:24px;font-weight:900">${pts} Punkte</div><div class="muted">Quiz ${s.pts} + ${n} grüne Ziele × 10</div></div><button class="btn big r" data-a="solo-start">Nochmal spielen</button><button class="btn big" data-a="home">Startseite</button>`}}

function vKC(){const k=kc;if(k.i>=KC.length)return `<div class="card" style="text-align:center"><h2>Training geschafft!</h2><div style="font-size:30px;font-weight:900">${k.score} von ${KC.length}</div><div>${k.score>=9?'🥇 Konflikt-Profi':k.score>=6?'🥈 Gut dabei':'🥉 Weiter üben'}</div></div>${glossary()}<button class="btn big r" data-a="kc-start">Nochmal</button><button class="btn big" data-a="home">Startseite</button>`;
 const c=KC[k.i],d=k.ans!==null;const lab=['Zielkonflikt 🔥','Zielharmonie 🤝','Zielneutralität 😐'];
 return `<div class="card"><span class="tag">Frage ${k.i+1} von ${KC.length}</span><h2>${c.a} ↔ ${c.b}</h2><div style="font-size:18px">${esc(c.s)}</div></div><div class="card"><div class="muted">Wie stehen die beiden Ziele zueinander?</div>${lab.map((l,i)=>`<button class="ms ${d?(i===c.ans?'sel':(i===k.ans?'chosen':'')):''}" data-a="kc-ans" data-i="${i}" ${d?'disabled':''}><b>${l}</b></button>`).join('')}${d?`<div class="${k.ans===c.ans?'ok':'bad'}">${k.ans===c.ans?'Richtig!':'Nicht ganz.'} ${esc(c.x)}</div><button class="btn big r" data-a="kc-next">${k.i<KC.length-1?'Weiter ▶':'Ergebnis'}</button>`:''}</div>`}

function vTeacher(){const t=T,m=t.meta;let h='';
 const link=location.origin+location.pathname+'?raum='+t.code;
 h+=`<div class="card"><span class="tag">Lehrkraft</span> <b>Raumcode:</b> <span class="code">${t.code}</span> <button class="btn w" data-a="copy">Link kopieren</button><button class="btn n" data-a="t-close">Raum schließen</button></div>`;
 if(m.ph==='lobby'){let qr='';try{const q=qrcode(0,'M');q.addData(link);q.make();qr=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){}
  h+=`<div class="grid g2"><div class="card" style="text-align:center"><h3>Scannen & beitreten</h3><div class="qrbox">${qr}</div><div class="muted" style="word-break:break-all">${esc(link)}</div></div><div class="card"><h3>👥 ${t.pl.length} Spieler:innen</h3>${plTable(t,false)}<button class="btn big r" data-a="t-start" ${t.pl.length?'':'disabled'}>Runde 1 starten ▶</button></div></div>`}
 else if(m.ph==='vote'){const n=t.pl.length,cnt=[0,0,0,0];Object.values(t.votes).forEach(v=>cnt[v]++);const tot=cnt.reduce((a,b)=>a+b,0);const E=EV[m.r];const top=Math.max(...cnt);const maj=cnt.indexOf(top);
  h+=eventCard(m.r)+`<div class="card"><h3>📊 Lage der Stadt</h3>${gauges(m.g)}</div><div class="card"><h3>🗳️ Abstimmung: ${tot} von ${n}</h3>${E.ms.map((x,i)=>`<div class="vbar"><div style="width:62%"><b>${x.ic} ${esc(x.n)}</b></div><div class="b"><i style="width:${tot?cnt[i]/tot*100:0}%"></i></div><b>${cnt[i]}</b></div>`).join('')}<div style="margin-top:8px">Beschluss: <select id="ovr">${E.ms.map((x,i)=>`<option value="${i}" ${i===maj?'selected':''}>${x.ic} ${esc(x.n)}${i===maj&&tot?' (Mehrheit)':''}</option>`).join('')}</select> <button class="btn r" data-a="t-eval">Auswerten ▶</button></div></div><div class="card"><h3>Spieler:innen</h3>${plTable(t,true)}</div>`}
 else if(m.ph==='result'){const mo=t.pl.map(p=>`<span class="pill">${MOODS[moodOf(p.r,EV[m.r].ms[m.ch].e)]} ${esc(p.n)} <small>(${ROLLEN[p.r].ic})</small></span>`).join('');
  h+=eventCard(m.r)+resultBlock(m.r,m.ch,m.gp,m.g,null)+`<div class="card"><h3>🎭 Stimmungsbild der Rollen</h3>${mo||'–'}<div class="muted" style="margin-top:6px">Stimmen: ${EV[m.r].ms.map((x,i)=>x.ic+' '+(m.ct[i]||0)).join(' · ')}</div></div><div class="card"><div class="fact">🗣️ <b>Diskussion:</b> ${esc(EV[m.r].dq)}</div></div><button class="btn big r" data-a="t-next">${m.r<EV.length-1?'Nächste Runde ▶':'Zum Zeugnis 🏁'}</button>`}
 else h+=endBlock(m.g,m.h)+`<button class="btn big" data-a="t-close">Raum schließen & zur Startseite</button>`;
 return h}
function plTable(t,votes){if(!t.pl.length)return '<div class="muted">Noch niemand da – QR-Code scannen lassen …</div>';return `<table><tr><th>Name</th><th>Rolle</th>${votes?'<th>Stimme</th>':''}<th></th></tr>${t.pl.map(p=>`<tr><td>${esc(p.n)}</td><td>${ROLLEN[p.r].ic} ${esc(ROLLEN[p.r].n.split(',')[0])}</td>${votes?`<td>${t.votes[p.n]!==undefined?'✅':'…'}</td>`:''}<td><button class="btn w" style="padding:2px 8px;margin:0" data-a="t-kick" data-n="${esc(p.n)}">✕</button></td></tr>`).join('')}</table>`}

function vStudent(){const s=ST,m=s.meta;const hd=`<div class="card"><span class="tag">Raum ${s.code}</span> <b>${esc(s.name)}</b></div>`;
 if(m.ph==='lobby')return hd+roleCard(s.role)+`<div class="card hint">⏳ Warte, bis die Lehrkraft das Spiel startet … (${s.n} im Raum)</div>`;
 if(m.ph==='vote'){const E=EV[m.r];return hd+eventCard(m.r)+`<div class="card"><h3>📊 Lage der Stadt</h3>${gauges(m.g)}</div>`+roleCard(s.role)+`<div class="card"><h3>Wofür stimmst du?</h3><div class="muted">Du darfst deine Stimme ändern, solange die Runde offen ist.</div>${E.ms.map((x,i)=>`<button class="ms ${s.my===i?'sel':''}" data-a="s-vote" data-i="${i}"><b>${x.ic} ${esc(x.n)}</b><small>${esc(x.t)}</small></button>`).join('')}${s.my!==null?'<div class="ok">✅ Deine Stimme ist abgegeben.</div>':''}</div>`}
 if(m.ph==='result')return hd+resultBlock(m.r,m.ch,m.gp,m.g,s.role)+`<div class="card"><div class="muted">Stimmen: ${EV[m.r].ms.map((x,i)=>x.ic+' '+(m.ct[i]||0)).join(' · ')}</div><div class="fact">🗣️ <b>Diskussion:</b> ${esc(EV[m.r].dq)}</div></div><div class="card hint">Warte auf die nächste Runde …</div>`;
 return hd+endBlock(m.g,m.h)}

function render(){if(M==='home')set(vHome());else if(M==='lern')set(vLern());else if(M==='solo')set(vSolo());else if(M==='kc')set(vKC());else if(M==='teacher')set(vTeacher());else if(M==='student')set(vStudent())}

/* ---------- Klassenmodus: Lehrkraft ---------- */
async function tCreate(){const r=await api('create',{});if(!r.ok){alert(r.err);return}T={code:r.c,hk:r.hk,meta:r.meta,pl:[],votes:{}};store.set('wp-t',JSON.stringify({c:r.c,hk:r.hk}));M='teacher';stopPoll();render();pollT=setInterval(tPoll,3000)}
async function tPoll(){if(!T)return;const r=await api('state',{c:T.code,hk:T.hk});if(!r.ok){if(r.err==='Raum nicht gefunden'){alert('Raum abgelaufen.');tLeave()}return}
 const h=JSON.stringify([r.meta,r.pl,r.votes]);if(h===lastHash)return;
 const ae=document.activeElement;if(ae&&ae.tagName==='SELECT'&&ae.id==='ovr'&&r.meta.ph==='vote'&&T.meta.ph==='vote'&&T.meta.r===r.meta.r){T.pl=r.pl;T.votes=r.votes;T.meta=r.meta;lastHash=h;return}
 lastHash=h;T.meta=r.meta;T.pl=r.pl;T.votes=r.votes;render()}
function tLeave(){stopPoll();T=null;store.del('wp-t');M='home';render()}
async function tSetMeta(m){const r=await api('set',{c:T.code,hk:T.hk,meta:m});if(!r.ok){alert(r.err);return false}T.meta=m;lastHash='';return true}
async function tStartRound(r){const prev=T.meta;const base=prev.ph==='lobby'?[50,50,50,50,50,50]:prev.g;const g=addv(base,EV[r].sc);const ok=await tSetMeta({ph:'vote',r,g,h:prev.h||[]});if(ok){T.votes={};render()}}
async function tEval(){const ch=Number($('#ovr').value);const r0=await api('state',{c:T.code,hk:T.hk});const votes=r0.ok?r0.votes:T.votes;const ct=[0,0,0,0];Object.values(votes).forEach(v=>ct[v]++);const m=T.meta;const g=addv(m.g,EV[m.r].ms[ch].e);const ok=await tSetMeta({ph:'result',r:m.r,gp:m.g,g,ch,ct,h:(m.h||[]).concat([ch])});if(ok){T.votes=votes;render()}}
async function tNext(){const m=T.meta;if(m.r<EV.length-1)await tStartRound(m.r+1);else{if(await tSetMeta({ph:'end',r:m.r,g:m.g,h:m.h}))render()}}

/* ---------- Klassenmodus: Schüler ---------- */
async function sJoin(code,name){const r=await api('join',{c:code,n:name});if(!r.ok)return r;ST={code,name,role:r.role,meta:{ph:'lobby'},my:null,n:0};store.set('wp-s',JSON.stringify({c:code,n:name}));M='student';stopPoll();await sPoll(true);pollT=setInterval(sPoll,3000);return r}
async function sPoll(force){if(!ST)return;const r=await api('state',{c:ST.code,n:ST.name});if(!r.ok){if(r.err==='Raum nicht gefunden'){alert('Der Raum ist nicht mehr da.');sLeave()}return}
 if(r.me===null){alert('Du wurdest aus dem Raum entfernt.');sLeave();return}
 const h=JSON.stringify([r.meta,r.n,r.my]);if(h===lastHash&&!force)return;lastHash=h;ST.meta=r.meta;ST.n=r.n;ST.my=r.my;ST.role=r.me;render()}
function sLeave(){stopPoll();ST=null;store.del('wp-s');M='home';render()}

/* ---------- Aktionen ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=Number(b.dataset.i);
 switch(a){
  case 'home':if(M==='teacher'||M==='student'){if(!confirm('Raum wirklich verlassen?'))return;if(M==='teacher')tLeave();else sLeave();return}stopPoll();M='home';render();break;
  case 'lern-start':lern={st:0,qa:{},rx:null,ry:null};M='lern';render();break;
  case 'lern-next':lern.st++;render();break;
  case 'lern-prev':lern.st--;render();break;
  case 'lern-q':if(lern.qa[lern.st]!==undefined)return;lern.qa[lern.st]=i;{const y=window.scrollY;render();window.scrollTo(0,y)}break;
  case 'rel':lern.rx=Number(b.dataset.x);lern.ry=Number(b.dataset.y);{const y=window.scrollY;render();window.scrollTo(0,y)}break;
  case 'lern-play':solo={ph:'role'};M='solo';render();break;
  case 'solo-start':solo={ph:'role'};M='solo';render();break;
  case 'role':solo={role:i,r:0,g:[50,50,50,50,50,50],ph:'vote',pts:0,h:[],qa:null};solo.g=addv(solo.g,EV[0].sc);solo.gp=solo.g.slice();render();break;
  case 'pick':{solo.ch=i;solo.gp=solo.g.slice();solo.g=addv(solo.g,EV[solo.r].ms[i].e);solo.h.push(i);solo.qa=null;solo.ph='result';render();break}
  case 'quiz':if(solo.qa!==null)return;solo.qa=i;if(i===EV[solo.r].q.c)solo.pts+=10;{const y=window.scrollY;render();window.scrollTo(0,y)}break;
  case 'next':if(solo.r<EV.length-1){solo.r++;solo.g=addv(solo.g,EV[solo.r].sc);solo.gp=solo.g.slice();solo.ph='vote'}else solo.ph='end';render();break;
  case 'kc-start':kc={i:0,score:0,ans:null};M='kc';render();break;
  case 'kc-ans':if(kc.ans!==null)return;kc.ans=i;if(i===KC[kc.i].ans)kc.score++;{const y=window.scrollY;render();window.scrollTo(0,y)}break;
  case 'kc-next':kc.i++;kc.ans=null;render();break;
  case 't-create':tCreate();break;
  case 't-start':tStartRound(0);break;
  case 't-eval':tEval();break;
  case 't-next':tNext();break;
  case 't-kick':await api('kick',{c:T.code,hk:T.hk,n:b.dataset.n});lastHash='';tPoll();break;
  case 't-close':if(!confirm('Raum schließen? Alle Daten werden gelöscht.'))return;await api('close',{c:T.code,hk:T.hk});tLeave();break;
  case 'copy':{const l=location.origin+location.pathname+'?raum='+T.code;try{await navigator.clipboard.writeText(l);b.textContent='✓ kopiert'}catch(x){prompt('Link kopieren:',l)}break}
  case 'join':{const c=($('#jc').value||'').trim().toUpperCase(),n=($('#jn').value||'').trim();if(!c||!n){$('#jerr').textContent='Bitte Code und Namen eingeben.';return}const r=await sJoin(c,n);if(!r.ok)$('#jerr').textContent=r.err;break}
  case 's-vote':{ST.my=i;{const y=window.scrollY;render();window.scrollTo(0,y)}const r=await api('vote',{c:ST.code,n:ST.name,r:ST.meta.r,v:i});if(!r.ok){alert(r.err);lastHash='';sPoll(true)}break}
 }});

/* ---------- Start ---------- */
(async function init(){const p=new URLSearchParams(location.search);
 const st=store.get('wp-t'),ss=store.get('wp-s');
 if(p.has('lehrer')||st){if(st){try{const o=JSON.parse(st);const r=await api('state',{c:o.c,hk:o.hk});if(r.ok&&r.host){T={code:o.c,hk:o.hk,meta:r.meta,pl:r.pl,votes:r.votes};M='teacher';render();pollT=setInterval(tPoll,3000);return}}catch(e){}store.del('wp-t')}}
 if(ss){try{const o=JSON.parse(ss);if(!p.get('raum')||p.get('raum').toUpperCase()===o.c){const r=await sJoin(o.c,o.n);if(r.ok)return}}catch(e){}store.del('wp-s')}
 render()})();
</script></body></html>
