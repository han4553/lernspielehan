<script>var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        count += 1;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

function makeSrc(id,w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,w,h);
  const im=IMG[id];
  if(im){const s=Math.min(w*0.84/im.naturalWidth,h*0.78/im.naturalHeight);const iw=im.naturalWidth*s,ih=im.naturalHeight*s;x.imageSmoothingQuality='high';x.drawImage(im,(w-iw)/2,(h-ih)/2,iw,ih)}
  else{x.fillStyle='#bbb';x.font='900 '+Math.round(h*0.5)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('❓',w/2,h/2)}
  return c;
}
function drawMosaic(ctx,src,g){
  const w=src.width,h=src.height;
  if(g>=999){ctx.drawImage(src,0,0);return}
  const cols=g,rows=Math.max(2,Math.round(g*h/w));
  let data=src._d;if(data===undefined){try{data=src.getContext('2d').getImageData(0,0,w,h).data}catch(e){data=null}src._d=data}
  if(!data){const t=document.createElement('canvas');t.width=cols;t.height=rows;const tc=t.getContext('2d');tc.imageSmoothingEnabled=true;tc.drawImage(src,0,0,cols,rows);ctx.imageSmoothingEnabled=false;ctx.drawImage(t,0,0,cols,rows,0,0,w,h);return}
  const cw=w/cols,ch=h/rows;
  for(let j=0;j<rows;j++){const y0=Math.floor(j*ch),y1=Math.max(y0+1,Math.floor((j+1)*ch));
    for(let i=0;i<cols;i++){const x0=Math.floor(i*cw),x1=Math.max(x0+1,Math.floor((i+1)*cw));
      let r=0,gg=0,b=0,n=0;
      for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const p=(y*w+x)*4;r+=data[p];gg+=data[p+1];b+=data[p+2];n++}
      ctx.fillStyle='rgb('+(r/n|0)+','+(gg/n|0)+','+(b/n|0)+')';ctx.fillRect(x0,y0,x1-x0,y1-y0)}}
}

function botPlan(){ // jeder Bot "antwortet" zu einem festen Zeitpunkt der Runde und bewegt sich dann live
  const step=G.cfg.step;G.rt0=Date.now();G.botRes=[];
  G.bots.forEach(b=>{
    const st=Math.round((1-b.sk)*5.5+(Math.random()-.4)*3);let pts=0,ms=0,neg=false;
    if(st<=6){const s2=Math.max(0,st);pts=ptsFor(s2);if(Math.random()<(1-b.sk)*.35)pts-=PEN;ms=Math.round(s2*step+400+Math.random()*(step-800))}
    if(st>6&&Math.random()<.35)neg=true;
    const fok=st<=6,fm=st<=6?ms:(neg?Math.round((1+Math.random()*5)*step):1e9);
    b.pl={st,pts,ms,neg,fok,fm,at:st<=6?ms:(neg?fm:1e9),done:false};
  });
}
function botTick(fin){
  if(!G.bots||!G.bots.length||!G.rt0)return;
  const el=Date.now()-G.rt0;let moved=0;
  G.bots.forEach(b=>{const q=b.pl;if(!q||q.done||(!fin&&q.at>el))return;
    q.done=true;let pts=q.pts;if(q.neg)pts=-Math.min(PEN,b.s);
    const fp=q.fok?ptsFor(Math.max(0,q.st)):-Math.min(PEN,b.s);
    b.ok=q.st<=6&&pts>0;b.s=Math.max(0,b.s+pts);moved++;

  if(moved&&!fin&&M==='solo'&&G.vph==='play')liveSolo();
}

  w.forEach(p=>{if(p.n===me)p.s=Math.max(p.s,myScore())});
  const rows=w.filter(p=>Math.abs(p.rk-rank)<=span);if(!rows.length)return null;

function gridAt(t){const s=stepMs(),T=(NS-1)*s,gm=GM();
  if(gm==='mut'){if(t>=T)return 5;return Math.max(5,Math.round(5*Math.pow(13,(T-t)/T))) >=64?999:Math.max(5,Math.round(5*Math.pow(13,(T-t)/T)))}
  if(gm==='blick'){if(t<1200)return 999;return Math.min(16,5+Math.floor((t-1200)/Math.max(1,T-1200)*11))}
  if(gm==='zoom'){if(t>=T)return 999;return 1000+Math.round(24+76*t/T)}
  if(t>=T)return 999;return Math.max(4,Math.round(5*Math.pow(13,t/T)))}
function drawZoom(ctx,src,fr){
  const w=src.width,h=src.height,id=G.q?G.q.id:'x';let hs=0;for(let i=0;i<id.length;i++)hs=(hs*31+id.charCodeAt(i))>>>0;
  const cx=.4+((hs%97)/97)*.2,cy=.4+(((hs>>3)%89)/89)*.2,f=Math.max(.12,fr/100),sw=w*f,sh=h*f;
  const sx=Math.min(w-sw,Math.max(0,cx*w-sw/2)),sy=Math.min(h-sh,Math.max(0,cy*h-sh/2));
  const t=document.createElement('canvas');t.width=38;t.height=23;const tc=t.getContext('2d');tc.fillStyle='#fff';tc.fillRect(0,0,38,23);tc.imageSmoothingEnabled=true;tc.drawImage(src,sx,sy,sw,sh,0,0,38,23);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(t,0,0,38,23,0,0,w,h)}
function drawGrid(g){const cv=$('#cv');if(!cv||!G.src||G.gridNow===g)return;G.gridNow=g;if(g>=1000)drawZoom(cv.getContext('2d'),G.src,g-1000);else drawMosaic(cv.getContext('2d'),G.src,g)}

function doAnswer(id,c){

  if(id===G.q.id){
    const base=ptsFor(stage),bonus=Math.min(50,G.streak*10);
    G.rpts=base+bonus-G.pen;G.rms=c.t;G.score+=base+bonus;G.streak++;G.correct++;G.answered=true;
    G.log.push({id:G.q.id,pts:G.rpts,ok:true});

    if(M==='solo')setTimeout(()=>{if(G.vph==='play'){G.sph='brk';G.t0=Date.now();enterBreak()}},900);
  }else{

  }
}

let pollT=null;
function startPoll(){clearInterval(pollT);pollT=setInterval(poll,M==='host'?3000:4500);poll()}
async function poll(){
  if(M==='room'){
    if(!R.code)return;
    const full=V==='lobby';
    const x=await api('state',{c:R.code,pid:R.pid,full:full?1:0});
    if(!x)return;
    if(x.gone){stopPoll();alert('Der Raum wurde geschlossen.');ls.del('pm_p');homeView();return}
    if(!x.ok)return;
    if(x.kicked){stopPoll();ls.del('pm_p');alert('Du wurdest aus dem Raum entfernt.');homeView();return}
        applyState(x);
    if(V==='lobby'){const w=$('#lw');if(w)w.textContent='⏳ Warte auf den Start … ('+(x.total||1)+' im Raum)';
      if(R.ph==='play'){V='pre';app('<div class="wrap"><div class="h1" style="font-size:26px">Gleich geht’s los!</div><div class="cd" id="cd">–</div></div>')}}
    if(R.ph==='lobby'&&(V==='end'||V==='play'||V==='pre')){V='lobby';G.r=-1;lobbyView()}
  }else if(M==='host'){
    const x=await api('hstate',{c:R.code,hk:R.hk});
    if(!x)return;if(x.gone){stopPoll();ls.del('pm_host');alert('Raum nicht mehr vorhanden.');homeView();return}
    if(!x.ok)return;
    R.players=x.players;R.ph=x.ph;R.st=x.st;R.gate=x.gate||1;R.cfg=x.cfg;R.seed=x.seed;R.total=x.players.length;
    if(V==='host-lobby')hostLobbyUpd();
    if(V==='play'){hostTop();const n=R.players.filter(p=>p.a>=G.r).length;if($('#hAn'))$('#hAn').textContent=n;if($('#hTot'))$('#hTot').textContent=R.players.length}
  }
}
function stopPoll(){clearInterval(pollT);pollT=null}
function leaveRoom(){stopPoll();M='home';R.code='';R.pid='';ls.del('pm_p')}
async function report(){if(M!=='room')return;const x=await api('rep',{c:R.code,pid:R.pid,s:G.score,rd:G.r,cc:G.correct,pts:G.answered?G.rpts:-G.pen,ms:G.answered?Math.round(G.rms||0):0,ok:G.answered?1:0});if(G.vph==='play')liveRank();if(x&&x.kicked){stopPoll();ls.del('pm_p');alert('Du wurdest aus dem Raum entfernt.');homeView()}}

async function resumeHost(){
  const st=ls.get('pm_host');if(!st)return hostSetup();
  const x=await api('hstate',{c:st.c,hk:st.hk});
  if(!x||!x.ok){ls.del('pm_host');alert((x&&x.err)||'Raum nicht gefunden.');return hostSetup()}
  M='host';Object.assign(R,{code:st.c,hk:st.hk,cfg:x.cfg,seed:x.seed,rname:x.name,ph:x.ph,st:x.st,players:x.players});
  await syncTime();startPoll();
  if(x.ph==='play'){V='pre';G.qs=[];app('<div class="wrap"><div class="cd" id="cd">–</div></div>')}
  else if(x.ph==='end'){V='end';hostEndView()}else hostLobby();
}

async function hostSkip(){
  const c=clock();if(c.ph!=='play'&&c.ph!=='brk')return;
  if(c.ph==='brk'&&R.cfg.mode==='manual'){const y=await api('next',{c:R.code,hk:R.hk});if(y&&y.ok){R.st=y.st;R.gate=y.gate}return}
  const d=c.ph==='play'?playMs()-c.t:roundMs()-c.t;
  const x=await api('skip',{c:R.code,hk:R.hk,d:Math.ceil(d)+50});if(x&&x.ok){R.st=x.st}
}

function cerHTML(){return '<h3>🏆 Siegerehrung</h3><div class="cer" id="cer"></div>'}
let cerT=null;
function ceremony(all,meName){
  clearInterval(cerT);const box=$('#cer');if(!box||!all.length)return;
  const N=all.length;let i=N-1;
  const wait=[];for(let n=box.nextElementSibling;n;n=n.nextElementSibling){n.classList.add('cerwait');wait.push(n)}
  const unwait=()=>wait.forEach(n=>n.classList.remove('cerwait'));
  const sw=Math.max(8,Math.floor(Math.min(box.clientWidth||340,520)/N)-2),asz=Math.max(12,Math.min(40,sw)),dh=Math.max(4,Math.min(16,Math.floor(120/N)));
  box.innerHTML='<div class="cerc" id="cerc"></div><div class="stairs" id="stairs">'+all.map((p,k)=>'<div class="stp" data-k="'+k+'" style="width:'+sw+'px;height:'+(18+(N-k)*dh)+'px"><b>'+(k+1)+'</b></div>').reverse().join('')+'</div><div id="pod"></div><ol class="lb" id="cerl"></ol><button type="button" class="btn sm gh" id="cerskip">⏭ Gleich alle zeigen</button>';
  const showOne=(k,quiet)=>{
    const p=all[k],card=$('#cerc');if(!card)return;
    card.innerHTML='<div class="cerp">Platz '+(k+1)+'</div><div class="cerav">'+AV(p.e,96)+'</div><div class="cern">'+esc(p.n)+'</div><div class="cers">'+p.s+' Punkte</div>';
    card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');
    const col=document.querySelector('#stairs .stp[data-k="'+k+'"]');
    if(col){document.querySelectorAll('#stairs .stav.cur').forEach(e=>e.classList.remove('cur'));
      col.insertAdjacentHTML('afterbegin','<div class="stav'+(quiet?'':' hop cur')+(p.n===meName?' me':'')+'" title="'+esc(p.n)+'">'+AV(p.e,asz)+'</div>');
      col.classList.add('on')}
    $('#cerl').insertAdjacentHTML('afterbegin','<li'+(p.n===meName?' class="me"':'')+'><span class="rk">'+(k+1)+'.</span>'+AV(p.e,22)+' '+esc(p.n)+'<span class="sc">'+p.s+'</span></li>');
    if(!quiet)beep(k<3?880-k*110:260+(N-k)*18,.14,k<3?'triangle':'square');
  };
  const fin=()=>{
    clearInterval(cerT);const card=$('#cerc');if(!card)return;
    card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');
    card.innerHTML='<div class="cerp">🎉 Die Besten! 🎉</div>';
    const t3=all.slice(0,3),order=t3.length>=3?[1,0,2]:(t3.length===2?[1,0]:[0]),hs=[130,95,70],med=['🥇','🥈','🥉'];
    $('#pod').innerHTML='<div class="pod">'+order.map(k=>{const p=t3[k];return '<div class="pcol"><div>'+AV(p.e,64)+'</div><b>'+esc(p.n)+'</b><small>'+p.s+' P.</small><div class="pbar" style="height:'+hs[k]+'px">'+med[k]+'</div></div>'}).join('')+'</div><div class="conf">🎉 🎊 🏆 🎊 🎉</div>';
    beep(988,.25,'triangle');setTimeout(()=>beep(1175,.35,'triangle'),220);setTimeout(unwait,1200);
  };
  showOne(i);
  const iv=Math.max(450,Math.min(1900,26000/N));
  cerT=setInterval(()=>{if(!$('#cer')){clearInterval(cerT);return}i--;if(i<0){fin();return}showOne(i);if(i===0){clearInterval(cerT);setTimeout(()=>{if($('#cer'))fin()},2200)}},iv);
  $('#cerskip').onclick=()=>{clearInterval(cerT);for(let k=i-1;k>=0;k--)showOne(k,true);fin();$('#cerskip').remove();unwait()};
}

  ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    if(!this.out){const c=AC.createDynamicsCompressor(),g=AC.createGain();g.gain.value=.22;g.connect(c);c.connect(AC.destination);this.out=g}return AC},
  nt(sc,d){const S=SCALES[sc],n=S.length,o=Math.floor(d/n);return S[((d%n)+n)%n]+12*o},
  rnd(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296}},
  tone(f,t,d,type,v){const A=AC,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+d+.05)},
  noise(t,d,v,hp){const A=AC,b=A.createBuffer(1,Math.floor(A.sampleRate*d),A.sampleRate),a=b.getChannelData(0);for(let k=0;k<a.length;k++)a[k]=Math.random()*2-1;
    const s=A.createBufferSource(),g=A.createGain(),f=A.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.buffer=b;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(this.out);s.start(t)},
  kick(t){const A=AC,o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.13);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+.2)},
  playStep(T,k,t){ // k = Achtel-Schritt seit Start; 8 je Takt
    const bar=Math.floor(k/8),st=k%8,ch=T.pr[bar%4],ph=Math.floor(bar/4)%4,spb=60/T.bpm/2,m=T.root;
    const hz=n=>440*Math.pow(2,(n-69)/12),N=d=>m+this.nt(T.sc,d);
    if(st%2===0)this.tone(hz(N(ch)-24+(st===4?7:0)),t,spb*1.7,'triangle',.5);
    if(st===0||st===3||st===6){[0,2,4].forEach((q,j)=>this.tone(hz(N(ch+q)-12),t+j*.012,spb*.9,'square',.07))}
    const r=this.rnd(T.id.charCodeAt(1)*977+T.id.charCodeAt(0)*31+ph*13+bar%4*7+st*101);
    if(r()<(T.dr?.62:.4)){const d=ch+[0,1,2,3,4,5,2,-1][Math.floor(r()*8)]+(ph%2?2:0);this.tone(hz(N(d)+(T.dr?12:12)),t,spb*(1+r()*1.4),T.ld,.16)}
    if(T.dr){if(st%4===0)this.kick(t);if(st===2||st===6)this.noise(t,.12,.28,1800);this.noise(t,.03,.08,7000)}
    else if(st%4===0)this.tone(hz(N(ch+4)+12),t,spb*3,'sine',.07)},
  tickLoop(){if(!this.on||!this.cur||this.mute)return;const T=this.cur,spb=60/T.bpm/2;
    while(this.next<AC.currentTime+.3){this.playStep(T,this.step,this.next);this.next+=spb;this.step++;
      if(this.step>=8*32){this.i=(this.i+1)%this.list().length;this.start(true);return}}},
  start(auto){clearInterval(this.t);const L=this.list();this.cur=L[this.i%L.length];this.step=0;
    if(!this.on||this.mute||!this.cur)return;this.ac();this.next=AC.currentTime+.1;this.t=setInterval(()=>this.tickLoop(),80);if(!auto)this.ui()},
  stop(){clearInterval(this.t);this.t=null},
  setState(s,silent){const ch=s.on!==this.on||s.season!==this.s||s.i!==this.i;this.on=!!s.on;this.s=s.season||'auto';this.i=s.i|0;
    if(!this.on){this.stop();this.cur=null}else if(ch||!this.t)this.start(); this.ui()},
  setMute(m){this.mute=m;ls.set('pm_mmute',m);if(m)this.stop();else if(this.on)this.start();this.ui()},
  ui(){const b=$('#mfab');if(b)b.textContent=this.on&&!this.mute?'🎵':'🔇';const p=$('#mpan');if(p&&p.style.display!=='none')musPanel()}
};
function musPublish(on,s,i){const st={on,season:s,i};Mus.setState(st);
  if(M==='host')api('mus',{c:R.code,hk:R.hk,on,season:s,i})}
function musPanel(){
  let p=$('#mpan');if(!p){p=document.createElement('div');p.id='mpan';document.body.appendChild(p)}
  const ctl=M==='host'||M==='solo'||M==='home',L=Mus.list(),cur=Mus.cur&&Mus.on?Mus.cur.id:'';
  let h='<b>🎵 Musik</b> <button type="button" class="mx" id="mclose">✕</button>';
  if(ctl){
    h+='<div class="mrow"><button type="button" class="btn sm '+(Mus.on?'gr':'gh')+'" id="mon">'+(Mus.on?'⏸ Musik an':'▶ Musik aus')+'</button><button type="button" class="btn sm cy" id="mnx">⏭</button></div>';
    h+='<div class="mrow">'+['auto','fruehling','sommer','herbst','winter'].map(s=>'<button type="button" class="chipb'+(Mus.s===s?' on':'')+'" data-ms="'+s+'">'+(s==='auto'?'Auto ('+SEAS[seasonNow()].split(' ')[0]+')':SEAS[s])+'</button>').join('')+'</div>';
    h+='<div class="mtl">'+L.map((t,k)=>'<button type="button" class="mt'+(t.id===cur?' on':'')+'" data-mi="'+k+'">'+(t.id===cur?'▶ ':'')+esc(t.n)+'</button>').join('')+'</div>';
  }else{
    h+='<div class="tag">'+(Mus.on&&Mus.cur?'Läuft: '+esc(Mus.cur.n)+' ('+(SEAS[Mus.cur.s]||'')+')':'Die Lehrkraft hat die Musik aus.')+'</div>';
  }
  h+='<div class="mrow"><label class="mlab"><input type="checkbox" id="mmu"'+(Mus.mute?' checked':'')+'> Auf diesem Gerät stumm</label></div>';
  p.innerHTML=h;
  const on=(sel,f)=>{const e=p.querySelector(sel);if(e)e.onclick=f};
  on('#mclose',()=>{p.style.display='none'});
  const push=(o,s,i)=>{if(M==='host')musPublish(o,s,i);else Mus.setState({on:o,season:s,i});Mus.ui()};
  on('#mon',()=>push(!Mus.on,Mus.s,Mus.i));
  on('#mnx',()=>push(true,Mus.s,(Mus.i+1)%Mus.list().length));
  p.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>push(true,b.dataset.ms,0));
  p.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>push(true,Mus.s,+b.dataset.mi));
  const mu=$('#mmu');if(mu)mu.onchange=()=>Mus.setMute(mu.checked);
}
(function(){const f=document.createElement('button');f.id='mfab';f.type='button';f.textContent='🔇';f.title='Musik';
  f.onclick=()=>{const p=$('#mpan');if(p&&p.style.display!=='none'){p.style.display='none';return}musPanel();$('#mpan').style.display='block'};
  document.body.appendChild(f);document.addEventListener('pointerdown',()=>{if(Mus.on&&!Mus.mute&&AC&&AC.state==='suspended')AC.resume()},true)})();

/* ===================== Start ===================== */
homeView();preload();
</script>
