<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#190f33">
<title>Pixel-Marken – Handy-Logos erraten</title>
<style>
:root{--bg:#190f33;--bg2:#2a1a57;--card:#33216b;--ink:#fff;--mut:#b9a9f0;--cy:#19e3ff;--mg:#ff3df2;--ye:#ffe14a;--gr:#3dff8b;--rd:#ff5370}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);
 background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:24px 24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 44px}
.wrap.wide{max-width:1180px}
h1,h2,h3{margin:0}
.h1{font:900 34px/1.05 "Courier New",monospace;letter-spacing:1px;text-transform:uppercase;text-shadow:3px 3px 0 var(--mg),6px 6px 0 var(--cy);margin:6px 0 4px}
.sub{color:var(--mut);margin:6px 0 14px}
.btn{display:block;width:100%;font:800 18px/1.15 "Trebuchet MS",system-ui,sans-serif;color:#1b1035;background:var(--ye);border:3px solid #fff;border-radius:14px;box-shadow:0 5px 0 #000b;padding:14px 16px;margin:10px 0;cursor:pointer;text-align:center;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000b}
.btn.cy{background:var(--cy)}.btn.mg{background:var(--mg);color:#fff}.btn.gr{background:var(--gr)}.btn.gh{background:transparent;color:#fff;box-shadow:none;border-color:#ffffff55}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{display:inline-block;width:auto;font-size:15px;padding:9px 14px;margin:4px}
.card{background:var(--card);border:3px solid #ffffff2a;border-radius:16px;padding:14px;margin:12px 0}
label{display:block;font-weight:700;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:700 18px "Trebuchet MS",system-ui,sans-serif;padding:12px;border-radius:12px;border:3px solid #ffffff55;background:#150c2b;color:#fff}
input:focus,select:focus{outline:none;border-color:var(--cy)}
.codein{text-align:center;letter-spacing:10px;text-transform:uppercase;font:900 32px "Courier New",monospace}
.hero{display:block;width:100%;max-width:360px;margin:8px auto;border:4px solid #fff;border-radius:14px;background:#fff;box-shadow:6px 6px 0 var(--mg)}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
/* Rollen */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{background:#150c2b;border:3px solid #ffffff33;border-radius:14px;padding:10px;text-align:center;cursor:pointer;color:#fff;font:inherit}
.role b{display:block;font-size:15px}.role small{display:block;color:var(--mut);font-size:12.5px;line-height:1.25;margin-top:3px}
.role .re{font-size:34px;display:block}
.role.on{border-color:var(--ye);background:#3b2680;box-shadow:0 0 0 3px #ffe14a55}
.role .jk{display:inline-block;margin-top:5px;background:var(--cy);color:#1b1035;border-radius:99px;padding:1px 9px;font-weight:800;font-size:12px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.av{font-size:26px;background:#150c2b;border:3px solid #ffffff33;border-radius:12px;padding:4px 0;cursor:pointer;color:#fff}
.av.on{border-color:var(--ye);background:#3b2680}
/* Spiel */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.hud span{background:#150c2b;border:2px solid #ffffff33;border-radius:99px;padding:4px 12px}
.hud button{background:#150c2b;border:2px solid #ffffff33;border-radius:99px;color:#fff;font-size:18px;padding:2px 10px;cursor:pointer}
.stage{position:relative}
#cv{display:block;width:100%;aspect-ratio:5/3;background:#fff;border:4px solid #fff;border-radius:14px;box-shadow:6px 6px 0 var(--cy)}
#cv.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(1.035)}100%{transform:scale(1)}}
.banner{position:absolute;left:8px;right:8px;bottom:10px;text-align:center;font:900 22px "Courier New",monospace;color:#1b1035;background:var(--gr);border:3px solid #fff;border-radius:12px;padding:6px;display:none}
.banner.show{display:block}
.dots{display:flex;gap:6px;margin:12px 0 8px}
.dots i{flex:1;height:10px;border-radius:3px;background:#ffffff26}
.dots i.on{background:var(--cy)}.dots i.cur{background:var(--ye);box-shadow:0 0 10px var(--ye)}
.bar{height:10px;background:#ffffff22;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mg),var(--ye))}
.pts{text-align:center;font:900 20px "Courier New",monospace;margin:8px 0;color:var(--ye)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{font:800 18px "Trebuchet MS",system-ui,sans-serif;color:#1b1035;background:#fff;border:3px solid #fff;border-radius:14px;box-shadow:0 5px 0 #000b;padding:15px 6px;min-height:60px;cursor:pointer}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #000b}
.opt.bad{background:var(--rd);color:#fff;opacity:.55;animation:shake .3s}
.opt.gone{visibility:hidden}
.opt.good{background:var(--gr)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.jok{display:flex;gap:10px;align-items:center;margin-top:12px;min-height:44px}
.hint{color:var(--ye);font-weight:700}
.res{font:900 24px "Courier New",monospace;text-align:center;padding:8px;border-radius:12px;margin-bottom:10px;border:3px solid #fff;color:#1b1035}
.res.ok{background:var(--gr)}.res.no{background:var(--rd);color:#fff}.res.to{background:var(--ye)}.res.host{background:var(--cy)}
.nm{font:900 30px "Courier New",monospace;text-align:center;margin:12px 0 2px}
.sr{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.sr b{width:42px;font:900 15px "Courier New",monospace}
.sb{flex:1;height:14px;background:#ffffff22;border-radius:4px;overflow:hidden}.sb i{display:block;height:100%;background:var(--cy)}
.sr.y25 .sb i{background:var(--mg)}
.fact{background:#150c2b;border-left:6px solid var(--ye);border-radius:8px;padding:10px 12px;margin:10px 0}
.meme{position:relative;border-radius:12px;border:3px solid #fff;padding:10px 8px;margin:12px 0;text-align:center;font:900 20px/1.1 Impact,"Arial Black",sans-serif;text-transform:uppercase;color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000}
.meme .me{display:block;font-size:54px;margin:6px 0;text-shadow:none}
.lb{list-style:none;margin:8px 0;padding:0}
.lb li{display:flex;align-items:center;gap:8px;background:#150c2b;border-radius:10px;padding:7px 10px;margin:5px 0;font-weight:700}
.lb li.me{border:2px solid var(--ye)}
.lb .rk{width:28px;font:900 16px "Courier New",monospace;color:var(--ye)}
.lb .sc{margin-left:auto;font:900 16px "Courier New",monospace}
.big{font:900 64px/1 "Courier New",monospace;text-align:center;color:var(--ye);text-shadow:4px 4px 0 var(--mg)}
.cd{font:900 120px/1 "Courier New",monospace;text-align:center;color:var(--ye);text-shadow:6px 6px 0 var(--mg),12px 12px 0 var(--cy)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#150c2b;border:2px solid #ffffff33;border-radius:99px;padding:5px 12px;font-weight:700}
.chip button{background:none;border:0;color:var(--rd);font-size:16px;cursor:pointer;margin-left:4px}
.qr{background:#fff;border-radius:14px;padding:8px;max-width:340px;margin:0 auto}.qr svg{display:block;width:100%;height:auto}
.code{font:900 56px "Courier New",monospace;letter-spacing:10px;text-align:center;color:var(--ye);text-shadow:4px 4px 0 var(--mg)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.yr{display:flex;gap:8px;margin:8px 0}.yr button{flex:1}
.cr{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.cr img{width:34px;height:26px;object-fit:contain;background:#fff;border-radius:5px;padding:1px}
.cr .nn{width:104px;font-weight:700}
.cr .sb{height:16px}.cr .pp{width:62px;text-align:right;font:800 13px "Courier New",monospace}
details{margin:10px 0}summary{cursor:pointer;font-weight:800;color:var(--cy)}
.tag{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid #ffffff22;text-align:left}
.err{color:var(--rd);font-weight:800;min-height:22px}
.foot{color:var(--mut);font-size:12px;margin-top:22px;text-align:center}
</style></head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px">Bitte JavaScript aktivieren.</p></noscript>
<script>var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';

/* ===================== Hilfen ===================== */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let MUTE=false;try{MUTE=localStorage.getItem('pm_mute')==='1'}catch(e){}
let AC=null;
function beep(f,d,tp,v){if(MUTE||M==='host')return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=tp||'square';o.frequency.value=f;g.gain.value=v||0.035;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){return ''}}
async function api(a,body){try{const x=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({a},body||{}))});return await x.json()}catch(e){return {ok:false,err:'Keine Verbindung zum Server'}}}

  tryUrl(BASE+'/api/pmlogo?id='+b.id,()=>tryUrl(b.u,()=>tryUrl(b.u.replace('thumb.wikimedia.org','upload.wikimedia.org'),null)));
}).then(ok=>{loaded++;updLoad();return ok})}

function makeSrc(id,w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,w,h);
  const im=IMG[id];
  if(im){const s=Math.min(w*0.84/im.naturalWidth,h*0.78/im.naturalHeight);const iw=im.naturalWidth*s,ih=im.naturalHeight*s;x.imageSmoothingQuality='high';x.drawImage(im,(w-iw)/2,(h-ih)/2,iw,ih)}
  else{x.fillStyle='#bbb';x.font='900 '+Math.round(h*0.5)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('❓',w/2,h/2)}
  return c;
}
function drawMosaic(ctx,src,g){
  const w=src.width,h=src.height;
  if(g>=999){ctx.drawImage(src,0,0);return}
  const cols=g,rows=Math.max(2,Math.round(g*h/w));
  let data=null;try{data=src.getContext('2d').getImageData(0,0,w,h).data}catch(e){}
  if(!data){const t=document.createElement('canvas');t.width=cols;t.height=rows;const tc=t.getContext('2d');tc.imageSmoothingEnabled=true;tc.drawImage(src,0,0,cols,rows);ctx.imageSmoothingEnabled=false;ctx.drawImage(t,0,0,cols,rows,0,0,w,h);return}
  const cw=w/cols,ch=h/rows;
  for(let j=0;j<rows;j++){const y0=Math.floor(j*ch),y1=Math.max(y0+1,Math.floor((j+1)*ch));
    for(let i=0;i<cols;i++){const x0=Math.floor(i*cw),x1=Math.max(x0+1,Math.floor((i+1)*cw));
      let r=0,gg=0,b=0,n=0;
      for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const p=(y*w+x)*4;r+=data[p];gg+=data[p+1];b+=data[p+2];n++}
      ctx.fillStyle='rgb('+(r/n|0)+','+(gg/n|0)+','+(b/n|0)+')';ctx.fillRect(x0,y0,x1-x0,y1-y0)}}
}

async function syncTime(){let best=null;for(let i=0;i<3;i++){const t0=Date.now();const x=await api('time');const t1=Date.now();if(x&&x.ok){const rtt=t1-t0,off=x.t+rtt/2-t1;if(!best||rtt<best.rtt)best={rtt,off}}}if(best)R.off=best.off;return !!best}
function buildQs(seed,count,pool){
  const r=rng(seed),ids=shuffle(pool.map(b=>b.id),r).slice(0,count);
  const all=BR.map(b=>b.id);
  return ids.map(id=>{const others=shuffle(all.filter(x=>x!==id),r).slice(0,3);return {id,opts:shuffle([id].concat(others),r)}});
}

function heroStart(){
  clearInterval(heroT);const cv=$('#hero');if(!cv)return;const ctx=cv.getContext('2d');heroS=0;

    drawMosaic(ctx,src,STAGES[Math.min(heroS,NS-1)]===999?999:Math.max(3,Math.round(STAGES[heroS]*0.45)));

  bindRoles();$('#bk').onclick=homeView;
  $('#go').onclick=()=>{
    const pool=avail();if(pool.length<4)return;
    const n=Math.min(+$('#nr').value,pool.length);
    M='solo';Object.assign(G,{cfg:{rounds:n,step:+$('#sp').value,brk:7000},role:pick.role,score:0,streak:0,correct:0,log:[],jUsed:false,r:-1,reported:{}});
    G.qs=buildQs(Math.floor(Math.random()*2e9),n,pool);G.sph='play';G.t0=Date.now();V='play';beep(440,.08);
    startRound(0);
  };

function clock(){
  if(M==='solo'){if(G.sph==='play'&&Date.now()-G.t0>=playMs())return {r:G.r,ph:'brk',t:0};return {r:G.r,ph:G.sph,t:G.sph==='play'?Date.now()-G.t0:Date.now()-G.t0}}
  const t=srvNow()-R.st;
  if(R.ph==='end'||t>=R.cfg.rounds*roundMs())return {ph:'done'};
  if(t<0)return {ph:'pre',t};
  const r=Math.floor(t/roundMs()),tin=t-r*roundMs();
  return {r,ph:tin<playMs()?'play':'brk',t:tin};
}

function answer(id){
  if(G.answered||G.vph!=='play'||M==='host')return;
  const c=clock();if(c.ph!=='play')return;
  const stage=Math.min(NS-1,Math.floor(c.t/stepMs()));
  if(id===G.q.id){
    const base=Math.max(0,PTS[stage]-15*G.wrong.length),bonus=base>0?Math.min(50,G.streak*10):0;
    G.rpts=base+bonus;G.rms=c.t;G.score+=G.rpts;G.streak++;G.correct++;G.answered=true;
    G.log.push({id:G.q.id,pts:G.rpts,ok:true});

    document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.o===id)o.classList.add('good');o.disabled=true});
    const bn=$('#bn');if(bn){bn.textContent='✅ +'+G.rpts+(bonus?' (🔥 +'+bonus+')':'');bn.classList.add('show')}
    $('#pts').textContent='';jokerBtn();hud();beep(660,.1);setTimeout(()=>beep(880,.15),110);
    G.reported[G.r]=1;report();
    if(M==='solo')setTimeout(()=>{if(G.vph==='play'){G.sph='brk';G.t0=Date.now();enterBreak()}},900);
  }else{
    G.wrong.push(id);G.streak=0;

    $('#pts').textContent='Jetzt gibt es '+Math.max(0,PTS[stage]-15*G.wrong.length)+' Punkte';hud();beep(140,.2,'sawtooth');

function tick(){
  if(M==='home')return;
  if(M!=='solo'){
    if(V==='pre'){const t=srvNow()-R.st;if(t<0){const e=$('#cd');if(e){const n=Math.ceil(-t/1000);if(e.textContent!=n){e.textContent=n;beep(500,.07)}}return}V='play';G.r=-1;G.vph='';G.reported={};G.score=0;G.streak=0;G.correct=0;G.jUsed=false;G.log=[];G.qs=buildQs(R.seed,R.cfg.rounds,BR);beep(880,.2)}
    if(V!=='play')return;
  }else if(V!=='play')return;
  const c=clock();
  if(c.ph==='done'){goEnd();return}
  if(c.ph==='pre')return;
  if(c.r!==G.r){if(c.r<0||c.r>=G.qs.length)return;startRound(c.r)}
  if(c.ph==='play'){
    if(G.vph!=='play'){startRound(c.r)}
    const st=Math.min(NS-1,Math.floor(c.t/stepMs()));
    if(!G.answered&&st!==G.stage)setStage(st);
    updateBar(c.t);
  }else if(c.ph==='brk'){
    if(G.vph!=='brk')enterBreak();
    if(M!=='solo')updateBrk(c);
  }
}

    if(!x||!x.ok){$('#he').textContent=(x&&x.err)||'Fehler';$('#hc').disabled=false;return}
    M='host';Object.assign(R,{code:x.c,hk:x.hk,cfg:x.cfg,seed:x.seed,rname:x.name,ph:'lobby',st:0,players:[]});
    ls.set('pm_host',{c:x.c,hk:x.hk});await syncTime();hostLobby();startPoll();
  };
}
async function resumeHost(){
  const st=ls.get('pm_host');if(!st)return hostSetup();
  const x=await api('hstate',{c:st.c,hk:st.hk});
  if(!x||!x.ok){ls.del('pm_host');alert((x&&x.err)||'Raum nicht gefunden.');return hostSetup()}
  M='host';Object.assign(R,{code:st.c,hk:st.hk,cfg:x.cfg,seed:x.seed,rname:x.name,ph:x.ph,st:x.st,players:x.players});
  await syncTime();startPoll();
  if(x.ph==='play'){V='pre';G.qs=[];app('<div class="wrap"><div class="cd" id="cd">–</div></div>')}
  else if(x.ph==='end'){V='end';hostEndView()}else hostLobby();
}
function hostLobby(){
  V='host-lobby';const url=JOINURL+'?raum='+R.code;
  app('<div class="wrap wide"><div class="h1" style="font-size:30px">Pixel-Marken</div>'+
   '<div class="grid2"><div><div class="card" style="text-align:center"><div class="sub">Scannen oder auf <b>'+esc(location.host||'lernspiele')+'</b> den Code eingeben:</div><div class="code">'+esc(R.code)+'</div><div class="qr">'+qrSvg(url)+'</div>'+
   '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm cy" id="cp">🔗 Link kopieren</button></div><div class="tag" id="ul" style="word-break:break-all">'+esc(url)+'</div></div></div>'+
   '<div><div class="card"><b>👥 Im Raum: <span id="pc">0</span></b><div class="chips" id="chips" style="margin-top:8px"></div></div>'+
   '<div class="card"><b>Einstellungen</b><label>Runden</label><select id="hr"><option value="5">5 Marken</option><option value="8">8 Marken</option><option value="14">Alle 14 Marken</option></select><label>Tempo</label><select id="hs"><option value="4000">Gemütlich (4 s)</option><option value="3000">Normal (3 s)</option><option value="2000">Schnell (2 s)</option></select></div>'+
   '<button class="btn gr" id="st">▶ Spiel starten</button><button class="btn gh" id="cl">Raum schließen</button></div></div>'+
   '<details><summary>👩‍🏫 Einsatz im Unterricht</summary><div class="card">Ablauf: Raum zeigen → Schüler beitreten lassen → starten. Jede Runde dauert ca. '+Math.round((NS*R.cfg.step+7000)/1000)+' s. Nach dem Spiel die Grafik „Marktanteile 2007 vs. 2025“ besprechen: Wer hat verloren, wer gewonnen, und warum? Rollen und Joker lassen sich als Teamidee nutzen („Wer übernimmt welche Rolle?“).</div></details></div>');
  $('#hr').value=String(R.cfg.rounds);$('#hs').value=String(R.cfg.step);
  const upd=async()=>{const x=await api('cfg',{c:R.code,hk:R.hk,cfg:{rounds:+$('#hr').value,step:+$('#hs').value}});if(x&&x.ok)R.cfg=x.cfg};
  $('#hr').onchange=upd;$('#hs').onchange=upd;
  $('#cp').onclick=()=>{try{navigator.clipboard.writeText(url).then(()=>{$('#cp').textContent='✅ Kopiert'})}catch(e){prompt('Link kopieren:',url)}};
  $('#cl').onclick=async()=>{if(!confirm('Raum wirklich schließen? Alle Schüler werden getrennt.'))return;await api('close',{c:R.code,hk:R.hk});stopPoll();ls.del('pm_host');M='home';homeView()};
  $('#st').onclick=async()=>{
    $('#st').disabled=true;await upd();
    const x=await api('start',{c:R.code,hk:R.hk});
    if(!x||!x.ok){$('#st').disabled=false;alert((x&&x.err)||'Fehler');return}
    await syncTime();R.ph='play';R.st=x.st;G.r=-1;G.vph='';G.qs=buildQs(R.seed,R.cfg.rounds,BR);
    V='pre';app('<div class="wrap"><div class="h1" style="font-size:30px;text-align:center">Gleich geht’s los!</div><div class="cd" id="cd">–</div></div>');
  };
  hostLobbyUpd();
}
function hostLobbyUpd(){
  const c=$('#chips');if(!c)return;$('#pc').textContent=R.players.length;
  c.innerHTML=R.players.map(p=>'<span class="chip">'+esc(p.e)+' '+esc(p.n)+' <small class="mut">'+((ROLES.find(r=>r.id===p.ro)||{}).e||'')+'</small><button data-k="'+esc(p.id)+'" title="Entfernen">✕</button></span>').join('')||'<span class="mut">Noch niemand …</span>';
  c.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{await api('kick',{c:R.code,hk:R.hk,pid:b.dataset.k});R.players=R.players.filter(p=>p.id!==b.dataset.k);hostLobbyUpd()});
}
function hostTop(){const t=$('#top');if(!t)return;
  const li=(i,p,r)=>'<li><span class="rk">'+(i+1)+'.</span>'+esc(p.e)+' '+esc(p.n)+'<span class="sc">'+r+'</span></li>';
  if(t.tagName==='OL'){t.innerHTML=R.players.slice(0,8).map((p,i)=>li(i,p,p.s)).join('')||'<li class="mut">Noch keine Punkte</li>';return}
  const rl=R.players.filter(p=>p.rr&&p.rr[G.r]).map(p=>({p,v:p.rr[G.r]})).sort((x,y)=>y.v[0]-x.v[0]||(x.v[0]?x.v[1]-y.v[1]:0));
  t.innerHTML='<h3>⚡ Beste dieser Runde</h3><ol class="lb">'+(rl.slice(0,8).map((x,i)=>li(i,x.p,x.v[0]?'+'+x.v[0]+' · '+fs_(x.v[1]):'–')).join('')||'<li class="mut">Noch keine Antworten</li>')+'</ol><h3>🏆 Gesamt</h3><ol class="lb">'+(R.players.slice(0,8).map((p,i)=>li(i,p,p.s)).join('')||'<li class="mut">–</li>')+'</ol>'}
async function hostSkip(){
  const c=clock();if(c.ph!=='play'&&c.ph!=='brk')return;
  const d=c.ph==='play'?playMs()-c.t:roundMs()-c.t;
  const x=await api('skip',{c:R.code,hk:R.hk,d:Math.ceil(d)+50});if(x&&x.ok){R.st=x.st}
}
async function hostEnd(){if(!confirm('Spiel jetzt beenden und die Ergebnisse zeigen?'))return;await api('end',{c:R.code,hk:R.hk});R.ph='end'}
function avgT(p){const v=Object.values(p.rr||{}).filter(x=>x[0]>0);return v.length?fs_(v.reduce((s,x)=>s+x[1],0)/v.length):'–'}
function hostWinners(){const o=[];for(let r=0;r<R.cfg.rounds;r++){const l=R.players.filter(p=>p.rr&&p.rr[r]&&p.rr[r][0]>0).sort((x,y)=>y.rr[r][0]-x.rr[r][0]||x.rr[r][1]-y.rr[r][1]);o.push(l.length?[l[0].n,l[0].e,l[0].rr[r][0],l[0].rr[r][1]]:null)}return o}
async function hostEndView(){
  const x=await api('hstate',{c:R.code,hk:R.hk});if(x&&x.ok)R.players=x.players;
  const pl=R.players,medal=['🥇','🥈','🥉'];
  app('<div class="wrap wide"><div class="h1" style="font-size:30px">Ergebnis</div>'+
   '<div class="grid2"><div class="card"><table><tr><th>#</th><th>Name</th><th>Rolle</th><th>Treffer</th><th>Ø Zeit</th><th>Punkte</th></tr>'+
   pl.map((p,i)=>'<tr><td>'+(medal[i]||i+1)+'</td><td>'+esc(p.e)+' '+esc(p.n)+'</td><td>'+((ROLES.find(r=>r.id===p.ro)||{}).e||'')+'</td><td>'+p.c+'/'+R.cfg.rounds+'</td><td>'+avgT(p)+'</td><td><b>'+p.s+'</b></td></tr>').join('')+'</table></div>'+
   '<div>'+winnersHTML(hostWinners())+chartHTML()+learnHTML()+'<button class="btn cy" id="csv">⬇ Ergebnis als CSV</button><button class="btn gr" id="nw">🔄 Neues Spiel (gleicher Raum)</button><button class="btn gh" id="cl">Raum schließen</button></div></div></div>');
  bindChart();
  $('#csv').onclick=()=>{const rows=[['Platz','Name','Rolle','Treffer','Ø Zeit (s)','Punkte']].concat(pl.map((p,i)=>[i+1,p.n,p.ro,p.c,avgT(p).replace(' s',''),p.s]));const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pixel-marken-'+R.code+'.csv';a.click()};
  $('#nw').onclick=async()=>{const x=await api('reset',{c:R.code,hk:R.hk});if(x&&x.ok){R.ph='lobby';R.seed=x.seed;R.st=0;G.r=-1;G.vph='';hostLobby()}};
  $('#cl').onclick=async()=>{await api('close',{c:R.code,hk:R.hk});stopPoll();ls.del('pm_host');M='home';homeView()};
}

/* ===================== Start ===================== */
homeView();preload();
</script>
