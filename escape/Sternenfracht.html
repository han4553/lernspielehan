<title>Sternenfracht – Mission Supercell</title>
<style>

<div id="stars"></div><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);

function vEnd(){const v=verdict(S.cells),by={};S.log.forEach(l=>{const k=/Antrieb/.test(l.w)?'Flugzeit (Antrieb)':/Hilfe/.test(l.w)?'Hilfen':/Händler|Ersatzteil/.test(l.w)?'Ersatzteil':/Firewall/.test(l.w)?'Firewall-Update':/Leck|Sauerstoff/.test(l.w)?'Leck':'Sonstiges';by[k]=(by[k]||0)+l.n});
 const d=S.dec,dl=DEALERS[d.dealer];
 return `<div class="hero"><div style="font-size:80px">🌍</div><h1>Gelandet!</h1><div class="big">🔋 ${S.cells} <span style="font-size:.4em;color:var(--mu)">von ${START}</span></div><h2>${v[0]}</h2><p>${v[1]}</p><p class="sub">Gesamtspielzeit ${mmss(S.total)}</p></div>
 <div class="card"><h3>Wo sind die Supercells geblieben?</h3><div class="tw"><table>${Object.keys(by).map(k=>`<tr><td>${k}</td><td>−${by[k]}</td></tr>`).join('')||'<tr><td>Keine Verluste</td><td></td></tr>'}</table></div></div>
 <div class="card"><h2>Missionsauswertung</h2><p class="sub">Was ihr erlebt habt, hat in der Wirtschaftslehre einen Namen.</p>
 <h3>Raum 1 · Bedürfnisse</h3><p>Nicht alles ist gleich dringend. <b>Existenzbedürfnisse</b> (Sauerstoff, Wasser, Nahrung) kommen vor <b>Kulturbedürfnissen</b> (Musik, Bücher) und <b>Luxusbedürfnissen</b> (Parfüm, Schmuck).</p>

 <h3>Raum 3 · Maximalprinzip</h3><p>Fünf Schrauben waren gegeben, der Sauerstoff sollte möglichst hoch sein: <b>mit gegebenen Mitteln den größten Ertrag</b>. ${d.o2==null?'':'Ihr habt '+d.o2+' % erreicht'+(d.o2>=O2BASE+O2OPT.v?' – das Optimum.':', möglich waren '+(O2BASE+O2OPT.v)+' %.')}</p>
 <h3>Raum 4 · Minimalprinzip</h3><p>Das Ersatzteil stand fest, der Preis nicht: <b>ein gegebenes Ziel mit möglichst geringen Mitteln</b>. ${dl?'Ihr habt bei '+dl.n+' für '+dl.p+' Supercells gekauft'+(dl.p===4?' – das günstigste Angebot.':', das günstigste Angebot lag bei 4.'):''}</p>
 <h3>Raum 5 · Opportunitätskosten</h3><p>Nur ein Update war möglich. Wer das eine wählt, verzichtet auf den Nutzen des anderen: <b>Opportunitätskosten</b>. ${d.upd==='fw'?'Ihr habt die Firewall gewählt: kurzer Code, dafür 2 Supercells.':d.upd==='av'?'Ihr habt das Antivirus-Update gewählt: keine Supercells, dafür mehr Zeit.':''}</p></div>
 <div class="card"><h3>Für das Gespräch in der Klasse</h3><ol><li>An welcher Stelle habt ihr Supercells gegen Zeit getauscht? War es das wert?</li><li>Wie habt ihr an der Tankstation entschieden – und warum?</li><li>Wo begegnen euch Maximal- und Minimalprinzip im Ausbildungsbetrieb oder im Alltag?</li><li>Nennt eine Entscheidung von heute Morgen. Was waren ihre Opportunitätskosten?</li></ol>
 <button class="btn" onclick="S.phase='quiz';S.quiz=S.quiz||{i:0,p:0,a:null};saveLocal();render();window.scrollTo(0,0)">Logbuch-Check (5 Fragen)</button> <button class="btn g" onclick="if(confirm('Mission wirklich verlassen?')){clearLocal();S=null;V='start';render()}">Zur Startseite</button></div>`}

function handbook(r,s){const gen=`<h3>Crew-Regeln</h3><ul><li>An Bord: ${START} Supercells. Alle 3 Minuten verbraucht der Antrieb eine davon.</li><li>Pro Raum habt ihr 9 Minuten. Danach schleust NOVA euch weiter – nicht genutzte Hilfen und 9 Minuten Flugzeit sind dann trotzdem bezahlt.</li><li>Drei Hilfen pro Raum: 1, 2 und 4 Supercells.</li><li>Nur die Spielleitung loggt Lösungen ein.</li></ul>`;
 const ch=[
 `<h3>Kapitel 1 · Ladevorschrift</h3><p>Platz 1 liegt direkt an der Tür, Platz 7 ganz hinten im Heck. Was die Crew am dringendsten braucht, steht am nächsten an der Tür.</p>
 <p><b>Bedürfnisarten</b><br>1. <b>Existenzbedürfnisse</b>: Ohne ihre Befriedigung kann der Mensch nicht überleben.<br>2. <b>Kulturbedürfnisse</b>: Sie machen das Leben reicher, zum Beispiel Bildung, Musik und Unterhaltung.<br>3. <b>Luxusbedürfnisse</b>: Sie gehen über den normalen Lebensstandard hinaus, zum Beispiel teurer Schmuck oder edle Düfte.</p>
 <p><b>Notiz der Bordärztin:</b> »Ohne Sauerstoff hält ein Mensch nur wenige Minuten durch, ohne Wasser etwa drei Tage, ohne Nahrung etwa drei Wochen.«</p>
 <p><b>Notiz des Lademeisters:</b> »Bei Kultur- und Luxusgütern gilt: Innerhalb derselben Bedürfnisart steht die leichtere Kiste näher an der Tür.«</p>`,
 `<h3>Kapitel 2 · Schaltplan Lichtantrieb</h3><p>Die Buchsen sind von links nach rechts mit 1 bis 5 nummeriert. Jedes Kabel gehört in genau eine Buchse:</p>
 <ol><li>Gelb steckt ganz außen.</li><li>Rot steckt direkt links neben Grün.</li><li>Blau steckt weder neben Grün noch neben Gelb.</li><li>Violett steckt irgendwo rechts von Grün.</li><li>Blau steckt irgendwo links von Rot.</li></ol>
 <p><b>Sektor-Info:</b> Die Tankstation »Letzter Tropfen« hat nur noch 10 Einheiten Treibstoff. Gemeldete Schiffe im Anflug: mehrere.</p>`,
 `<h3>Kapitel 3 · Rumpfplatten verschrauben</h3><p>Jedes Loch hat eine <b>Kopfform</b> (✚ Kreuz, ⬢ Sechskant, ▬ Schlitz) und eine <b>Tiefe</b> (kurz oder lang). Die Zahl am Loch zeigt, wie viele Prozentpunkte Sauerstoff eine Schraube dort hält.</p>
 <ul><li>Die Kopfform muss passen.</li><li>Eine <b>lange</b> Schraube hält auch in einem kurzen Loch. Eine <b>kurze</b> Schraube hält in einem langen Loch nicht.</li><li>Ohne Platte bleiben ${O2BASE} % Sauerstoff im Raum.</li></ul><p>Ihr könnt jede Verschraubung einloggen. NOVA prüft danach, ob mit euren Schrauben mehr möglich gewesen wäre.</p>`,

 <p><b>Händler-Info:</b> Ersatzteile werden in Supercells bezahlt. Mit jeder Stufe der Funkreichweite erreicht ihr weiter entfernte Händler. Eine Erhöhung dauert einige Sekunden.</p>`,
 `<h3>Kapitel 5 · Cyberabwehr</h3><p>Die Piraten haben das Alphabet des Bordcomputers vertauscht: Jeder Buchstabe wurde durch einen anderen ersetzt, immer durch denselben. Tippt ein Feld an und wählt den richtigen Buchstaben.</p>
 <p><b>Firewall-Update:</b> kurzer Code, keine Buchstaben vorgegeben. Die Installation verbraucht 2 Supercells.<br><b>Antivirus-Update:</b> langer Code, viele Buchstaben sind schon bekannt. Die Installation verbraucht keine Supercells.</p>

 return `<h2>📖 Bordhandbuch</h2>${ch[r]}<hr style="border-color:#5a4520">${gen}`}

 ${[0,1,2,3,4].map(i=>`<g data-t="sock" onclick="p2sock(${i})" style="cursor:pointer"><rect x="${X(i)-26}" y="188" width="52" height="42" rx="8" fill="#1b2756" stroke="#5a6fc4" stroke-width="2"/><text x="${X(i)}" y="216" text-anchor="middle" font-size="18" font-weight="800" fill="#e9efff">${i+1}</text></g>`).join('')}</svg></div>

 return `<h2>🛠️ Rumpfplatte verschrauben</h2><p class="sub">Schraube antippen, dann ein Loch. Eine gesetzte Schraube lässt sich durch Antippen wieder lösen.</p>

function p5(){const u=S.r.upd;if(!u)return `<h2>🖥️ Cyberangriff!</h2><p>NOVA: »Ich kann nur <b>ein</b> Update installieren. Welches soll es sein?«</p>
